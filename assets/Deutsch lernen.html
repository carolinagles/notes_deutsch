03ctr>\u003cth>Persona\u003c/th>\u003cth class=\"hv\">machen\u003cbr>\u003csmall>hacer\u003c/small>\u003c/th>\u003cth class=\"hv\">sein\u003cbr>\u003csmall>ser/estar\u003c/small>\u003c/th>\u003cth class=\"hv\">haben\u003cbr>\u003csmall>tener\u003c/small>\u003c/th>\u003cth class=\"hv\">werden\u003cbr>\u003csmall>volverse\u003c/small>\u003c/th>\u003cth class=\"hv\">fahren\u003cbr>\u003csmall>ir en vehículo\u003c/small>\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>ich\u003c/td>\u003ctd>\u003cmark class=\"v\">mache\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">bin\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">habe\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">werde\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">fahre\u003c/mark>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>du\u003c/td>\u003ctd>\u003cmark class=\"v\">machst\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">bist\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">hast\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">wirst\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">fährst\u003c/mark>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>er / sie / es\u003c/td>\u003ctd>\u003cmark class=\"v\">macht\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">ist\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">hat\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">wird\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">fährt\u003c/mark>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>wir\u003c/td>\u003ctd>\u003cmark class=\"v\">machen\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">sind\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">haben\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">werden\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">fahren\u003c/mark>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ihr\u003c/td>\u003ctd>\u003cmark class=\"v\">macht\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">seid\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">habt\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">werdet\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">fahrt\u003c/mark>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>sie / Sie\u003c/td>\u003ctd>\u003cmark class=\"v\">machen\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">sind\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">haben\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">werden\u003c/mark>\u003c/td>\u003ctd>\u003cmark class=\"v\">fahren\u003c/mark>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003c!-- TIEMPOS VERBALES -->\n\u003ch2>Tiempos y modos verbales\u003c/h2>\n\u003cp class=\"note\">Cada tiempo tiene su color en la primera columna. En los ejemplos el verbo siempre va en azul.\u003c/p>\n\u003cdiv class=\"scroll\">\u003ctable style=\"min-width:760px\">\n\u003cthead>\u003ctr>\u003cth>Tiempo\u003c/th>\u003cth>Cómo se forma\u003c/th>\u003cth>Ejemplo\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"t t1\">\u003ctd>Präsens\u003csmall>presente\u003c/small>\u003c/td>\u003ctd class=\"form\">raíz + -e, -st, -t, -en, -t, -en\u003c/td>\u003ctd>\u003cdiv class=\"ex\">\n  \u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Ich \u003cmark class=\"v\">spiele\u003c/mark> \u003cmark class=\"m a\">den Ball\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">I \u003cmark class=\"v\">play\u003c/mark> \u003cmark class=\"m a\">the ball\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"v\">Juego\u003c/mark> \u003cmark class=\"m a\">la pelota\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\n  \u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"f\">Die Mutter\u003c/mark> \u003cmark class=\"v\">kocht\u003c/mark> \u003cmark class=\"f a\">die Suppe\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"f\">The mother\u003c/mark> \u003cmark class=\"v\">cooks\u003c/mark> \u003cmark class=\"f a\">the soup\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"f\">La madre\u003c/mark> \u003cmark class=\"v\">cocina\u003c/mark> \u003cmark class=\"f a\">la sopa\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\n  \u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"p\">Wir\u003c/mark> \u003cmark class=\"v\">helfen\u003c/mark> \u003cmark class=\"m d\">dem Nachbarn\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"p\">We\u003c/mark> \u003cmark class=\"v\">help\u003c/mark> \u003cmark class=\"m d\">the neighbor\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"v\">Ayudamos\u003c/mark> \u003cmark class=\"m d\">al vecino\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\n\u003ctr class=\"t t2\">\u003ctd>Präteritum\u003csmall>pasado simple\u003c/small>\u003c/td>\u003ctd class=\"form\">regular: raíz + -te\u003cbr>irregular: cambio vocálico (ging, war)\u003c/td>\u003ctd>\u003cdiv class=\"ex\">\n  \u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"f\">Die Frau\u003c/mark> \u003cmark class=\"v\">kaufte\u003c/mark> \u003cmark class=\"n a\">das Brot\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"f\">The woman\u003c/mark> \u003cmark class=\"v\">bought\u003c/mark> \u003cmark class=\"n a\">the bread\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"f\">La mujer\u003c/mark> \u003cmark class=\"v\">compró\u003c/mark> \u003cmark class=\"n a\">el pan\u003c s y caso\u003c/h2>\n\u003cdiv class=\"scroll\">\u003ctable style=\"min-width:700px\">\n\u003cthead>\u003ctr>\u003cth>Rigen\u003c/th>\u003cth>Preposiciones\u003c/th>\u003cth>Ejemplo\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"case cdat\">Dativ\u003c/td>\u003ctd>aus, bei, mit, nach, seit, von, zu, gegenüber\u003c/td>\u003ctd>\u003cdiv class=\"ex\">\n  \u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Ich \u003cmark class=\"v\">fahre\u003c/mark> mit \u003cmark class=\"m d\">dem Bus\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">I \u003cmark class=\"v\">go\u003c/mark> by \u003cmark class=\"m d\">bus\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"v\">Voy\u003c/mark> en \u003cmark class=\"m d\">autobús\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"case cakk\">Akkusativ\u003c/td>\u003ctd>durch, für, gegen, ohne, um, bis\u003c/td>\u003ctd>\u003cdiv class=\"ex\">\n  \u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"n\">Das Geschenk\u003c/mark> \u003cmark class=\"v\">ist\u003c/mark> für \u003cmark class=\"f a\">die Mutter\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"n\">The gift\u003c/mark> \u003cmark class=\"v\">is\u003c/mark> for \u003cmark class=\"f a\">the mother\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"n\">El regalo\u003c/mark> \u003cmark class=\"v\">es\u003c/mark> para \u003cmark class=\"f a\">la madre\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"case\">Wechsel&shy;präpositionen\u003cbr>\u003csmall style=\"font-weight:300\">¿dónde? → Dativ\u003cbr>¿hacia dónde? → Akkusativ\u003c/small>\u003c/ n{ background:var(--neu); }\nmark.p{ background:var(--pl); }\nmark.d{ box-shadow:inset 0 -3px 0 var(--dat-line); }\nmark.a{ box-shadow:inset 0 -3px 0 var(--akk-line); }\n\n/* leyenda */\n.legend{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:.6rem 1.2rem; background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:1.1rem 1.25rem; }\n.legend div{ display:flex; align-items:center; gap:.6rem; font-size:.95rem; }\n.sw{ width:2.2rem; height:1.35rem; border-radius:5px; flex:none; }\n.sw.line{ background:transparent; border-bottom:4px solid; border-radius:0; height:1rem; }\n.tenses{ display:flex; flex-wrap:wrap; gap:.45rem; margin-top:.9rem; }\n.chip{ color:var(--hl-ink); padding:.2rem .7rem; border-radius:999px; font-size:.88rem; font-weight:400; }\n\n/* tablas */\n.scroll{ overflow-x:auto; margin:.6rem 0 1rem; border:1px solid var(--rule); border-radius:14px; background:var(--surface); }\ntable{ border-collapse:collapse; width:100%; min-width:560px; }\nth,td{ padding:.6rem .8rem; text-align:left; vertical-align:top; border-bottom:1px solid var(--rule); }\ntr:last-child td{ border-bottom:none; }\nthead th{ font-weight:600; font-size:.9rem; }\nth.hm{ background:var(--mas); color:var(--hl-ink);} th.hf{ background:var(--fem); color:var(--hl-ink);}\nth.hn{ background:var(--neu); color:var(--hl-ink);} th.hp{ background:var(--pl); color:var(--hl-ink);}\nth.hakk{ background:var(--akk); color:var(--hl-ink);} th.hdat{ background:var(--dat); color:var(--hl-ink);}\nth.hv{ background:var(--verb); color:var(--hl-ink);}\ntd.case{ font-weight:600; white-space:nowrap; }\ntd.cakk{ box-shadow:inset 4px 0 0 var(--akk-line); } td.cdat{ box-shadow:inset 4px 0 0 var(--dat-line); }\n.big{ font-family:\"Literata\",Georgia,serif; font-size:1.15rem; }\n\n/* ejemplos */\n.ex{ display:grid; gap:.25rem; }\n.ex p{ margin:0; display:flex; gap:.55rem; align-items:baseline; }\n.ex .lg{ flex:none; font-size:.7rem; font-weight:600; width:1.9rem; text-align:center; border:1px solid var(--rule); border-radius:4px; color:var(--muted); padding:.05rem 0; }\n.ex .de{ font-family:\"Literata\",Georgia,serif; font-size:1.08rem; }\n.ex .en,.ex .es{ font-size:.93rem; color:var(--muted); }\n.ex .en mark,.ex .es mark{ color:var(--hl-ink); }\n.card{ background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:1rem 1.2rem; margin:.6rem 0; }\n\n/* tiempos */\ntr.t td:first-child{ font-weight:600; white-space:nowrap; }\ntr.t1 td:first-child{ background:var(--t1); color:var(--hl-ink);} tr.t2 td:first-child{ background:var(--t2); color:var(--hl-ink);}\ntr.t3 td:first-child{ background:var(--t3); color:var(--hl-ink);} tr.t4 td:first-child{ background:var(--t4); color:var(--hl-ink);}\ntr.t5 td:first-child{ background:var(--t5); color:var(--hl-ink);} tr.t6 td:first-child{ background:var(--t6); color:var(--hl-ink);}\ntr.t7 td:first-child{ background:var(--t7); color:var(--hl-ink);} tr.t8 td:first-child{ background:var(--t8); color:var(--hl-ink);}\ntr.t td:first-child small{ display:block; font-weight:300; font-size:.8rem; }\n.form{ font-size:.9rem; }\ntd > .ex + .ex{ margin-top:.8rem; padding-top:.8rem; border-top:1px dashed var(--rule); }\n\nfooter{ margin-top:3rem; color:var(--muted); font-size:.85rem; }\n@media (max-width:600px){ main{ padding:1.6rem 1rem 3rem; } h2{ font-size:1.35rem; } }\n\nmark.g{ box-shadow:inset 0 -3px 0 var(--gen-line); }\nth.hgen{ background:var(--gen); color:var(--hl-ink);} td.cgen{ box-shadow:inset 4px 0 0 var(--gen-line); }\ntr.t9 td:first-child{ background:var(--t9); color:var(--hl-ink);}\ntd > .ex + .ex{ margin-top:.8rem; padding-top:.8rem; border-top:1px dashed var(--rule); }\n.card + .card{ margin-top:.6rem; }\ntr.grp td{ font-weight:600; background:var(--bg); font-size:.92rem; }\ntd small.w{ color:var(--muted); font-size:.82rem; }\nnav.toc{ display:flex; flex-wrap:wrap; gap:.4rem; margin:1.4rem 0 0; }\nnav.toc a{ color:var(--ink); text-decoration:none; border:1px solid var(--rule); background:var(--surface); padding:.25rem .75rem; border-radius:999px; font-size:.88rem; }\nnav.toc a:hover{ border-color:var(--muted); }\nnav.toc a:focus-visible{ outline:2px solid var(--dat-line); outline-offset:2px; }\n.pct{ font-weight:600; }\n.dk{ display:inline-block; font-size:.75rem; font-weight:600; color:var(--muted); border:1px solid var(--rule); border-radius:999px; padding:.05rem .6rem; margin-bottom:.2rem; }\nmark b{ font-weight:700; text-decoration:underline; text-underline-offset:2px; }\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003ch1>Declinación del adjetivo en cada tiempo verbal\u003c/h1>\u003cp class=\"lead\">La terminación del adjetivo depende del artículo, el género y el caso, no del tiempo verbal. Aquí la practicas con los tres tipos de declinación en cada tiempo. La terminación va en negritas.\u003c/p>\u003cdiv class=\"legend\">\n\u003cdiv>\u003cspan class=\"sw\" style=\"background:var(--verb)\">\u003c/span>Verbo\u003c/div>\n\u003cdiv>\u003cspan class=\"sw\" style=\"background:var(--mas)\">\u003c/span>Singular masculino\u003c/div>\n\u003cdiv>\u003cspan class=\"sw\" style=\"background:var(--fem)\">\u003c/span>Singular femenino\u003c/div>\n\u003cdiv>\u003cspan class=\"sw\" style=\"background:var(--neu)\">\u003c/span>Singular neutro\u003c/div>\n\u003cdiv>\u003cspan class=\"sw\" style=\"background:var(--pl)\">\u003c/span>Plural\u003c/div>\n\u003cdiv>\u003cspan class=\"sw line\" style=\"border-color:var(--akk-line)\">\u003c/span>Akkusativ (subrayado rojo)\u003c/div>\n\u003cdiv>\u003cspan class=\"sw line\" style=\"border-color:var(--dat-line)\">\u003c/span>Dativ (subrayado azul marino)\u003c/div>\n\u003cdiv>\u003cspan class=\"sw line\" style=\"border-color:var(--gen-line)\">\u003c/span>Genitiv (subrayado mostaza)\u003c/div>\n\u003c/div>\n\u003cdiv class=\"tenses\">\n\u003cspan class=\"chip\" style=\"background:var(--t1)\">Präsens\u003c/span>\u003cspan class=\"chip\" style=\"background:var(--t2)\">Präteritum\u003c/span>\u003cspan class=\"chip\" style=\"background:var(--t3)\">Perfekt\u003c/span>\u003cspan class=\"chip\" style=\"background:var(--t4)\">Plusquamperfekt\u003c/span>\u003cspan class=\"chip\" style=\"background:var(--t5)\">Futur I\u003c/span>\u003cspan class=\"chip\" style=\"background:var(--t6)\">Futur II\u003c/span>\u003cspan class=\"chip\" style=\"background:var(--t9)\">Konjunktiv I\u003c/span>\u003cspan class=\"chip\" style=\"background:var(--t7)\">Konjunktiv II\u003c/span>\n\u003c/div>\n\u003cp class=\"note\">La terminación del adjetivo no cambia con el tiempo verbal: depende solo del artículo, el género y el caso. Aquí la practicas con los tres tipos de declinación en cada tiempo. La terminación va en negritas.\u003c/p>\u003cdiv class=\"scroll\">\u003ctable style=\"min-width:720px\">\u003cthead>\u003ctr>\u003cth>Tiempo\u003c/th>\u003cth>Débil · Mixta · Fuerte\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr class=\"t t1\">\u003ctd>Präsens\u003csmall>presente\u003c/small>\u003c/td>\u003ctd>\u003cdiv class=\"ex\">\u003cspan class=\"dk\">Débil\u003c/span>\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"m\">Der neu\u003cb>e\u003c/b> Kollege\u003c/mark> \u003cmark class=\"v\">hilft\u003c/mark> \u003cmark class=\"m d\">dem alt\u003cb>en\u003c/b> Mann\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"m\">The new colleague\u003c/mark> \u003cmark class=\"v\">helps\u003c/mark> \u003cmark class=\"m d\">the old man\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"m\">El nuevo colega\u003c/mark> \u003cmark class=\"v\">ayuda\u003c/mark> \u003cmark class=\"m d\">al hombre mayor\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"ex\">\u003cspan class=\"dk\">Mixta\u003c/span>\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"f\">Meine klein\u003cb>e\u003c/b> Schwester\u003c/mark> \u003cmark class=\"v\">hat\u003c/mark> \u003cmark class=\"m a\">einen schwarz\u003cb>en\u003c/b> Hund\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"f\">My little sister\u003c/mark> \u003cmark class=\"v\">has\u003c/mark> \u003cmark class=\"m a\">a black dog\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"f\">Mi hermana pequeña\u003c/mark> \u003cmark class=\"v\">tiene\u003c/mark> \u003cmark class=\"m a\">un perro negro\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"ex\">\u003cspan class=\"dk\">Fuerte\u003c/span>\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"n\">Frisch\u003cb>es\u003c/b> Obst\u003c/mark> \u003cmark class=\"v\">ist\u003c/mark> gesund.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"n\">Fresh fruit\u003c/mark> \u003cmark class=\"v\">is\u003c/mark> healthy.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"n\">La fruta fresca\u003c/mark> \u003cmark class=\"v\">es\u003c/mark> sana.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"t t2\">\u003ctd>Präteritum\u003csmall>pasado simple\u003c/small>\u003c/td>\u003ctd>\u003cdiv class=\"ex\">\u003cspan class=\"dk\">Débil\u003c/span>\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Wir \u003cmark class=\"v\">wohnten\u003c/mark> in \u003cmark class=\"n d\">dem groß\u003cb>en\u003c/b> Haus\u003c/mark> am See.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">We \u003cmark class=\"v\">lived\u003c/mark> in \u003cmark class=\"n d\">the big house\u003c/mark> by the lake.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"v\">Vivíamos\u003c/mark> en \u003cmark class=\"n d\">la casa grande\u003c/mark> junto al lago.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"ex\">\u003cspan class=\"dk\">Mixta\u003c/span>\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Er \u003cmark class=\"v\">trug\u003c/mark> \u003cmark class=\"m a\">einen elegant\u003cb>en\u003c/b> Anzug\u003c/mark> und \u003cmark class=\"f a\">eine rot\u003cb>e\u003c/b> Krawatte\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">He \u003cmark class=\"v\">wore\u003c/mark> \u003cmark class=\"m a\">an elegant suit\u003c/mark> and \u003cmark class=\"f a\">a red tie\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"v\">Llevaba\u003c/mark> \u003cmark class=\"m a\">un traje elegante\u003c/mark> y \u003cmark class=\"f a\">una corbata roja\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"ex\">\u003cspan class=\"dk\">Fuerte\u003c/span>\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Nach \u003cmark class=\"f d\">lang\u003cb>er\u003c/b> Diskussion\u003c/mark> \u003cmark class=\"v\">fanden\u003c/mark> wir \u003cmark class=\"f a\">eine Lösung\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">After \u003cmark class=\"f d\">long discussion\u003c/mark> we \u003cmark class=\"v\">found\u003c/mark> \u003cmark class=\"f a\">a solution\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">Tras \u003cmark class=\"f d\">una larga discusión\u003c/mark> \u003cmark class=\"v\">encontramos\u003c/mark> \u003cmark class=\"f a\">una solución\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"t t3\">\u003ctd>Perfekt\u003csmall>pasado compuesto\u003c/small>\u003c/td>\u003ctd>\u003cdiv class=\"ex\">\u003cspan class=\"dk\">Débil\u003c/span>\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Ich \u003cmark class=\"v\">habe\u003c/mark> \u003cmark class=\"p a\">die neu\u003cb>en\u003c/b> Schuhe\u003c/mark> \u003cmark class=\"v\">gekauft\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">I \u003cmark class=\"v\">have bought\u003c/mark> \u003cmark class=\"p a\">the new shoes\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"v\">He comprado\u003c/mark> \u003cmark class=\"p a\">los zapatos nuevos\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"ex\">\u003cspan class=\"dk\">Mixta\u003c/span>\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Sie \u003cmark class=\"v\">hat\u003c/mark> \u003cmark class=\"f d\">ihrer best\u003cb>en\u003c/b> Freundin\u003c/mark> \u003cmark class=\"m a\">einen lang\u003cb>en\u003c/b> Brief\u003c/mark> \u003cmark class=\"v\">geschrieben\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">She \u003cmark class=\"v\">has written\u003c/mark> \u003cmark class=\"m a\">a long letter\u003c/mark> to \u003cmark class=\"f d\">her best friend\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">Le \u003cmark class=\"v\">ha escrito\u003c/mark> \u003cmark class=\"m a\">una carta larga\u003c/mark> \u003cmark class=\"f d\">a su mejor amiga\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"ex\">\u003cspan class=\"dk\">Fuerte\u003c/span>\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Wir \u003cmark class=\"v\">haben\u003c/mark> mit \u003cmark class=\"p d\">gut\u003cb>en\u003c/b> Freunden\u003c/mark> \u003cmark class=\"v\">gefeiert\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">We \u003cmark class=\"v\">have celebrated\u003c/mark> with \u003cmark class=\"p d\">good friends\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"v\">Hemos celebrado\u003c/mark> con \u003cmark class=\"p d\">buenos amigos\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"t t4\">\u003ctd>Plusquamperfekt\u003csmall>pluscuamperfecto\u003c/small>\u003c/td>\u003ctd>\u003cdiv class=\"ex\">\u003cspan class=\"dk\">Débil\u003c/span>\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"m\">Der jung\u003cb>e\u003c/b> Arzt\u003c/mark> \u003cmark class=\"v\">hatte\u003c/mark> \u003cmark class=\"f a\">die schwierig\u003cb>e\u003c/b> Operation\u003c/mark> schon \u003cmark class=\"v\">beendet\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"m\">The young doctor\u003c/mark> \u003cmark class=\"v\">had\u003c/mark> already \u003cmark class=\"v\">finished\u003c/mark> \u003cmark class=\"f a\">the difficult operation\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"m\">El joven médico\u003c/mark> ya \u003cmark class=\"v\">había terminado\u003c/mark> \u003cmark class=\"f a\">la difícil operación\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"ex\">\u003cspan class=\"dk\">Mixta\u003c/span>\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Wir \u003cmark class=\"v\">hatten\u003c/mark> \u003cmark class=\"n a\">ein günstig\u003cb>es\u003c/b> Hotel\u003c/mark> \u003cmark class=\"v\">gebucht\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">We \u003cmark class=\"v\">had booked\u003c/mark> \u003cmark class=\"n a\">a cheap hotel\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"v\">Habíamos reservado\u003c/mark> \u003cmark class=\"n a\">un hotel económico\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"ex\">\u003cspan class=\"dk\">Fuerte\u003c/span>\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"m\">Heftig\u003cb>er\u003c/b> Regen\u003c/mark> \u003cmark class=\"v\">hatte\u003c/mark> \u003cmark class=\"p a\">die Straßen\u003c/mark> \u003cmark class=\"v\">überflutet\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"m\">Heavy rain\u003c/mark> \u003cmark class=\"v\">had flooded\u003c/mark> \u003cmark class=\"p a\">the streets\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"m\">La lluvia intensa\u003c/mark> \u003cmark class=\"v\">había inundado\u003c/mark> \u003cmark class=\"p a\">las calles\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"t t5\">\u003ctd>Futur I\u003csmall>futuro\u003c/small>\u003c/td>\u003ctd>\u003cdiv class=\"ex\">\u003cspan class=\"dk\">Débil\u003c/span>\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"f\">Die neu\u003cb>e\u003c/b> Chefin\u003c/mark> \u003cmark class=\"v\">wird\u003c/mark> \u003cmark class=\"n a\">das wichtig\u003cb>e\u003c/b> Projekt\u003c/mark> \u003cmark class=\"v\">leiten\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"f\">The new boss\u003c/mark> \u003cmark class=\"v\">will lead\u003c/mark> \u003cmark class=\"n a\">the important project\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"f\">La nueva jefa\u003c/mark> \u003cmark class=\"v\">dirigirá\u003c/mark> \u003cmark class=\"n a\">el proyecto importante\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"ex\">\u003cspan class=\"dk\">Mixta\u003c/span>\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Wir \u n\u003clink href=\"https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --bg:#FBFAFD; --surface:#FFFFFF; --ink:#2C2A36; --muted:#6D6A7C; --rule:#E4E1EC;\n  --verb:#BFE3F8; --neu:#DCCBF2; --pl:#FDD8B5; --dat-line:#6E86BC;\n  --t1:#FFF0A6; --t2:#BDEDE6; --t3:#FFCFC0; --t4:#E4F3B4; --t5:#D8E0EA; --t6:#ECDDBF; --t7:#F3DDF6; --t8:#E3E3E3; --t9:#DAD8B4;\n  --hl-ink:#2A2733;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){ --bg:#1D1C24; --surface:#26252F; --ink:#ECEAF3; --muted:#A8A5B8; --rule:#3A3846; }\n}\n:root[data-theme=\"dark\"]{ --bg:#1D1C24; --surface:#26252F; --ink:#ECEAF3; --muted:#A8A5B8; --rule:#3A3846; }\n:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }\nhtml{ scroll-padding-top:env(safe-area-inset-top,0px); }\nbody{ margin:0; background:var(--bg); color:var(--ink); font-family:\"Lexend\",system-ui,-apple-system,\"Segoe UI\",sans-serif; font-weight:300; line-height:1.55; }\nmain{ max-width:1040px; margin:0 auto; padding:2.5rem 1.25rem 4rem; }\nh1{ font-family:\"Literata\",Georgia,serif; font-weight:600; font-size:clamp(2rem,5vw,3.1rem); line-height:1.1; margin:0 0 .5rem; letter-spacing:-.01em; }\nh2{ font-family:\"Literata\",Georgia,serif; font-weight:600; font-size:1.6rem; margin:0 0 .2rem; }\nh3{ font-weight:600; font-size:1.05rem; margin:1.6rem 0 .5rem; }\n.lead{ color:var(--muted); max-width:62ch; margin:0 0 1.4rem; }\nmark{ background:none; color:inherit; padding:.05em .28em; border-radius:5px; }\nmark.v,mark.n,mark.p{ color:var(--hl-ink); }\nmark.v{ background:var(--verb); font-weight:600; } mark.n{ background:var(--neu); } mark.p{ background:var(--pl); }\n.legend{ display:flex; flex-wrap:wrap; gap:.6rem 1.4rem; background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:.9rem 1.25rem; font-size:.92rem; }\n#tabs{ display:flex; gap:.4rem; margin:1.6rem 0 1rem; border-bottom:1px solid var(--rule); position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); z-index:5; padding-top:.4rem; overflow-x:auto; }\n.tabbtn{ font:inherit; font-weight:400; font-size:.95rem; background:none; color:var(--muted); border:none; border-bottom:4px solid var(--c); padding:.55rem .9rem; cursor:pointer; white-space:nowrap; border-radius:8px 8px 0 0; }\n.tabbtn[aria-selected=true]{ color:var(--hl-ink); background:var(--c); font-weight:600; }\n.tabbtn:focus-visible{ outline:2px solid var(--dat-line); outline-offset:2px; }\n.chip{ display:inline-block; color:var(--hl-ink); padding:.2rem .8rem; border-radius:999px; font-size:.88rem; font-weight:400; background:var(--c); }\n.head{ display:flex; flex-wrap:wrap; align-items:center; gap:.8rem; margin-bottom:.4rem; }\n.card{ background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:1rem 1.2rem; margin:.6rem 0; }\n.steps{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:.8rem; margin:0; padding:0; list-style:none; counter-reset:s; }\n.steps li{ counter-increment:s; background:var(--surface); border:1px solid var(--rule); border-top:4px solid var(--c); border-radius:14px; padding:.9rem 1.1rem; }\n.steps li::before{ content:counter(s); display:inline-block; background:var(--c); color:var(--hl-ink); width:1.5rem; height:1.5rem; border-radius:50%; text-align:center; font-weight:600; font-size:.85rem; margin-right:.5rem; }\n.scroll{ overflow-x:auto; border:1px solid var(--rule); border-radius:14px; background:var(--surface); margin:.4rem 0 1rem; }\ntable{ border-collapse:collapse; width:100%; min-width:420px; }\nth,td{ text-align:left; padding:.55rem .9rem; border-bottom:1px solid var(--rule); }\nth{ font-weight:600; font-size:.85rem; color:var(--muted); }\ntr:last-child td{ border-bottom:none; }\ntd:first-child{ background:var(--c); color:var(--hl-ink); font-weight:400; white-space:nowrap; }\ntd:not(:first-child){ font-family:\"Literata\",Georgia,serif; font-size:1.05rem; }\n.ex{ display:grid; gap:.15rem; padding:.6rem 0; border-bottom:1px solid var(--rule); } .ex:last-child{ border:none; }\n.ex .de{ font-family:\"Literata\",Georgia,serif; font-size:1.1rem; } .ex .es{ color:var(--muted); font-size:.92rem; }\n.notes{ margin:0; padding-left:1.1rem; color:var(--muted); font-size:.95rem; } .notes li{ margin:.3rem 0; }\n.notes b{ color:var(--ink); font-weight:600; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n  \u003ch1>Los tiempos verbales del alemán\u003c/h1>\n  \u003cp class=\"lead\">Nueve tiempos y modos, cada uno con su color y su explicación gramatical. Elige una pestaña (también funcionan las flechas ← →).\u003c/p>\n  \u003cdiv class=\"legend\">\n    \u003cspan>\u003cmark class=\"v\">verbo\u003c/mark> conjugado / auxiliar\u003c/span>\n    \u003cspan>\u003cmark class=\"n\">participio II\u003c/mark> / infinitivo\u003c/span>\n    \u003cspan>\u003cmark class=\"p\">marcador\u003c/mark> de tiempo\u003c/span>\n  \u003c/div>\n  \u003cdiv id=\"tabs\" role=\"tablist\" aria-label=\"Tiempos verbales\">\u003c/div>\n  \u003csection id=\"panel\" role=\"tabpanel\" tabindex=\"0\">\u003c/section>\n\u003c/main>\n\u003cscript>\nconst P=['ich','du','er/sie/es','wir','ihr','sie/Sie'];\nconst v=s=>`\u003cmark class=\"v\">${s}\u003c/mark>`, n=s=>`\u003cmark class=\"n\">${s}\u003c/mark>`, p=s=>`\u003cmark class=\"p\">${s}\u003c/mark>`;\nconst T=[\n{id:'t1',name:'Präsens',es:'Presente',\n use:['Acciones que ocurren ahora o que son habituales.','Verdades generales y estados permanentes.','Futuro próximo, casi siempre con un marcador de tiempo (\u003ci>morgen\u003c/i>, \u003ci>nächste Woche\u003c/i>). En alemán es lo normal.'],\n form:['Toma el \u003cb>infinitivo\u003c/b> y quita \u003cb>-en\u003c/b> (o -n): \u003ci>mach-en → mach-\u003c/i>.','Añade la terminación: \u003cb>-e, -st, -t, -en, -t, -en\u003c/b>.','Si la raíz acaba en -d/-t, intercala \u003cb>-e-\u003c/b>: \u003ci>du arbeitest, er arbeitet\u003c/i>.'],\n tables:[{h:['machen','arbeiten','fahren (irreg.)'],f:[['mache','arbeite','fahre'],['machst','arbeitest','fährst'],['macht','arbeitet','fährt'],['machen','arbeiten','fahren'],['macht','arbeitet','fahrt'],['machen','arbeiten','fahren']]}],\n ex:[[`Ich ${v('mache')} jetzt Hausaufgaben.`,'Hago los deberes ahora.'],[`Sie ${v('wohnt')} in Berlin.`,'Ella vive en Berlín.'],[`Wir ${v('fahren')} ${p('morgen')} nach München.`,'Mañana viajamos a Múnich (futuro).']],\n notes:['\u003cb>Verbos fuertes:\u003c/b> muchos cambian la vocal en du/er: \u003ci>a→ä\u003c/i> (fahren), \u003ci>e→i/ie\u003c/i> (geben, sehen).','\u003cb>Posición:\u003c/b> el verbo conjugado ocupa siempre el 2.º lugar en la oración principal.','\u003cb>Irregulares clave:\u003c/b> sein (bin, bist, ist…), haben (habe, hast, hat…), werden (werde, wirst, wird…).']},\n{id:'t2',name:'Präteritum',es:'Pretérito imperfecto / indefinido',\n use:['Narración escrita: novelas, cuentos, noticias, informes.','En la lengua hablada se usa casi solo con \u003cb>sein, haben\u003c/b> y los \u003cb>modales\u003c/b> (\u003ci>ich war, ich hatte, ich konnte\u003c/i>).','Hechos pasados sin conexión con el presente.'],\n form:['\u003cb>Débiles:\u003c/b> raíz + \u003cb>-te\u003c/b> + terminación: \u003ci>mach-te\u003c/i>.','\u003cb>Fuertes:\u003c/b> la raíz cambia de vocal (\u003ci>geh-en → ging\u003c/i>) y no lleva -te.','Terminaciones: \u003cb>—, -st, —, -en, -t, -en\u003c/b> (ich y er/sie/es son idénticos).'],\n tables:[{h:['machen (débil)','gehen (fuerte)','sein'],f:[['machte','ging','war'],['machtest','gingst','warst'],['machte','ging','war'],['machten','gingen','waren'],['machtet','gingt','wart'],['machten','gingen','waren']]}],\n ex:[[`Gestern ${v('regnete')} es den ganzen Tag.`,'Ayer llovió todo el día.'],[`Er ${v('ging')} nach Hause und ${v('schlief')} sofort ein.`,'Se fue a casa y se durmió enseguida.'],[`Ich ${v('war')} müde.`,'Estaba cansado.']],\n notes:['\u003cb>Mixtos:\u003c/b> cambian la vocal y llevan -te: \u003ci>denken → dachte, bringen → brachte, kennen → kannte\u003c/i>.','\u003cb>Modales:\u003c/b> pierden el umlaut: \u003ci>können → konnte, müssen → musste\u003c/i>.','Hay que memorizar las \u003cb>tres formas\u003c/b> de cada verbo fuerte: infinitivo – Präteritum – Partizip II.']},\n{id:'t3',name:'Perfekt',es:'Pretérito perfecto compuesto',\n use:['Pasado en la \u003cb>conversación diaria\u003c/b> y en mensajes.','Acciones pasadas con relevancia para el presente.','Es el pasado más usado al hablar, incluso para hechos lejanos.'],\n form:['Auxiliar \u003cb>haben\u003c/b> o \u003cb>sein\u003c/b> conjugado en presente (2.ª posición).','\u003cb>Participio II\u003c/b> al final de la oración.','Débiles: \u003cb>ge-\u003c/b> + raíz + \u003cb>-t\u003c/b> (\u003ci>gemacht\u003c/i>). Fuertes: \u003cb>ge-\u003c/b> + raíz + \u003cb>-en\u003c/b> (\u003ci>gegangen\u003c/i>).'],\n tables:[{h:['machen (haben)','gehen (sein)'],f:[[`${v('habe')} ${n('gemacht')}`,`${v('bin')} ${n('gegangen')}`],[`${v('hast')} ${n('gemacht')}`,`${v('bist')} ${n('gegangen')}`],[`${v('hat')} ${n('gemacht')}`,`${v('ist')} ${n('gegangen')}`],[`${v('haben')} ${n('gemacht')}`,`${v('sind')} ${n('gegangen')}`],[`${v('habt')} ${n('gemacht')}`,`${v('seid')} ${n('gegangen')}`],[`${v('haben')} ${n('gemacht')}`,`${v('sind')} ${n('gegangen')}`]]}],\n ex:[[`Ich ${v('habe')} gestern einen Kuchen ${n('gebacken')}.`,'Ayer horneé un pastel.'],[`Wir ${v('sind')} nach Spanien ${n('geflogen')}.`,'Volamos a España.'],[`Hast du schon ${n('gegessen')}?`,'¿Ya has comido?']],\n notes:['\u003cb>Usa sein\u003c/b> con verbos de movimiento (\u003ci>gehen, fahren, kommen\u003c/i>), cambio de estado (\u003ci>einschlafen, werden\u003c/i>) y con \u003ci>sein, bleiben, passieren\u003c/i>.','\u003cb>Sin ge-:\u003c/b> verbos con prefijo inseparable (\u003ci>besuchen → besucht\u003c/i>) y en -ieren (\u003ci>studieren → studiert\u003c/i>).','\u003cb>Separables:\u003c/b> el ge- va en medio: \u003ci>aufstehen → aufgestanden\u003c/i>.']},\n{id:'t4',name:'Plusquamperfekt',es:'Pretérito pluscuamperfecto',\n use:['Una acción pasada \u003cb>anterior a otra acción pasada\u003c/b>.','Se combina con \u003ci>nachdem\u003c/i>, \u003ci>bevor\u003c/i>, \u003ci>als\u003c/i>, \u003ci>schon\u003c/i>.','Equivale al «había hecho» español.'],\n form:['Auxiliar \u003cb>haben/sein\u003c/b> en \u003cb>Präteritum\u003c/b> (\u003ci>hatte / war\u003c/i>).','\u003cb>Participio II\u003c/b> al final.','La elección haben/sein es la misma que en Perfekt.'],\n tables:[{h:['machen (haben)','gehen (sein)'],f:[[`${v('hatte')} ${n('gemacht')}`,`${v('war')} ${n('gegangen')}`],[`${v('hattest')} ${n('gemacht')}`,`${v('warst')} ${n('gegangen')}`],[`${v('hatte')} ${n('gemacht')}`,`${v('war')} ${n('gegangen')}`],[`${v('hatten')} ${n('gemacht')}`,`${v('waren')} ${n('gegangen')}`],[`${v('hattet')} ${n('gemacht')}`,`${v('wart')} ${n('gegangen')}`],[`${v('hatten')} ${n('gemacht')}`,`${v('waren')} ${n('gegangen')}`]]}],\n ex:[[`${p('Nachdem')} er gegessen ${v('hatte')}, ging er spazieren.`,'Después de haber comido, salió a pasear.'],[`Als ich ankam, ${v('war')} der Zug schon ${n('abgefahren')}.`,'Cuando llegué, el tren ya había salido.']],\n notes:['\u003cb>Orden de los hechos:\u003c/b> \u003ci>Plusquamperfekt\u003c/i> (primero) → \u003ci>Präteritum/Perfekt\u003c/i> (después).','Con \u003ci>nachdem\u003c/i>, la subordinada va en Plusquamperfekt y la principal en Präteritum.']},\n{id:'t5',name:'Futur I',es:'Futuro simple',\n use:['\u003cb>Planes e intenciones\u003c/b> en el futuro.','\u003cb>Predicciones\u003c/b> y promesas.','\u003cb>Suposiciones sobre el presente\u003c/b>: \u003ci>Er wird zu Hause sein\u003c/i> (= supongo que está en casa).'],\n form:['\u003cb>werden\u003c/b> conjugado en presente (2.ª posición).','\u003cb>Infinitivo\u003c/b> del verbo principal al final.','Muy a menudo se sustituye por el Präsens + marcador de tiempo.'],\n tables:[{h:['machen','gehen'],f:[[`${v('werde')} ${n('machen')}`,`${v('werde')} ${n('gehen')}`],[`${v('wirst')} ${n('machen')}`,`${v('wirst')} ${n('gehen')}`],[`${v('wird')} ${n('machen')}`,`${v('wird')} ${n('gehen')}`],[`${v('werden')} ${n('machen')}`,`${v('werden')} ${n('gehen')}`],[`${v('werdet')} ${n('machen')}`,`${v('werdet')} ${n('gehen')}`],[`${v('werden')} ${n('machen')}`,`${v('werden')} ${n('gehen')}`]]}],\n ex:[[`Ich ${v('werde')} nächstes Jahr Deutsch ${n('lernen')}.`,'El año que viene aprenderé alemán.'],[`Es ${v('wird')} morgen ${n('regnen')}.`,'Mañana lloverá.'],[`Sie ${v('wird')} wohl krank ${n('sein')}.`,'Seguramente está enferma.']],\n notes:['\u003cb>No confundir\u003c/b> \u003ci>werden\u003c/i> (futuro) con \u003ci>wollen\u003c/i> (querer).','Con \u003ci>wohl, sicher, bestimmt\u003c/i> expresa probabilidad, no futuro.']},\n{id:'t6',name:'Futur II',es:'Futuro perfecto',\n use:['Una acción que \u003cb>estará terminada\u003c/b> en un momento futuro.','Suposición sobre algo \u003cb>ya ocurrido\u003c/b>: \u003ci>Er wird es vergessen haben\u003c/i> (lo habrá olvidado).','Poco frecuente; en la práctica se usa el Perfekt.'],\n form:['\u003cb>werden\u003c/b> conjugado en presente.','\u003cb>Participio II\u003c/b> del verbo principal.','Infinitivo del auxiliar (\u003cb>haben / sein\u003c/b>) al final.'],\n tables:[{h:['machen','gehen'],f:[[`${v('werde')} ${n('gemacht haben')}`,`${v('werde')} ${n('gegangen sein')}`],[`${v('wirst')} ${n('gemacht haben')}`,`${v('wirst')} ${n('gegangen sein')}`],[`${v('wird')} ${n('gemacht haben')}`,`${v('wird')} ${n('gegangen sein')}`],[`${v('werden')} ${n('gemacht haben')}`,`${v('werden')} ${n('gegangen sein')}`],[`${v('werdet')} ${n('gemacht haben')}`,`${v('werdet')} ${n('gegangen sein')}`],[`${v('werden')} ${n('gemacht haben')}`,`${v('werden')} ${n('gegangen sein')}`]]}],\n ex:[[`Bis Freitag ${v('werde')} ich den Bericht ${n('geschrieben haben')}.`,'Para el viernes habré escrito el informe.'],[`Er ${v('wird')} schon ${n('abgereist sein')}.`,'Ya se habrá marchado.']],\n notes:['Se usa sobre todo con marcadores como \u003ci>bis morgen, bis dahin\u003c/i>.','Perfekt + marcador futuro lo sustituye: \u003ci>Bis Freitag habe ich den Bericht geschrieben.\u003c/i>']},\n{id:'t9',name:'Konjunktiv I',es:'Subjuntivo I (estilo indirecto)',\n use:['\u003cb>Discurso indirecto\u003c/b>: reproducir lo que otro dijo, sin garantizar que sea cierto.','Típico del lenguaje periodístico y formal.','Instrucciones y fórmulas fijas: \u003ci>Man nehme…\u003c/i>, \u003ci>Er ruhe in Frieden\u003c/i>.'],\n form:['Raíz del infinitivo + \u003cb>-e, -est, -e, -en, -et, -en\u003c/b>.','\u003cb>sein\u003c/b> es irregular: \u003ci>sei, seist, sei, seien, seiet, seien\u003c/i>.','Si la forma coincide con el indicativo (ich, wir, sie), se usa \u003cb>Konjunktiv II\u003c/b> en su lugar.'],\n tables:[{h:['machen','haben','sein'],f:[['mache','habe','sei'],['machest','habest','sei(e)st'],['mache','habe','sei'],['machen','haben','seien'],['machet','habet','seiet'],['machen','haben','seien']]}],\n ex:[[`Er sagt, er ${v('habe')} keine Zeit.`,'Dice que no tiene tiempo.'],[`Sie meint, das ${v('sei')} nicht wahr.`,'Opina que eso no es verdad.'],[`Der Minister sagte, man ${v('werde')} handeln.`,'El ministro dijo que se actuaría.']],\n notes:['Pasado en estilo indirecto: Konjunktiv I de \u003ci>haben/sein\u003c/i> + Partizip II (\u003ci>er habe gesagt\u003c/i>).','En la conversación normal se oye el indicativo: \u003ci>Er sagt, er hat keine Zeit.\u003c/i>']},\n{id:'t7',name:'Konjunktiv II',es:'Subjuntivo II (irreal / cortesía)',\n use:['\u003cb>Deseos y situaciones irreales\u003c/b> o hipotéticas: \u003ci>Wenn ich Zeit hätte…\u003c/i>','\u003cb>Cortesía\u003c/b>: \u003ci>Könnten Sie mir helfen?\u003c/i>','Consejos: \u003ci>Ich würde das nicht tun.\u003c/i>'],\n form:['Verbos fuertes y auxiliares: \u003cb>Präteritum + umlaut + -e\u003c/b>: \u003ci>ging → ginge, war → wäre, hatte → hätte\u003c/i>.','Verbos débiles: forma idéntica al Präteritum, así que se usa \u003cb>würde + infinitivo\u003c/b>.','Pasado: \u003cb>hätte / wäre + Partizip II\u003c/b>.'],\n tables:[{h:['würde + inf.','haben','sein','können'],f:[['würde machen','hätte','wäre','könnte'],['würdest machen','hättest','wärest','könntest'],['würde machen','hätte','wäre','könnte'],['würden machen','hätten','wären','könnten'],['würdet machen','hättet','wäret','könntet'],['würden machen','hätten','wären','könnten']]}],\n ex:[[`Wenn ich reich ${v('wäre')}, ${v('würde')} ich reisen.`,'Si fuera rico, viajaría.'],[`${v('Könnten')} Sie bitte das Fenster öffnen?`,'¿Podría abrir la ventana, por favor?'],[`Wenn ich das gewusst ${v('hätte')}, ${v('wäre')} ich ${n('gekommen')}.`,'Si lo hubiera sabido, habría venido.']],\n notes:['\u003cb>Estructura típica:\u003c/b> \u003ci>Wenn + Konjunktiv II, Konjunktiv II\u003c/i>.','\u003cb>Wunsch:\u003c/b> \u003ci>Ich wünschte, ich hätte mehr Zeit.\u003c/i>','Los modales y \u003ci>sein/haben/werden\u003c/i> conservan su forma propia; no usan \u003ci>würde\u003c/i>.']},\n{id:'t8',name:'Imperativ',es:'Imperativo',\n use:['Órdenes, instrucciones, consejos y peticiones.','Recetas, señales y manuales.','Con \u003ci>bitte\u003c/i> suena más cortés.'],\n form:['\u003cb>du:\u003c/b> raíz (+ -e opcional): \u003ci>mach(e)!\u003c/i>','\u003cb>ihr:\u003c/b> igual que el presente: \u003ci>macht!\u003c/i>','\u003cb>Sie / wir:\u003c/b> infinitivo + pronombre: \u003ci>machen Sie! / machen wir!\u003c/i>'],\n tables:[{h:['machen','kommen','fahren','sein'],f:[['—','—','—','—'],['mach(e)!','komm(e)!','fahr(e)!','sei!'],['—','—','—','—'],['machen wir!','kommen wir!','fahren wir!','seien wir!'],['macht!','kommt!','fahrt!','seid!'],['machen Sie!','kommen Sie!','fahren Sie!','seien Sie!']]}],\n ex:[[`${v('Mach')} bitte das Fenster zu!`,'¡Cierra la ventana, por favor!'],[`${v('Seid')} leise!`,'¡Estad callados!'],[`${v('Nehmen')} Sie Platz.`,'Siéntese.']],\n notes:['\u003cb>Verbos con cambio e→i/ie:\u003c/b> el cambio se mantiene en du: \u003ci>gib! lies! nimm!\u003c/i> (sin -e). Con lign-items:center; flex-wrap:wrap; }\n#p-inputs{ display:grid; gap:.7rem; } #p-inputs label{ display:grid; gap:.25rem; font-size:.85rem; color:var(--muted); }\n#p-inputs input{ font-size:1.1rem; font-family:\"Literata\",Georgia,serif; }\n#p-inputs input.good{ border-color:#6FB583; box-shadow:0 0 0 2px var(--mas); } #p-inputs input.bad{ border-color:var(--akk-line); box-shadow:0 0 0 2px var(--akk); }\n.pact{ display:flex; gap:.6rem; margin-top:1rem; align-items:center; flex-wrap:wrap; } .pact .sc{ margin-left:auto; color:var(--muted); font-size:.92rem; }\n.fb{ margin-top:1rem; min-height:1.4rem; } .fb.y strong{ color:#3F8A55; } .fb.n strong{ color:var(--akk-line); }\n@media (prefers-reduced-motion:reduce){ .prog .bar i{ transition:none; } }\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\n\u003ch1>Los 250 verbos más usados del alemán\u003c/h1>\n\u003cp class=\"lead\">Una guía para aprenderlos en todos los tiempos verbales. La lista se basa en listas de frecuencia del alemán, con algunos verbos cotidianos añadidos (essen, trinken, schlafen, kaufen). Del 101 al 250 siguen verbos muy frecuentes del día a día, con muchos separables y reflexivos. El verbo siempre va en azul y cada tiempo tiene su color.\u003c/p>\n\u003col class=\"steps\">\n\u003cli>\u003cstrong>Aprende las formas principales.\u003c/strong> En la lista, memoriza presente, Präteritum y Perfekt de un bloque de 10 verbos.\u003c/li>\n\u003cli>\u003cstrong>Revisa la conjugación completa.\u003c/strong> Abre cada verbo y fíjate en qué cambia: vocal, prefijo separable, sein o haben.\u003c/li>\n\u003cli>\u003cstrong>Practica hasta que salga solo.\u003c/strong> Haz la práctica del bloque y marca cada verbo como aprendido cuando lo domines.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"tenses\">\n\u003cspan class=\"chip\" style=\"background:var(--t1)\">Präsens\u003c/span>\u003cspan class=\"chip\" style=\"background:var(--t2)\">Präteritum\u003c/span>\u003cspan class=\"chip\" style=\"background:var(--t3)\">Perfekt\u003c/span>\u003cspan class=\"chip\" style=\"background:var(--t4)\">Plusquamperfekt\u003c/span>\u003cspan class=\"chip\" style=\"background:var(--t5)\">Futur I\u003c/span>\u003cspan class=\"chip\" style=\"background:var(--t6)\">Futur II\u003c/span>\u003cspan class=\"chip\" style=\"background:var(--t9)\">Konjunktiv I\u003c/span>\u003cspan class=\"chip\" style=\"background:var(--t7)\">Konjunktiv II\u003c/span>\u003cspan class=\"chip\" style=\"background:var(--t8)\">Imperativ\u003c/span>\n\u003c/div>\n\u003cdiv class=\"prog\">\u003cspan>\u003cstrong id=\"prog-n\">0\u003c/strong> de 250 aprendidos\u003c/span>\u003cspan class=\"bar\">\u003ci id=\"prog-bar\">\u003c/i>\u003c/span>\u003c/div>\n\n\u003cdiv id=\"tabs\" role=\"tablist\">\n\u003cbutton class=\"tabbtn\" role=\"tab\" data-t=\"list\">Lista de verbos\u003c/button>\n\u003cbutton class=\"tabbtn\" role=\"tab\" data-t=\"conj\">Conjugación\u003c/button>\n\u003cbutton class=\"tabbtn\" role=\"tab\" data-t=\"prac\">Práctica\u003c/button>\n\u003c/div>\n\n\u003csection id=\"list\" class=\"pane\">\n\u003cdiv class=\"ctl\">\n\u003cinput type=\"search\" id=\"f-q\" placeholder=\"Buscar en alemán, español o inglés\" aria-label=\"Buscar verbo\">\n\u003cselect id=\"f-blk\" aria-label=\"Bloque\">\u003coption value=\"all\">Todos los bloques\u003c/option>\u003c/select>\n\u003cselect id=\"f-type\" aria-label=\"Tipo\">\u003coption value=\"all\">Todos los tipos\u003c/option>\u003coption value=\"r\">Regulares\u003c/option>\u003coption value=\"f\">Irregulares\u003c/option>\u003coption value=\"m\">Mixtos\u003c/option>\u003coption value=\"mo\">Modales\u003c/option>\u003coption value=\"a\">Auxiliares\u003c/option>\u003coption value=\"sep\">Separables\u003c/option>\u003coption value=\"refl\">Reflexivos\u003c/option>\u003c/select>\n\u003clabel>\u003cinput type=\"checkbox\" id=\"f-pend\"> Solo pendientes\u003c/label>\n\u003c/div>\n\u003cp class=\"note\">Toca un verbo para ver su conjugación completa.\u003c/p>\n\u003cdiv class=\"scroll\">\u003ctable style=\"min-width:820px\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Infinitivo\u003c/th>\u003cth>Español\u003c/th>\u003cth class=\"hv\">Presente (er)\u003c/th>\u003cth class=\"hv\">Präteritum\u003c/th>\u003cth class=\"hv\">Perfekt\u003c/th>\u003cth>Tipo\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"conj\" class=\"pane\" hidden>\n\u003cdiv class=\"cnav\">\u003cbutton class=\"btn\" id=\"c-prev\" aria-label=\"Verbo anterior\">‹\u003c/button>\u003cselect id=\"c-sel\" aria-label=\"Elegir verbo\">\u003c/select>\u003cbutton class=\"btn\" id=\"c-next\" aria-label=\"Verbo siguiente\">›\u003c/button>\u003c/div>\n\u003cdiv class=\"vcard\" id=\"c-head\">\u003c/div>\n\u003cdiv id=\"c-grid\">\u003c/div>\n\u003c/section>\n\n\u003csection id=\"prac\" class=\"pane\" hidden>\n\u003cdiv class=\"pset\">\n\u003cdiv class=\"row\">\u003cspan class=\"lbl\">Verbos\u003c/span>\u003cselect id=\"p-blk\" aria-label=\"Verbos para practicar\">\u003coption value=\"all\">Los 250\u003c/option>\u003coption value=\"P\">Solo pendientes\u003c/option>\u003coption value=\"L\">Solo aprendidos\u003c/option>\u003c/select>\u003c/div>\n\u003cdiv class=\"row\">\u003cspan class=\"lbl\">Ejercicio\u003c/span>\u003clabel>\u003cinput type=\"radio\" name=\"pm\" value=\"conj\" checked> Conjugar\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"pm\" value=\"stamm\"> Formas principales\u003c/label>\u003c/div>\n\u003cdiv class=\"row\" id=\"p-tbox\">\u003cspan class=\"lbl\">Tiempos\u003c/span>\u003cspan id=\"p-tenses\" style=\"display:flex;flex-wrap:wrap;gap:.4rem\">\u003c/span>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"qcard\">\n\u003cdiv id=\"p-prompt\">\u003c/div>\n\u003cdiv id=\"p-inputs\">\u003c/div>\n\u003cdiv class=\"pact\">\u003cbutton class=\"btn pri\" id=\"p-check\">Comprobar\u003c/button>\u003cbutton class=\"btn pri\" id=\"p-next\" hidden>Siguiente verbo\u003c/button>\u003cbutton class=\"btn\" id=\"p-reset\">Reiniciar marcador\u003c/button>\u003cspan class=\"sc\">Aciertos: \u003cspan id=\"p-score\">0 de 0\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv class=\"fb\" id=\"p-fb\" aria-live=\"polite\">\u003c/div>\n\u003c/div>\n\u003cp class=\"note\" style=\"margin-top:1rem\">Puedes escribir ae, oe, ue y ss en lugar de ä, ö, ü y ß. Presiona Enter para comprobar.\u003c/p>\n\u003c/section>\n\u003cfooter>Tu progreso se guarda en este navegador.\u003c/footer>\n\u003c/main>\u003cscript>const V=[\n{i:'sein',es:'ser, estar',en:'to be',t:'a',p:'bin|bist|ist|sind|seid|sind',pr:'war',pp:'gewesen',a:'s',k:'wäre',de:'Ich *bin* müde.',ee:'I *am* tired.',ss:'*Estoy* cansada.'},\n{i:'haben',es:'tener',en:'to have',t:'a',p:'habe|hast|hat|haben|habt|haben',pr:'hatte',pp:'gehabt',k:'hätte',im:'hab',de:'Wir *haben* einen Hund.',ee:'We *have* a dog.',ss:'*Tenemos* un perro.'},\n{i:'werden',es:'volverse, llegar a ser',en:'to become',t:'a',p:'werde|wirst|wird|werden|werdet|werden',pr:'wurde',pp:'geworden',a:'s',k:'würde',im:'werde',de:'Es *wird* kalt.',ee:'It *is getting* cold.',ss:'Se *está poniendo* frío.'},\n{i:'können',es:'poder, saber hacer',en:'can, to be able to',t:'mo',p:'kann|kannst|kann|können|könnt|können',pr:'konnte',pp:'gekonnt',k:'könnte',de:'*Kannst* du mir helfen?',ee:'*Can* you help me?',ss:'¿*Puedes* ayudarme?'},\n{i:'müssen',es:'tener que, deber',en:'must, to have to',t:'mo',p:'muss|musst|muss|müssen|müsst|müssen',pr:'musste',pp:'gemusst',k:'müsste',de:'Ich *muss* heute arbeiten.',ee:'I *have to* work today.',ss:'*Tengo que* trabajar hoy.'},\n{i:'sagen',es:'decir',en:'to say',t:'r',de:'Was *sagst* du?',ee:'What *are* you *saying*?',ss:'¿Qué *dices*?'},\n{i:'machen',es:'hacer',en:'to do, to make',t:'r',de:'Wir *machen* eine Pause.',ee:'We *are taking* a break.',ss:'*Hacemos* una pausa.'},\n{i:'geben',es:'dar',en:'to give',t:'f',p:'gibst|gibt',pr:'gab',pp:'gegeben',k:'gäbe',im:'gib',de:'*Gib* mir das Buch!',ee:'*Give* me the book!',ss:'¡*Dame* el libro!'},\n{i:'kommen',es:'venir 'st'), P, P+'en', P+(td?'et':'t'), P+'en'];\n}\nfunction partizip(v){\n  if(v.pp) return v.pp;\n  const b=base(v), st=stemOf(b);\n  const noGe=/^(be|ver|er|ent|ge|zer|emp|miss)/.test(b) || b.endsWith('ieren');\n  return (v.s||'') + (noGe?'':'ge') + st + (tStem(st)&&!isElnErn(b)?'et':'t');\n}\nconst SEIN=['bin','bist','ist','sind','seid','sind'], HABEN=['habe','hast','hat','haben','habt','haben'],\n WAR=['war','warst','war','waren','wart','waren'], HATTE=['hatte','hattest','hatte','hatten','hattet','hatten'],\n WERDE=['werde','wirst','wird','werden','werdet','werden'], WUERDE=['würde','würdest','würde','würden','würdet','würden'];\nfunction auxIsSein(v){return v.a==='s'||v.a==='hs';}\nfunction k1Forms(v){\n  if(v.i==='sein') return ['sei','seiest','sei','seien','seiet','seien'];\n  const b=base(v), st=stemOf(b);\n  if(isElnErn(b)) return [st+'e',st+'est',st+'e',b,st+'et',b];\n  return [st+'e',st+'est',st+'e',st+'en',st+'et',st+'en'];\n}\n// returns array of {fin, end} per person (end may be '')\nfunction conj(v,tense){\n  const sep=v.s||'', pp=partizip(v), inf=v.i, refl=v.r;\n  const mk=(fins,end)=>fins.map((f,k)=>({fin:f, mid:refl?REFL[k]:'', end:end}));\n  switch(tense){\n    case 'pres': return mk(present(v), sep);\n    case 'prat': return mk(pretForms(v), sep);\n    case 'perf': return mk(auxIsSein(v)?SEIN:HABEN, pp);\n    case 'plus': return mk(auxIsSein(v)?WAR:HATTE, pp);\n    case 'fut1': return mk(WERDE, inf);\n    case 'fut2': return mk(WERDE, pp+' '+(auxIsSein(v)?'sein':'haben'));\n    case 'k1': return mk(k1Forms(v), sep);\n    case 'k2': if(v.k){const K=v.k; return mk([K,K+'st',K,K+'n',K+'t',K+'n'], sep);} return mk(WUERDE, inf);\n    case 'imp': {\n      if(v.t==='mo') return null;\n      const b=base(v), st=stemOf(b), pres=present(v);\n      let du;\n      if(v.i==='sein') return [{p:'du',fin:'sei',mid:'',end:''},{p:'ihr',fin:'seid',mid:'',end:''},{p:'Sie',fin:'seien',mid:'Sie',end:''}];\n      if(v.im) du=v.im;\n      else if(isElnErn(b)) du = b.endsWith('eln')? st.slice(0,-2)+'le' : st+'e';\n      else if(tStem(st)) du=st+'e';\n      else du=st;\n      const sieFin = v.i==='sein'?'seien': (isElnErn(b)? b : (b==='tun'?'tun':st+'en'));\n      return [{p:'du',fin:du,mid:refl?'dich':'',end:sep},{p:'ihr',fin:pres[4],mid:refl?'euch':'',end:sep},{p:'Sie',fin:sieFin,mid:'Sie'+(refl?' sich':''),end:sep}];\n    }\n  }\n}\nfunction stamm(v){\n  const pres=present(v), pr=pretForms(v);\n  return {er: pres[2]+(v.s?' '+v.s:''), prat: pr[2]+(v.s?' '+v.s:''), perf:(auxIsSein(v)?(v.a==='hs'?'ist/hat':'ist'):'hat')+' '+partizip(v)};\n}\nif(typeof module!=='undefined') module.exports={V,conj,stamm,TENSES,PRON};\n\nconst TYPE={r:'regular',f:'irregular',m:'mixto',mo:'modal',a:'auxiliar'};\nconst $=s=>document.querySelector(s);\nconst esc=s=>String(s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;');\nconst mv=s=>`\u003cmark class=\"v\">${esc(s)}\u003c/mark>`;\nconst exFmt=s=>esc(s).replace(/\\*([^*]+)\\*/g,'\u003cmark class=\"v\">$1\u003c/mark>');\nlet learned=new Set();\ntry{ learned=new Set(JSON.parse(localStorage.getItem('v100-learned')||'[]')); }catch(e){}\nfunction saveL(){ try{ localStorage.setItem('v100-learned',JSON.stringify([...learned])); }catch(e){} updProg(); }\nfunction updProg(){ const n=learned.size; $('#prog-n').textContent=n; $('#prog-bar').style.width=(n/V.length*100)+'%'; }\nconst disp=v=>(v.r?'sich ':'')+v.i;\nfunction badges(v){ let b=`\u003cspan class=\"bd bd-${v.t}\">${TYPE[v.t]}\u003c/span>`; if(v.s) b+=`\u003cspan class=\"bd\">separable\u003c/span>`; if(v.r) b+=`\u003cspan class=\"bd\">reflexivo\u003c/span>`; if(auxIsSein(v)) b+=`\u003cspan class=\"bd\">${v.a==='hs'?'sein / haben':'con sein'}\u003c/span>`; return b; }\nfunction formHTML(x){ return [x.fin?mv(x.fin):'', x.mid?esc(x.mid):'', x.end?mv(x.end):''].filter(Boolean).join(' '); }\n\n/* tabs */\nfunction tab(id){ document.querySelectorAll('.tabbtn').forEach(b=>b.setAttribute('aria-selected', b.dataset.t===id)); document.querySelectorAll('.pane').forEach(p=>p.hidden=p.id!==id); try{localStorage.setItem('v100-tab',id);}catch(e){} }\ndocument.querySelectorAll('.tabbtn').forEach(b=>b.onclick=()=>tab(b.dataset.t));\n\n/* lista */\nconst blk=$('#f-blk'), pblk=$('#p-blk');\nfor(let b=0;b\u003cMath.ceil(V.length/10);b++){ const t=`Bloque ${b+1} (${b*10+1}–${b*10+10})`; blk.add(new Option(t,b)); pblk.add(new Option(t,'b'+b)); }\nfunction renderList(){\n  const q=$('#f-q').value.trim().toLowerCase(), bk=blk.value, ty=$('#f-type').value, pend=$('#f-pend').checked;\n  let h='';\n  V.forEach((v,k)=>{\n    if(bk!=='all' && Math.floor(k/10)!=bk) return;\n    if(ty==='sep'&&!v.s || ty==='refl'&&!v.r || (['r','f','m','mo','a'].includes(ty)&&v.t!==ty)) return;\n    if(pend && learned.has(v.i)) return;\n    if(q && !(v.i.includes(q)||v.es.toLowerCase().includes(q)||v.en.toLowerCase().includes(q))) return;\n    const s=stamm(v);\n    h+=`\u003ctr data-k=\"${k}\" tabindex=\"0\">\u003ctd class=\"num\">${k+1}\u003c/td>\u003ctd class=\"inf\">${esc(disp(v))}\u003c/td>\u003ctd>${esc(v.es)}\u003c/td>\u003ctd>${mv(s.er)}\u003c/td>\u003ctd>${mv(s.prat)}\u003c/td>\u003ctd>${mv(s.perf)}\u003c/td>\u003ctd>${badges(v)}\u003c/td>\u003ctd class=\"ok\">${learned.has(v.i)?'✓':''}\u003c/td>\u003c/tr>`;\n  });\n  $('#list tbody').innerHTML=h||'\u003ctr>\u003ctd colspan=\"8\" class=\"empty\">Ningún verbo coincide con los filtros. Cambia la búsqueda o el bloque.\u003c/td>\u003c/tr>';\n}\n['#f-q','#f-blk','#f-type','#f-pend'].forEach(s=>$(s).addEventListener('input',renderList));\n$('#list tbody').addEventListener('click',e=>{const tr=e.target.closest('tr[data-k]'); if(tr){ showVerb(+tr.dataset.k); tab('conj'); window.scrollTo({top:$('#tabs').offsetTop-10}); }});\n$('#list tbody').addEventListener('keydown',e=>{ if(e.key==='Enter'){const tr=e.target.closest('tr[data-k]'); if(tr){showVerb(+tr.dataset.k); tab('conj');}}});\n\n/* conjugación */\nconst sel=$('#c-sel'); V.forEach((v,k)=>sel.add(new Option(`${k+1}. ${disp(v)} — ${v.es}`,k)));\nlet cur=0;\nfunction showVerb(k){\n  cur=(k+V.length)%V.length; sel.value=cur; const v=V[cur], s=stamm(v);\n  const notes=[];\n  if(v.t==='mo') notes.push('Los modales no tienen imperativo. Cuando acompañan a otro verbo, el Perfekt usa dos infinitivos: \u003cem>ich habe arbeiten müssen\u003c/em>.');\n  if(v.a==='hs') notes.push('Con sein cuando indica movimiento o cambio de lugar; con haben cuando lleva objeto directo (\u003cem>ich habe das Auto gefahren\u003c/em>).');\n  if(v.s) notes.push(`Verbo separable: el prefijo \u003cstrong>${v.s}-\u003c/strong> va al final en presente, pretérito e imperativo, y se queda unido en infinitivo y participio.`);\n  if(v.r) notes.push('Verbo reflexivo: el pronombre (mich, dich, sich…) va justo después del verbo conjugado.');\n  if(!v.k && v.t!=='a') notes.push('En Konjunktiv II se usa normalmente \u003cem>würde\u003c/em> + infinitivo.');\n  $('#c-head').innerHTML=`\u003cdiv class=\"vh\">\u003cdiv>\u003ch3 class=\"vinf\">${esc(disp(v))}\u003c/h3>\u003cp class=\"vmean\">${esc(v.es)} · \u003cspan lang=\"en\">${esc(v.en)}\u003c/span>\u003c/p>\u003cdiv class=\"bds\">${badges(v)}\u003c/div>\u003c/div>\n   \u003cbutton id=\"c-learn\" class=\"btn ${learned.has(v.i)?'on':''}\" aria-pressed=\"${learned.has(v.i)}\">${learned.has(v.i)?'✓ Aprendido':'Marcar como aprendido'}\u003c/button>\u003c/div>\n   \u003cdiv class=\"stamm\">\u003cdiv>\u003cspan>Presente (er)\u003c/span>${mv(s.er)}\u003c/div>\u003cdiv>\u003cspan>Präteritum (er)\u003c/span>${mv(s.prat)}\u003c/div>\u003cdiv>\u003cspan>Perfekt (er)\u003c/span>${mv(s.perf)}\u003c/div>\u003c/div>\n   \u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">${exFmt(v.de)}\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">${exFmt(v.ee)}\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">${exFmt(v.ss)}\u003c/span>\u003c/p>\u003c/div>\n   ${notes.length?`\u003cul class=\"notes\">${notes.map(n=>`\u003cli>${n}\u003c/li>`).join('')}\u003c/ul>`:''}`;\n  $('#c-learn').onclick=()=>{ learned.has(v.i)?learned.delete(v.i):learned.add(v.i); saveL(); showVerb(cur); renderList(); };\n  let g='';\n  for(const [key,name,es,col] of TENSES){\n    const c=conj(v,key);\n    let rows;\n    if(!c) rows='\u003cp class=\"none\">No tiene imperativo.\u003c/p>';\n    else if(key==='imp') rows=c.map(x=>`\u003cdiv class=\"r\">\u003cspan class=\"pr\">${x.p}\u003c/span>\u003cspan>${formHTML({fin:x.fin,mid:x.mid,end:x.end})}!\u003c/span>\u003c/div>`).join('');\n    else rows=c.map((x,i)=>`\u003cdiv class=\"r\">\u003cspan class=\"pr\">${PRON[i]}\u003c/span>\u003cspan>${formHTML(x)}\u003c/span>\u003c/div>`).join('');\n    g+=`\u003csection class=\"tc\">\u003ch4 style=\"background:var(--${col})\">${name}\u003csmall>${es}\u003c/small>\u003c/h4>${rows}\u003c/section>`;\n  }\n  $('#c-grid').innerHTML=g;\n}\nsel.onchange=()=>showVerb(+sel.value);\n$('#c-prev').onclick=()=>showVerb(cur-1); $('#c-next').onclick=()=>showVerb(cur+1);\n\n/* práctica */\nconst tbox=$('#p-tenses');\nTENSES.forEach(([k,n,,col])=>{ tbox.insertAdjacentHTML('beforeend',`\u003clabel class=\"tchk\" style=\"--c:var(--${col})\">\u003cinput type=\"checkbox\" value=\"${k}\" ${['pres','prat','perf'].includes(k)?'checked':''}> ${n}\u003c/label>`); });\nconst norm=s=>s.toLowerCase().replace(/[!.,¡¿?]/g,' ').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/\\s+/g,' ').trim();\nconst stripP=s=>s.replace(/^(ich|du|er\\/sie\\/es|er|sie\\/sie|sie|es|wir|ihr)\\s+/,'');\nlet Q=null, score=0, total=0;\nfunction pool(){ const b=pblk.value; return V.map((v,k)=>[v,k]).filter(([v,k])=> b==='all'||(b==='L'&&learned.has(v.i))||(b==='P'&&!learned.has(v.i))||(b[0]==='b'&&Math.floor(k/10)==+b.slice(1))); }\nfunction mode(){ return document.querySelector('input[name=pm]:checked').value; }\nfunction newQ(){\n  const P=pool(); const fb=$('#p-fb'); fb.className='fb'; fb.innerHTML='';\n  if(!P.length){ $('#p-prompt').innerHTML='No hay verbos en esta selección. Elige otro bloque.'; $('#p-inputs').innerHTML=''; Q=null; return; }\n  const [v]=P[Math.floor(Math.random()*P.length)];\n  if(mode()==='stamm'){\n    const s=stamm(v);\n    Q={v,type:'stamm',ans:[s.prat,s.perf]};\n    $('#p-prompt').innerHTML=`\u003cspan class=\"qv\">${esc(disp(v))}\u003c/span>\u003cspan class=\"qm\">${esc(v.es)}\u003c/span>\u003cspan class=\"qt\">Escribe el Präteritum y el Perfekt en 3.ª persona (er)\u003c/span>`;\n    $('#p-inputs').innerHTML=`\u003clabel>Präteritum\u003cinput id=\"a0\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"p. ej. kam\">\u003c/label>\u003clabel>Perfekt\u003cinput id=\"a1\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"p. ej. ist gekommen\">\u003c/label>`;\n  } else {\n    const ts=[...tbox.querySelectorAll('input:checked')].map(i=>i.value);\n    if(!ts.length){ $('#p-prompt').innerHTML='Elige al menos un tiempo verbal.'; $('#p-inputs').innerHTML=''; Q=null; return; }\n    let t=ts[Math.floor(Math.random()*ts.length)];\n    let c=conj(v,t); if(!c){ t='pres'; c=conj(v,t); }\n    const i=Math.floor(Math.random()*c.length), x=c[i];\n    const T=TENSES.find(z=>z[0]===t), p= t==='imp'? x.p : PRON[i];\n    Q={v,type:'conj',t,p,x,ans:[[x.fin,x.mid,x.end].filter(Boolean).join(' ')]};\n    $('#p-prompt').innerHTML=`\u003cspan class=\"qv\">${esc(disp(v))}\u003c/span>\u003cspan class=\"qm\">${esc(v.es)}\u003c/span>\u003cspan class=\"qt\">\u003cspan class=\"chip\" style=\"background:var(--${T[3]})\">${T[1]}\u003c/span> persona: \u003cstrong>${esc(p)}\u003c/strong>\u003c/span>`;\n    $('#p-inputs').innerHTML=`\u003clabel>Tu respuesta${t==='imp'?' (sin signos)':''}\u003cinput id=\"a0\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"${t==='imp'?'p. ej. komm':'solo el verbo, sin pronombre'}\">\u003c/label>`;\n  }\n  $('#a0').focus(); $('#p-check').hidden=false; $('#p-next').hidden=true;\n}\nfunction check(){\n  if(!Q) return;\n  const ins=[...document.querySelectorAll('#p-inputs input')];\n  let ok=true;\n  ins.forEach((inp,k)=>{\n    let a=norm(inp.value), e=Q.ans[k];\n    if(Q.type==='conj' && Q.t!=='imp') a=stripP(a);\n    let good = a===norm(e);\n    if(!good && e.startsWith('ist/hat ')) good = [ 'ist '+e.slice(8), 'hat '+e.slice(8)].some(z=>norm(z)===a);\n    if(!good && Q.type==='conj' && Q.t==='imp' && Q.p==='Sie') good = a===norm(e.replace(/ Sie/,' sie'));\n    inp.classList.toggle('bad',!good); inp.classList.toggle('good',good); ok=ok&&good;\n  });\n  total++; if(ok) score++;\n  $('#p-score').textContent=`${score} de ${total}`;\n  const sol = Q.type==='stamm' ? `${mv(Q.ans[0])} · ${mv(Q.ans[1])}` : `${Q.t==='imp'?'':esc(Q.p)+' '}${formHTML(Q.x)}${Q.t==='imp'?'!':''}`;\n  const fb=$('#p-fb'); fb.className='fb '+(ok?'y':'n');\n  fb.innerHTML=(ok?'\u003cstrong>Correcto.\u003c/strong> ':'\u003cstrong>Respuesta correcta:\u003c/strong> ')+sol;\n  $('#p-check').hidden=true; $('#p-next').hidden=false; $('#p-next').focus();\n}\n$('#p-check').onclick=check; $('#p-next').onclick=newQ;\n$('#p-inputs').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const ins=[...document.querySelectorAll('#p-inputs input')]; const i=ins.indexOf(e.target); if(i\u003cins.length-1) ins[i+1].focus(); else check(); }});\ndocument.addEventListener('keydown',e=>{ if(e.key==='Enter' && !$('#p-next').hidden && document.activeElement===$('#p-next')){} });\n[pblk,tbox].forEach(el=>el.addEventListener('change',newQ));\ndocument.querySelectorAll('input[name=pm]').forEach(r=>r.addEventListener('change',()=>{ $('#p-tbox').hidden=mode()==='stamm'; newQ(); }));\n$('#p-reset').onclick=()=>{ score=0; total=0; $('#p-score').textContent='0 de 0'; };\n\nupdProg(); renderList(); showVerb(0); newQ();\nlet t0='list'; try{ t0=localStorage.getItem('v100-tab')||'list'; }catch(e){} tab(t0);\n\u003c/script>\u003c/body>\u003c/html>", "b2": "\u003c!DOCTYPE html>\n\u003chtml lang=\"es\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Gramática alemana B2 · tabla de estudio\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --bg:#FBFAFD; --surface:#FFFFFF; --ink:#2C2A36; --muted:#6D6A7C; --rule:#E4E1EC;\n  --verb:#BFE3F8; --fem:#F9CADF; --mas:#CBEBC6; --neu:#DCCBF2; --pl:#FDD8B5;\n  --dat:#AFC0E2; --dat-line:#6E86BC; --akk:#F7B7B4; --akk-line:#E07B78;\n  --t1:#FFF0A6; --t2:#BDEDE6; --t3:#FFCFC0; --t4:#E4F3B4; --t5:#D8E0EA; --t6:#ECDDBF; --t7:#F3DDF6; --t8:#E3E3E3;\n  --hl-ink:#2A2733; --gen:#EFE0AE; --gen-line:#C4A240; --t9:#DAD8B4;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){ --bg:#1D1C24; --surface:#26252F; --ink:#ECEAF3; --muted:#A8A5B8; --rule:#3A3846; }\n}\n:root[data-theme=\"dark\"]{ --bg:#1D1C24; --surface:#26252F; --ink:#ECEAF3; --muted:#A8A5B8; --rule:#3A3846; }\n:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }\nhtml{ scroll-padding-top:env(safe-area-inset-top,0px); }\n*,*::before,*::after{ box-sizing:inherit; }\nbody{ margin:0; background:var(--bg); color:var(--ink); font-family:\"Lexend\",system-ui,-apple-system,\"Segoe UI\",sans-serif; font-weight:300; line-height:1.55; }\nmain{ max-width:1040px; margin:0 auto; padding:2.5rem 1.25rem 4rem; }\nh1{ font-family:\"Literata\",Georgia,serif; font-weight:600; font-size:clamp(2rem,5vw,3.1rem); line-height:1.1; margin:0 0 .5rem; letter-spacing:-.01em; }\n.lead{ color:var(--muted); max-width:62ch; margin:0 0 2rem; }\nh2{ font-family:\"Literata\",Georgia,serif; font-weight:600; font-size:1.6rem; margin:3rem 0 .4rem; }\nh3{ font-weight:600; font-size:1.05rem; margin:1.6rem 0 .4rem; }\np.note{ color:var(--muted); margin:.2rem 0 1rem; max-width:70ch; }\n\n/* resaltados */\nmark{ background:none; color:inherit; padding:.05em .28em; border-radius:5px; }\nmark.v,mark.f,mark.m,mark.n,mark.p{ color:var(--hl-ink); }\nmark.v{ background:var(--verb); font-weight:600; }\nmark.f{ background:var(--fem); }\nmark.m{ background:var(--mas); }\nmark.n{ background:var(--neu); }\nmark.p{ background:var(--pl); }\nmark.d{ box-shadow:inset 0 -3px 0 var(--dat-line); }\nmark.a{ box-shadow:inset 0 -3px 0 var(--akk-line); }\n\n/* leyenda */\n.legend{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:.6rem 1.2rem; background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:1.1rem 1.25rem; }\n.legend div{ display:flex; align-items:center; gap:.6rem; font-size:.95rem; }\n.sw{ width:2.2rem; height:1.35rem; border-radius:5px; flex:none; }\n.sw.line{ background:transparent; border-bottom:4px solid; border-radius:0; height:1rem; }\n.tenses{ display:flex; flex-wrap:wrap; gap:.45rem; margin-top:.9rem; }\n.chip{ color:var(--hl-ink); padding:.2rem .7rem; border-radius:999px; font-size:.88rem; font-weight:400; }\n\n/* tablas */\n.scroll{ overflow-x:auto; margin:.6rem 0 1rem; border:1px solid var(--rule); border-radius:14px; background:var(--surface); }\ntable{ border-collapse:collapse; width:100%; min-width:560px; }\nth,td{ padding:.6rem .8rem; text-align:left; vertical-align:top; border-bottom:1px solid var(--rule); }\ntr:last-child td{ border-bottom:none; }\nthead th{ font-weight:600; font-size:.9rem; }\nth.hm{ background:var(--mas); color:var(--hl-ink);} th.hf{ background:var(--fem); color:var(--hl-ink);}\nth.hn{ background:var(--neu); color:var(--hl-ink);} th.hp{ background:var(--pl); color:var(--hl-ink);}\nth.hakk{ background:var(--akk); color:var(--hl-ink);} th.hdat{ background:var(--dat); color:var(--hl-ink);}\nth.hv{ background:var(--verb); color:var(--hl-ink);}\ntd.case{ font-weight:600; white-space:nowrap; }\ntd.cakk{ box-shadow:inset 4px 0 0 var(--akk-line); } td.cdat{ box-shadow:inset 4px 0 0 var(--dat-line); }\n.big{ font-family:\"Literata\",Georgia,serif; font-size:1.15rem; }\n\n/* ejemplos */\n.ex{ display:grid; gap:.25rem; }\n.ex p{ margin:0; display:flex; gap:.55rem; align-items:baseline; }\n.ex .lg{ flex:none; font-size:.7rem; font-weight:600; width:1.9rem; text-align:center; border:1px solid var(--rule); border-radius:4px; color:var(--muted); padding:.05rem 0; }\n.ex .de{ font-family:\"Literata\",Georgia,serif; font-size:1.08rem; }\n.ex .en,.ex .es{ font-size:.93rem; color:var(--muted); }\n.ex .en mark,.ex .es mark{ color:var(--hl-ink); }\n.card{ background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:1rem 1.2rem; margin:.6rem 0; }\n\n/* tiempos */\ntr.t td:first-child{ font-weight:600; white-space:nowrap; }\ntr.t1 td:first-child{ background:var(--t1); color:var(--hl-ink);} tr.t2 td:first-child{ background:var(--t2); color:var(--hl-ink);}\ntr.t3 td:first-child{ background:var(--t3); color:var(--hl-ink);} tr.t4 td:first-child{ background:var(--t4); color:var(--hl-ink);}\ntr.t5 td:first-child{ background:var(--t5); color:var(--hl-ink);} tr.t6 td:first-child{ background:var(--t6); color:var(--hl-ink);}\ntr.t7 td:first-child{ background:var(--t7); color:var(--hl-ink);} tr.t8 td:first-child{ background:var(--t8); color:var(--hl-ink);}\ntr.t td:first-child small{ display:block; font-weight:300; font-size:.8rem; }\n.form{ font-size:.9rem; }\ntd > .ex + .ex{ margin-top:.8rem; padding-top:.8rem; border-top:1px dashed var(--rule); }\n\nfooter{ margin-top:3rem; color:var(--muted); font-size:.85rem; }\n@media (max-width:600px){ main{ padding:1.6rem 1rem 3rem; } h2{ font-size:1.35rem; } }\n\nmark.g{ box-shadow:inset 0 -3px 0 var(--gen-line); }\nth.hgen{ background:var(--gen); color:var(--hl-ink);} td.cgen{ box-shadow:inset 4px 0 0 var(--gen-line); }\ntr.t9 3c/mark> \u003cmark class=\"v\">habe\u003c/mark> keine Nebenwirkungen.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"p\">The researchers\u003c/mark> \u003cmark class=\"v\">claim\u003c/mark> \u003cmark class=\"n\">the medicine\u003c/mark> \u003cmark class=\"v\">has\u003c/mark> no side effects.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"p\">Los investigadores\u003c/mark> \u003cmark class=\"v\">afirman\u003c/mark> que \u003cmark class=\"n\">el medicamento\u003c/mark> no \u003cmark class=\"v\">tiene\u003c/mark> efectos secundarios.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"t t9\">\u003ctd class=\"\">Konj. I · pasado\u003c/td>\u003ctd class=\"form\">sei / habe + Partizip II\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Sie \u003cmark class=\"v\">erzählte\u003c/mark>, sie \u003cmark class=\"v\">habe\u003c/mark> \u003cmark class=\"m a\">den Termin\u003c/mark> \u003cmark class=\"v\">vergessen\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">She \u003cmark class=\"v\">said\u003c/mark> she \u003cmark class=\"v\">had forgotten\u003c/mark> \u003cmark class=\"m a\">the appointment\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"v\">Contó\u003c/mark> que \u003cmark class=\"v\">había olvidado\u003c/mark> \u003cmark class=\"m a\">la cita\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"m\">Der Zeuge\u003c/mark> \u003cmark class=\"v\">erklärte\u003c/mark>, er \u003cmark class=\"v\">sei\u003c/mark> um 22 Uhr nach Hause \u003cmark class=\"v\">gegangen\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/spa
