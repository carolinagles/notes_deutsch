rk> you \u003cmark class=\"v\">waiting\u003c/mark> for? – For \u003cmark class=\"m\">the rain\u003c/mark> \u003cmark class=\"v\">to stop\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">¿Qué \u003cmark class=\"v\">esperas\u003c/mark>? – Que \u003cmark class=\"m\">la lluvia\u003c/mark> \u003cmark class=\"v\">pare\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/div>\u003ch2 id=\"kon\">Conectores\u003c/h2>\u003cp class=\"note\">Lo importante es dónde queda el verbo después de cada conector.\u003c/p>\u003cdiv class=\"scroll\">\u003ctable style=\"min-width:860px\">\u003cthead>\u003ctr>\u003cth class=\"\">Tipo\u003c/th>\u003cth class=\"\">Conectores\u003c/th>\u003cth class=\"\">Posición del verbo\u003c/th>\u003cth class=\"\">Ejemplo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr class=\"\">\u003ctd class=\"\">\u003cstrong>Conjunción\u003c/strong>\u003c/td>\u003ctd class=\"\">und, aber, oder, denn, sondern\u003c/td>\u003ctd class=\"\">no cambia (posición 0)\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Ich \u003cmark class=\"v\">bleibe\u003c/mark> zu Hause, denn ich \u003cmark class=\"v\">bin\u003c/mark> müde.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">I \u003cmark class=\"v\">am staying\u003c/mark> home because I \u003cmark class=\"v\">am\u003c/mark> tired.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">Me \u003cmark class=\"v\">quedo\u003c/mark> en casa porque \u003cmark class=\"v\">estoy\u003c/mark> cansada.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"\">\u003ctd class=\"\">\u003cstrong>Subordinante\u003c/strong>\u003c/td>\u003ctd class=\"\">obwohl, weil, nachdem, bevor, während, damit, falls, sodass, seitdem\u003c/td>\u003ctd class=\"\">verbo al final\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Obwohl es \u003cmark class=\"v\">regnete\u003c/mark>, \u003cmark class=\"v\">machten\u003c/mark> wir \u003cmark class=\"m a\">einen Ausflug\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">Although it \u003cmark class=\"v\">was raining\u003c/mark>, we \u003cmark class=\"v\">went\u003c/mark> on \u003cmark class=\"m a\">a trip\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">Aunque \u003cmark class=\"v\">llovía\u003c/mark>, \u003cmark class=\"v\">hicimos\u003c/mark> \u003cmark class=\"m a\">una excursión\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Nachdem sie \u003cmark class=\"f a\">die Prüfung\u003c/mark> \u003cmark class=\"v\">bestanden hatte\u003c/mark>, \u003cmark class=\"v\">feierte\u003c/mark> sie.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">After she \u003cmark class=\"v\">had passed\u003c/mark> \u003cmark class=\"f a\">the exam\u003c/mark>, she \u003cmark class=\"v\">celebrated\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">Después de que \u003cmark class=\"v\">aprobó\u003c/mark> \u003cmark class=\"f a\">el examen\u003c/mark>, \u003cmark class=\"v\">celebró\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"\">\u003ctd class=\"\">\u003cstrong>Adverbio\u003c/strong>\u003c/td>\u003ctd class=\"\">deshalb, trotzdem, außerdem, dennoch, folglich, stattdessen\u003c/td>\u003ctd class=\"\">ocupa la posición 1; verbo en 2.ª\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Es \u003cmark class=\"v\">regnete\u003c/mark>, trotzdem \u003cmark class=\"v\">machten\u003c/mark> wir \u003cmark class=\"m a\">einen Ausflug\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">It \u003cmark class=\"v\">was raining\u003c/mark>; nevertheless we \u003cmark class=\"v\">went\u003c/mark> on \u003cmark class=\"m a\">a trip\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"v\">Llovía\u003c/mark>; aun así \u003cmark class=\"v\">hicimos\u003c/mark> \u003cmark class=\"m a\">una excursión\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"\">\u003ctd class=\"\">\u003cstrong>De dos partes\u003c/strong>\u003c/td>\u003ctd class=\"\">je … desto, sowohl … als auch, weder … noch, entweder … oder, nicht nur … sondern auch, zwar … aber\u003c/td>\u003ctd class=\"\">je: verbo al final; desto: verbo en 2.ª\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Je mehr ich \u003cmark class=\"v\">übe\u003c/mark>, desto besser \u003cmark class=\"v\">spreche\u003c/mark> ich.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">The more I \u003cmark class=\"v\">practise\u003c/mark>, the better I \u003cmark class=\"v\">speak\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">Cuanto más \u003cmark class=\"v\">practico\u003c/mark>, mejor \u003cmark class=\"v\">hablo\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Er \u003cmark class=\"v\">spricht\u003c/mark> weder \u003cmark class=\"n a\">Französisch\u003c/mark> noch \u003cmark class=\"n a\">Spanisch\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">He \u003cmark class=\"v\">speaks\u003c/mark> neither \u003cmark class=\"n a\">French\u003c/mark> nor \u003cmark class=\"n a\">Spanish\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">No \u003cmark class=\"v\">habla\u003c/mark> ni \u003cmark class=\"n a\">francés\u003c/mark> ni \u003cmark class=\"n a\">español\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"f\">Die Wohnung\u003c/mark> \u003cmark class=\"v\">ist\u003c/mark> zwar klein, aber sehr hell.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"f\">The flat\u003c/mark> \u003cmark class=\"v\">is\u003c/mark> small, but very bright.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"f\">El departamento\u003c/mark> \u003cmark class=\"v\">es\u003c/mark> pequeño, pero muy luminoso.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch2 id=\"inf\">Construcciones con zu\u003c/h2>\u003cp class=\"note\">Se usan cuando el sujeto de ambas partes es el mismo. Con verbos separables, \u003cem>zu\u003c/em> va en medio: an\u003cstrong>zu\u003c/strong>rufen.\u003c/p>\u003cdiv class=\"scroll\">\u003ctable style=\"min-width:760px\">\u003cthead>\u003ctr>\u003cth class=\"\">Estructura\u003c/th>\u003cth class=\"\">Uso\u003c/th>\u003cth class=\"\">Ejemplo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr class=\"\">\u003ctd class=\"\">um … zu\u003c/td>\u003ctd class=\"\">finalidad (para)\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Ich \u003cmark class=\"v\">lerne\u003c/mark> Deutsch, um in \u003cmark class=\"n d\">Deutschland\u003c/mark> \u003cmark class=\"v\">zu arbeiten\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">I \u003cmark class=\"v\">am learning\u003c/mark> German \u003cmark class=\"v\">to work\u003c/mark> in \u003cmark class=\"n d\">Germany\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"v\">Estudio\u003c/mark> alemán para \u003cmark class=\"v\">trabajar\u003c/mark> en \u003cmark class=\"n d\">Alemania\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"\">\u003ctd class=\"\">ohne … zu\u003c/td>\u003ctd class=\"\">sin hacer algo\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Er \u003cmark class=\"v\">ging\u003c/mark>, ohne sich \u003cmark class=\"v\">zu verabschieden\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">He \u003cmark class=\"v\">left\u003c/mark> without \u003cmark class=\"v\">saying\u003c/mark> goodbye.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">Se \u003cmark class=\"v\">fue\u003c/mark> sin \u003cmark class=\"v\">despedirse\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"\">\u003ctd class=\"\">(an)statt … zu\u003c/td>\u003ctd class=\"\">en lugar de\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Statt \u003cmark class=\"p a\">die Hausaufgaben\u003c/mark> \u003cmark class=\"v\">zu machen\u003c/mark>, \u003cmark class=\"v\">spielte\u003c/mark> er.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">Instead of \u003cmark class=\"v\">doing\u003c/mark> \u003cmark class=\"p a\">the homework\u003c/mark>, he \u003cmark class=\"v\">played\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">En lugar de \u003cmark class=\"v\">hacer\u003c/mark> \u003cmark class=\"p a\">la tarea\u003c/mark>, \u003cmark class=\"v\">jugó\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"\">\u003ctd class=\"\">Verbo / adjetivo + zu\u003c/td>\u003ctd class=\"\">es ist wichtig, versuchen, vergessen…\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Es \u003cmark class=\"v\">ist\u003c/mark> wichtig, \u003cmark class=\"p a\">die Regeln\u003c/mark> \u003cmark class=\"v\">zu kennen\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">It \u003cmark class=\"v\">is\u003c/mark> important \u003cmark class=\"v\">to know\u003c/mark> \u003cmark class=\"p a\">the rules\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"v\">Es\u003c/mark> importante \u003cmark class=\"v\">conocer\u003c/mark> \u003cmark class=\"p a\">las reglas\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"v\">Vergiss\u003c/mark> nicht, \u003cmark class=\"a\">mich\u003c/mark> \u003cmark class=\"v\">anzurufen\u003c/mark>!\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">Don’t \u003cmark class=\"v\">forget\u003c/mark> \u003cmark class=\"v\">to call\u003c/mark> \u003cmark class=\"a\">me\u003c/mark>!\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">¡No \u003cmark class=\"v\">olvides\u003c/mark> \u003cmark class=\"v\">llamar\u003c/mark>me!\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch2 id=\"modal\">Verbos modales para suposiciones\u003c/h2>\u003cp class=\"note\">Además de su significado normal, los modales expresan qué tan seguro está el hablante.\u003c/p>\u003cdiv class=\"scroll\">\u003ctable style=\"min-width:720px\">\u003cthead>\u003ctr>\u003cth class=\"\">Modal\u003c/th>\u003cth class=\"\">Grado de certeza\u003c/th>\u003cth class=\"\">Ejemplo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr class=\"\">\u003ctd class=\"\">müssen\u003c/td>\u003ctd class=\"\">\u003cspan class=\"pct\">casi seguro\u003c/span>\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Er \u003cmark class=\"v\">muss\u003c/mark> krank \u003cmark class=\"v\">sein\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">He \u003cmark class=\"v\">must be\u003c/mark> sick.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"v\">Debe de estar\u003c/mark> enfermo.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"\">\u003ctd class=\"\">dürfte\u003c/td>\u003ctd class=\"\">\u003cspan class=\"pct\">probable\u003c/span>\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Das \u003cmark class=\"v\">dürfte\u003c/mark> \u003cmark class=\"m\">der neue Chef\u003c/mark> \u003cmark class=\"v\">sein\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">That \u003cmark class=\"v\">is probably\u003c/mark> \u003cmark class=\"m\">the new boss\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">Ese \u003cmark class=\"v\">debe de ser\u003c/mark> \u003cmark class=\"m\">el nuevo jefe\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"\">\u003ctd class=\"\">werden + wohl\u003c/td>\u003ctd class=\"\">\u003cspan class=\"pct\">suposición\u003c/span>\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"f\">Sie\u003c/mark> \u003cmark class=\"v\">wird\u003c/mark> wohl im Büro \u003cmark class=\"v\">sein\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"f\">She\u003c/mark> \u003cmark class=\"v\">is\u003c/mark> probably at the office.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"f\">Ella\u003c/mark> \u003cmark class=\"v\">estará\u003c/mark> en la oficina.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"\">\u003ctd class=\"\">können / könnte\u003c/td>\u003ctd class=\"\">\u003cspan class=\"pct\">posible\u003c/span>\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"m\">Der Schlüssel\u003c/mark> \u003cmark class=\"v\">könnte\u003c/mark> im Auto \u003cmark class=\"v\">sein\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"m\">The key\u003c/mark> \u003cmark class=\"v\">could be\u003c/mark> in the car.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"m\">La llave\u003c/mark> \u003cmark class=\"v\">podría estar\u003c/mark> en el coche.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"\">\u003ctd class=\"\">sollen\u003c/td>\u003ctd class=\"\">\u003cspan class=\"pct\">se dice que\u003c/span>\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"f\">Sie\u003c/mark> \u003cmark class=\"v\">soll\u003c/mark> sehr reich \u003cmark class=\"v\">sein\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"f\">She\u003c/mark> \u003cmark class=\"v\">is said to be\u003c/mark> very rich.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">Dicen que \u003cmark class=\"f\">ella\u003c/mark> \u003cmark class=\"v\">es\u003c/mark> muy rica.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"\">\u003ctd class=\"\">wollen\u003c/td>\u003ctd class=\"\">\u003cspan class=\"pct\">él/ella afirma que\u003c/span>\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Er \u003cmark class=\"v\">will\u003c/mark> \u003cmark class=\"m a\">den Unfall\u003c/mark> \u003cmark class=\"v\">gesehen haben\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">He \u003cmark class=\"v\">claims to have seen\u003c/mark> \u003cmark class=\"m a\">the accident\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"v\">Afirma haber visto\u003c/mark> \u003cmark class=\"m a\">el accidente\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch2 id=\"part\">Participio como adjetivo\u003c/h2>\u003cp class=\"note\">Muy común en textos formales. El Partizip I (infinitivo + d) describe algo que ocurre; el Partizip II, algo ya ocurrido o pasivo. Lleva terminación de adjetivo.\u003c/p>\u003cdiv class=\"card\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"n\">Das schlafende Kind\u003c/mark> \u003cmark class=\"v\">liegt\u003c/mark> im Bett. \u003csmall>= das Kind, das schläft\u003c/small>\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"n\">The sleeping child\u003c/mark> \u003cmark class=\"v\">is lying\u003c/mark> in bed.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"n\">El niño dormido\u003c/mark> \u003cmark class=\"v\">está\u003c/mark> acostado en la cama.\u003c/span>\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Ich \u003cmark class=\"v\">trage\u003c/mark> \u003cmark class=\"f a\">die gestern gekaufte Jacke\u003c/mark>. \u003csmall>= die Jacke, die gestern gekauft wurde\u003c/small>\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">I \u003cmark class=\"v\">am wearing\u003c/mark> \u003cmark class=\"f a\">the jacket bought yesterday\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"v\">Llevo puesta\u003c/mark> \u003cmark class=\"f a\">la chamarra que compré ayer\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"m\">Der seit Jahren in Berlin lebende Künstler\u003c/mark> \u003cmark class=\"v\">stellt\u003c/mark> \u003cmark class=\"p a\">seine Bilder\u003c/mark> \u003cmark class=\"v\">aus\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"m\">The artist who has lived in Berlin for years\u003c/mark> \u003cmark class=\"v\">is exhibiting\u003c/mark> \u003cmark class=\"p a\">his paintings\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"m\">El artista que vive desde hace años en Berlín\u003c/mark> \u003cmark class=\"v\">expone\u003c/mark> \u003cmark class=\"p a\">sus cuadros\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/div>\u003ch2 id=\"ndekl\">Declinación n\u003c/h2>\u003cp class=\"note\">Algunos sustantivos masculinos (personas y animales, muchos en -e, -ent, -ant, -ist) añaden \u003cstrong>-n / -en\u003c/strong> en todos los casos excepto el nominativo singular.\u003c/p>\u003cdiv class=\"scroll\">\u003ctable style=\"min-width:560px\">\u003cthead>\u003ctr>\u003cth class=\"\">Caso\u003c/th>\u003cth class=\"hm\">der Student\u003c/th>\u003cth class=\"hm\">der Kollege\u003c/th>\u003cth class=\"hm\">der Herr\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr class=\"\">\u003ctd class=\"case\">Nominativ\u003c/td>\u003ctd class=\"\">\u003cmark class=\"m\">der Student\u003c/mark>\u003c/td>\u003ctd class=\"\">\u003cmark class=\"m\">der Kollege\u003c/mark>\u003c/td>\u003ctd class=\"\">\u003cmark class=\"m\">der Herr\u003c/mark>\u003c/td>\u003c/tr>\u003ctr class=\"\">\u003ctd class=\"case cakk\">Akkusativ\u003c/td>\u003ctd class=\"\">\u003cmark class=\"m a\">den Studenten\u003c/mark>\u003c/td>\u003ctd class=\"\">\u003cmark class=\"m a\">den Kollegen\u003c/mark>\u003c/td>\u003ctd class=\"\">\u003cmark class=\"m a\">den Herrn\u003c/mark>\u003c/td>\u003c/tr>\u003ctr class=\"\">\u003ctd class=\"case cdat\">Dativ\u003c/td>\u003ctd class=\"\">\u003cmark class=\"m d\">dem Studenten\u003c/mark>\u003c/td>\u003ctd class=\"\">\u003cmark class=\"m d\">dem Kollegen\u003c/mark>\u003c/td>\u003ctd class=\"\">\u003cmark class=\"m d\">dem Herrn\u003c/mark>\u003c/td>\u003c/tr>\u003ctr class=\"\">\u003ctd class=\"case cgen\">Genitiv\u003c/td>\u003ctd class=\"\">\u003cmark class=\"m g\">des Studenten\u003c/mark>\u003c/td>\u003ctd class=\"\">\u003cmark class=\"m g\">des Kollegen\u003c/mark>\u003c/td>\u003ctd class=\"\">\u003cmark class=\"m g\">des Herrn\u003c/mark>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Ich \u003cmark class=\"v\">frage\u003c/mark> \u003cmark class=\"m a\">den Kollegen\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">I \u003cmark class=\"v\">ask\u003c/mark> \u003cmark class=\"m a\">the colleague\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">Le \u003cmark class=\"v\">pregunto\u003c/mark> \u003cmark class=\"m a\">al colega\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Das \u003cmark class=\"v\">ist\u003c/mark> \u003cmark class=\"n\">das Zimmer\u003c/mark> \u003cmark class=\"m g\">des Studenten\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">That \u003cmark class=\"v\">is\u003c/mark> \u003cmark class=\"m g\">the student’s\u003c/mark> \u003cmark class=\"n\">room\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">Esa \u003cmark class=\"v\">es\u003c/mark> \u003cmark class=\"n\">la habitación\u003c/mark> \u003cmark class=\"m g\">del estudiante\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/div>\u003ch2 id=\"nvv\">Nomen-Verb-Verbindungen\u003c/h2>\u003cp class=\"note\">Expresiones fijas de sustantivo + verbo típicas del registro formal. El verbo pierde casi todo su significado y el sustantivo lleva el sentido.\u003c/p>\u003cdiv class=\"scroll\">\u003ctable style=\"min-width:820px\">\u003cthead>\u003ctr>\u003cth class=\"\">Expresión\u003c/th>\u003cth class=\"\">Equivale a\u003c/th>\u003cth class=\"\">Ejemplo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr class=\"\">\u003ctd class=\"\">eine Entscheidung treffen\u003c/td>\u003ctd class=\"\">entscheiden · decidir\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Wir \u003cmark class=\"v\">müssen\u003c/mark> bald \u003cmark class=\"f a\">eine Entscheidung\u003c/mark> \u003cmark class=\"v\">treffen\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">We \u003cmark class=\"v\">must make\u003c/mark> \u003cmark class=\"f a\">a decision\u003c/mark> soon.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">Pronto \u003cmark class=\"v\">debemos tomar\u003c/mark> \u003cmark class=\"f a\">una decisión\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"\">\u003ctd class=\"\">zur Verfügung stellen\u003c/td>\u003ctd class=\"\">geben · poner a disposición\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"f\">Die Firma\u003c/mark> \u003cmark class=\"v\">stellt\u003c/mark> \u003cmark class=\"p d\">den Mitarbeitern\u003c/mark> \u003cmark class=\"p a\">Laptops\u003c/mark> \u003cmark class=\"f d\">zur Verfügung\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"f\">The company\u003c/mark> \u003cmark class=\"v\">provides\u003c/mark> \u003cmark class=\"p a\">laptops\u003c/mark> to \u003cmark class=\"p d\">its employees\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"f\">La empresa\u003c/mark> \u003cmark class=\"v\">pone\u003c/mark> \u003cmark class=\"p a\">laptops\u003c/mark> \u003cmark class=\"f d\">a disposición\u003c/mark> \u003cmark class=\"p d\">de los empleados\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"\">\u003ctd class=\"\">in Kraft treten\u003c/td>\u003ctd class=\"\">gültig werden · entrar en vigor\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"n\">Das neue Gesetz\u003c/mark> \u003cmark class=\"v\">tritt\u003c/mark> im Januar in \u003cmark class=\"f a\">Kraft\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"n\">The new law\u003c/mark> \u003cmark class=\"v\">comes\u003c/mark> into \u003cmark class=\"f a\">force\u003c/mark> in January.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"n\">La nueva ley\u003c/mark> \u003cmark class=\"v\">entra\u003c/mark> en \u003cmark class=\"f a\">vigor\u003c/mark> en enero.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"\">\u003ctd class=\"\">eine Rolle spielen\u003c/td>\u003ctd class=\"\">wichtig sein · desempeñar un papel\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"n\">Geld\u003c/mark> \u003cmark class=\"v\">spielt\u003c/mark> für ihn \u003cmark class=\"f a\">keine Rolle\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"n\">Money\u003c/mark> \u003cmark class=\"v\">plays\u003c/mark> \u003cmark class=\"f a\">no role\u003c/mark> for him.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">Para él \u003cmark class=\"n\">el dinero\u003c/mark> no \u003cmark class=\"v\">tiene\u003c/mark> \u003cmark class=\"f a\">importancia\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"\">\u003ctd class=\"\">Rücksicht nehmen auf\u003c/td>\u003ctd class=\"\">berücksichtigen · tener en cuenta\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Bitte \u003cmark class=\"v\">nehmen\u003c/mark> Sie \u003cmark class=\"f a\">Rücksicht\u003c/mark> auf \u003cmark class=\"p a\">die Nachbarn\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">Please \u003cmark class=\"v\">be considerate\u003c/mark> of \u003cmark class=\"p a\">the neighbours\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">Por favor, \u003cmark class=\"v\">tenga\u003c/mark> \u003cmark class=\"f a\">consideración\u003c/mark> con \u003cmark class=\"p a\">los vecinos\u003c/mark>.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003ctr class=\"\">\u003ctd class=\"\">in Frage kommen\u003c/td>\u003ctd class=\"\">möglich sein · ser una opción\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"ex\">\u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"m\">Dieser Termin\u003c/mark> \u003cmark class=\"v\">kommt\u003c/mark> für uns nicht in \u003cmark class=\"f a\">Frage\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"m\">This date\u003c/mark> \u003cmark class=\"v\">is\u003c/mark> out of \u003cmark class=\"f a\">the question\u003c/mark> for us.\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"m\">Esa fecha\u003c/mark> no \u003cmark class=\"v\">es\u003c/mark> \u003cmark class=\"f a\">una opción\u003c/mark> para nosotros.\u003c/span>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfooter>Los colores del inglés y del español siguen la palabra alemana; por eso «el periódico» aparece en rosa: en alemán es \u003cem>die Zeitung\u003c/em>.\u003c/footer>\n\u003c/main>\u003c/body>\u003c/html>"}</script>

{t:'W-Fragen',x:'Las palabras interrogativas van en la posición 1 y el verbo conjugado en la 2: wer (quién), was (qué), wo (dónde), woher (de dónde), wohin (a dónde), wann (cuándo), wie (cómo), warum (por qué).',e:[['*Woher* [v:kommst] du?','¿De dónde [v:eres]?'],['*Wo* [v:wohnt] [m:dein Bruder]?','¿Dónde [v:vive] [m:tu hermano]?'],['*Wohin* [v:fährst] du im Urlaub?','¿A dónde [v:vas] de vacaciones?']]},
{t:'nicht und kein',x:'kein niega un sustantivo que llevaría ein o ningún artículo, y se declina como ein. nicht niega el verbo, adjetivos, adverbios y sustantivos con artículo definido.',e:[['Ich [v:habe] [m a:*keinen* Hund].','No [v:tengo] [m a:perro].'],['Ich [v:wohne] *nicht* in Berlin.','No [v:vivo] en Berlín.'],['[n:Das Essen] [v:ist] *nicht* teuer.','[n:La comida] no [v:es] cara.']]},
{t:'ja, nein, doch',x:'doch responde «sí» a una pregunta formulada en negativo o contradice una afirmación negativa.',e:[['[v:Hast] du [f a:keine Zeit]? – *Doch*, ich [v:habe] Zeit.','¿No [v:tienes] [f a:tiempo]? – Sí, sí [v:tengo].'],['[v:Kommst] du nicht mit? – *Doch*!','¿No [v:vienes]? – ¡Claro que sí!']]},
{t:'Possessivartikel',x:'mein, dein, sein, ihr, unser, euer, ihr/Ihr. Toman las mismas terminaciones que ein/kein según género y caso.',e:[['[f:*Meine* Mutter] [v:ist] Ärztin.','[f:Mi madre] [v:es] médica.'],['[v:Ist] das [n:*dein* Auto]?','¿[v:Es] [n:tu coche]?'],['Ich [v:besuche] [m a:*unseren* Opa].','[v:Visito] [m a:a nuestro abuelo].']]},
{t:'und, aber, oder, denn, sondern',x:'Conectores de posición 0: no ocupan lugar en la oración, así que el orden sigue siendo sujeto + verbo. sondern corrige después de una negación.',e:[['Ich [v:trinke] [m a:Kaffee] *und* du [v:trinkst] [m a:Tee].','[v:Tomo] [m a:café] y tú [v:tomas] [m a:té].'],['Er [v:bleibt] zu Hause, *denn* er [v:ist] krank.','[v:Se queda] en casa, porque [v:está] enfermo.'],['Ich [v:komme] nicht heute, *sondern* morgen.','No [v:vengo] hoy, sino mañana.']]},
{t:'gern, lieber, am liebsten',x:'gern expresa gusto por una actividad; lieber es preferencia; am liebsten es lo que más gusta.',e:[['Ich [v:spiele] *gern* [m a:Fußball].','Me [v:gusta] jugar [m a:fútbol].'],['Ich [v:trinke] *lieber* [m a:Tee].','[v:Prefiero] tomar [m a:té].'],['*Am liebsten* [v:esse] ich [f a:Pizza].','Lo que más me [v:gusta] comer es [f a:pizza].']]},
{t:'es gibt',x:'«Hay». Siempre va con Akkusativ.',e:[['In [f d:der Stadt] *gibt es* [n a:ein Kino].','En [f d:la ciudad] [v:hay] [n a:un cine].'],['*Gibt es* hier [m a:einen Supermarkt]?','¿[v:Hay] [m a:un supermercado] por aquí?']]},
{t:'man',x:'Sujeto impersonal, equivale al «se» impersonal. El verbo va en 3.ª persona del singular.',e:[['Hier [v:spricht] *man* Deutsch.','Aquí [v:se habla] alemán.'],['Wie [v:sagt] *man* das auf Deutsch?','¿Cómo [v:se dice] eso en alemán?']]},
{t:'am, um, im',x:'am para días y partes del día, um para la hora, im para meses y estaciones.',e:[['[m:Der Kurs] [v:beginnt] [m d:*am* Montag] *um* neun Uhr.','[m:El curso] [v:empieza] [m d:el lunes] a las nueve.'],['[m d:*Im* Sommer] [v:fahren] wir [n a:ans Meer].','[m d:En verano] [v:vamos] [n a:al mar].']]},
{t:'schon, noch, noch nicht',x:'schon = ya; noch = todavía; noch nicht = todavía no; nicht mehr = ya no.',e:[['[v:Bist] du *schon* fertig? – Nein, *noch nicht*.','¿Ya [v:terminaste]? – No, todavía no.'],['Er [v:wohnt] *nicht mehr* hier.','Ya no [v:vive] aquí.']]}

{t:'dass',x:'«Que». Introduce lo que se dice, piensa o sabe. Verbo al final.',e:[['Ich [v:glaube], *dass* [m:der Zug] spät [v:kommt].','[v:Creo] que [m:el tren] [v:llega] tarde.'],['Es [v:ist] schön, *dass* du da [v:bist].','Qué bueno que [v:estés] aquí.']]},

{t:'ob und indirekte Fragen',x:'ob («si») convierte una pregunta de sí/no en indirecta; las preguntas con W conservan la palabra interrogativa. Verbo al final.',e:[['Ich [v:weiß] nicht, *ob* er [v:kommt].','No [v:sé] si [v:viene].'],['[v:Können] Sie mir sagen, *wo* [m:der Bahnhof] [v:ist]?','¿Me [v:puede] decir dónde [v:está] [m:la estación]?']]},
{t:'deshalb, deswegen, darum',x:'«Por eso». Ocupan la posición 1, así que el verbo va justo después y el sujeto detrás.',e:[['Ich [v:bin] müde, *deshalb* [v:gehe] ich [n a:ins Bett].','[v:Estoy] cansada, por eso me [v:voy] [n a:a la cama].']]},
{t:'zuerst, dann, danach, zum Schluss',x:'Adverbios para ordenar acciones; ocupan la posición 1.',e:[['*Zuerst* [v:dusche] ich, *dann* [v:frühstücke] ich.','Primero me [v:ducho], luego [v:desayuno].'],['*Zum Schluss* [v:putze] ich [p a:die Zähne].','Al final me [v:lavo] [p a:los dientes].']]},
{t:'als und wie im Vergleich',x:'Comparativo + als («más… que»); so + adjetivo + wie («tan… como»).',e:[['[m:Mein Bruder] [v:ist] größer *als* ich.','[m:Mi hermano] [v:es] más alto que yo.'],['Sie [v:ist] *so* alt *wie* ich.','Ella [v:tiene] la misma edad que yo.']]},
{t:'Wechselpräpositionen',x:'in, an, auf, über, unter, vor, hinter, neben, zwischen: Dativ si responde a wo (ubicación), Akkusativ si responde a wohin (dirección).',e:[['[n:Das Buch] [v:liegt] *auf* [m d:dem Tisch].','[n:El libro] [v:está] sobre [m d:la mesa].'],['Ich [v:lege] [n a:das Buch] *auf* [m a:den Tisch].','[v:Pongo] [n a:el libro] sobre [m a:la mesa].']]},
{t:'seit, vor, für',x:'seit = desde hace (sigue ocurriendo), vor = hace (ya pasó), ambas con Dativ; für = por/durante un periodo, con Akkusativ.',e:[['Ich [v:lerne] *seit* [n d:einem Jahr] Deutsch.','[v:Estudio] alemán desde hace [n d:un año].'],['Ich [v:war] *vor* [p d:zwei Wochen] in Wien.','[v:Estuve] en Viena hace [p d:dos semanas].'],['Ich [v:fahre] *für* [f a:eine Woche] nach Spanien.','Me [v:voy] [f a:una semana] a España.']]},

{t:'Reflexivpronomen',x:'mich, dich, sich, uns, euch, sich. Acompañan a verbos reflexivos.',e:[['Ich [v:freue] *mich* auf [n a:das Wochenende].','[v:Tengo] ganas de que llegue [n a:el fin de semana].'],['Wir [v:treffen] *uns* um acht.','Nos [v:vemos] a las ocho.']]},
{t:'welcher und dieser',x:'welcher pregunta «cuál», dieser señala «este». Se declinan como el artículo definido.',e:[['*Welcher* [m:Pullover] [v:gefällt] dir? – *Dieser* hier.','¿Qué [m:suéter] te [v:gusta]? – Este de aquí.']]}

{t:'während, bevor, nachdem, bis, seitdem',x:'Conectores temporales subordinantes: mientras, antes de que, después de que, hasta que, desde que.',e:[['*Während* ich [v:koche], [v:hört] sie Musik.','Mientras [v:cocino], ella [v:escucha] música.'],['*Bevor* ich [v:esse], [v:wasche] ich mir [p a:die Hände].','Antes de [v:comer], me [v:lavo] [p a:las manos].'],['*Nachdem* er [v:gegessen] [v:hatte], [v:ging] er.','Después de haber [v:comido], se [v:fue].']]},
{t:'sobald, solange, sooft',x:'sobald = en cuanto; solange = mientras (durante todo el tiempo que); sooft = cada vez que.',e:[['*Sobald* ich zu Hause [v:bin], [v:rufe] ich dich [v:an].','En cuanto [v:llegue] a casa, te [v:llamo].'],['*Solange* du [n a:Fieber] [v:hast], [v:bleibst] du [n d:im Bett].','Mientras [v:tengas] [n a:fiebre], te [v:quedas] [n d:en cama].']]},
{t:'Relativpronomen',see:'rel',x:'der, die, das, den, dem, deren, dessen… El género viene del sustantivo al que se refieren y el caso, de su función en la oración relativa.',e:[['[m:Der Mann], *der* dort [v:steht], [v:ist] mein Chef.','[m:El hombre] que [v:está] ahí [v:es] mi jefe.'],['[f:Die Frau], [f d:*der*] ich [v:helfe], [v:ist] meine Nachbarin.','[f:La mujer] [f d:a la que] [v:ayudo] [v:es] mi vecina.'],['[n:Das Buch], [n a:*das*] ich [v:lese], [v:ist] spannend.','[n:El libro] [n a:que] [v:leo] [v:es] emocionante.']]},
{t:'da(r)- und wo(r)-',see:'rektion',x:'Con verbos que llevan preposición fija: wo(r) + preposición para preguntar por cosas; da(r) + preposición para referirse a algo ya mencionado.',e:[['*Worauf* [v:wartest] du? – Auf [m a:den Bus].','¿Qué [v:esperas]? – [m a:El autobús].'],['Ich [v:warte] schon lange *darauf*.','[v:Llevo] mucho rato esperándolo.'],['*Wofür* [v:interessierst] du dich?','¿Qué te [v:interesa]?']]},
{t:'je … desto / je … umso',see:'kon',x:'«Cuanto más…, más…». je + comparativo con el verbo al final; desto/umso + comparativo y luego verbo y sujeto.',e:[['*Je* mehr ich [v:übe], *desto* besser [v:spreche] ich.','Cuanto más [v:practico], mejor [v:hablo].'],['*Je* älter er [v:wird], *umso* ruhiger [v:wird] er.','Cuanto mayor se [v:hace], más tranquilo [v:está].'],['*Je* früher, *desto* besser.','Cuanto antes, mejor.']]},
{t:'sowohl … als auch, weder … noch',see:'kon',x:'sowohl … als auch = tanto… como; weder … noch = ni… ni (ya es negación, no se añade nicht).',e:[['Sie [v:spricht] *sowohl* Englisch *als auch* Französisch.','[v:Habla] tanto inglés como francés.'],['Ich [v:habe] *weder* [f a:Zeit] *noch* [n a:Geld].','No [v:tengo] ni [f a:tiempo] ni [n a:dinero].']]},
{t:'entweder … oder, nicht nur … sondern auch, zwar … aber',see:'kon',x:'o… o; no solo… sino también; si bien… pero.',e:[['*Entweder* [v:kommst] du mit *oder* du [v:bleibst] hier.','O [v:vienes] o te [v:quedas] aquí.'],['Er [v:ist] *nicht nur* klug, *sondern auch* nett.','No solo [v:es] listo, sino también amable.'],['[f:Die Wohnung] [v:ist] *zwar* klein, *aber* hell.','[f:El departamento] [v:es] pequeño, pero luminoso.']]},
{t:'indem',x:'Indica el modo o medio: «haciendo…», «mediante…». Verbo al final.',e:[['Man [v:lernt] [f a:eine Sprache], *indem* man viel [v:spricht].','[f a:Un idioma] [v:se aprende] hablando mucho.']]},
{t:'ohne … zu und statt … zu',see:'inf',x:'ohne … zu = sin + infinitivo; statt/anstatt … zu = en vez de + infinitivo.',e:[['Er [v:ging], *ohne* sich *zu* [v:verabschieden].','Se [v:fue] sin [v:despedirse].'],['*Statt zu* [v:lernen], [v:sieht] er fern.','En lugar de [v:estudiar], [v:ve] la tele.']]},
{t:'lassen',x:'Hacer que otra persona haga algo, o permitir algo. Va con infinitivo sin zu.',e:[['Ich [v:lasse] [n a:mein Auto] [v:reparieren].','[v:Mando] a reparar [n a:mi coche].'],['[v:Lass] mich in Ruhe!','¡[v:Déjame] en paz!']]},
{t:'nicht brauchen … zu',x:'Equivale a «no tener que»: nicht/nur brauchen + zu + infinitivo.',e:[['Du [v:brauchst] *nicht zu* [v:kommen].','No hace falta que [v:vengas].'],['Sie [v:brauchen] *nur* hier *zu* [v:unterschreiben].','Solo [v:tiene] que [v:firmar] aquí.']]}
],
B2:[
{t:'falls und sofern',x:'Condiciones más precisas que wenn: falls = en caso de que; sofern = siempre que.',e:[['*Falls* du Zeit [v:hast], [v:ruf] mich an.','En caso de que [v:tengas] tiempo, [v:llámame].'],['*Sofern* nichts [v:dazwischenkommt], [v:sind] wir um acht da.','Siempre que no [v:surja] nada, [v:estamos] ahí a las ocho.']]},
{t:'sodass und so … dass',x:'Consecuencia. so + adjetivo/adverbio en la principal y dass en la subordinada.',e:[['Es [v:regnete] stark, *sodass* wir zu Hause [v:blieben].','[v:Llovía] fuerte, así que nos [v:quedamos] en casa.'],['Er [v:war] *so* müde, *dass* er sofort [v:einschlief].','[v:Estaba] tan cansado que se [v:durmió] enseguida.']]},
{t:'als ob, als wenn',see:'konj',x:'«Como si». Suele ir con Konjunktiv II.',e:[['Er [v:tut], *als ob* er nichts [v:wüsste].','[v:Hace] como si no [v:supiera] nada.']]},
{t:'ohne dass und anstatt dass',x:'Versiones de ohne … zu y statt … zu cuando los sujetos son distintos.',e:[['Er [v:half] mir, *ohne dass* ich ihn [v:fragen] [v:musste].','Me [v:ayudó] sin que [v:tuviera] que pedírselo.'],['*Anstatt dass* er [v:hilft], [v:schaut] er nur zu.','En vez de [v:ayudar], solo [v:mira].']]},
{t:'je nachdem',x:'«Según», «dependiendo de». Va seguido de ob o de una palabra interrogativa.',e:[['*Je nachdem*, wie [n:das Wetter] [v:ist], [v:fahren] wir [n a:ans Meer] oder in [p a:die Berge].','Según cómo [v:esté] [n:el tiempo], [v:vamos] [n a:al mar] o [p a:a la montaña].']]},
{t:'einerseits … andererseits',x:'Contrapone dos aspectos: por un lado… por otro.',e:[['*Einerseits* [v:ist] [f:die Stadt] laut, *andererseits* [v:gibt] es viel Kultur.','Por un lado [f:la ciudad] [v:es] ruidosa; por otro, [v:hay] mucha cultura.']]},
{t:'Präpositionen mit Genitiv',see:'gen',link:true},
{t:'Modalpartikeln',x:'doch, mal, ja, eben, halt, eigentlich, wohl: no cambian el contenido, sino el tono (suavizan, enfatizan, muestran sorpresa o resignación).',e:[['[v:Komm] *doch mal* vorbei!','¡[v:Pásate] cuando quieras!'],['Das [v:ist] *ja* toll!','¡Pero qué bien!'],['Das [v:ist] *halt* so.','Pues así [v:es].'],['Was [v:machst] du *eigentlich* hier?','¿Y tú qué [v:haces] aquí, a todo esto?']]},
{t:'es als Platzhalter',x:'es ocupa la posición 1 o anticipa una oración que viene después (dass, zu + infinitivo).',e:[['*Es* [v:freut] mich, dass du [v:kommst].','Me [v:alegra] que [v:vengas].'],['*Es* [v:kamen] viele Leute.','[v:Vinieron] muchas personas.']]},
{t:'darauf … zu / darüber, dass',see:'rektion',x:'El pronombre adverbial anticipa una oración subordinada o de infinitivo con verbos de preposición fija.',e:[['Ich [v:freue] mich *darauf*, dich *zu* [v:sehen].','[v:Tengo] muchas ganas de [v:verte].'],['Er [v:ärgert] sich *darüber*, *dass* [m:der Zug] spät [v:ist].','Le [v:molesta] que [m:el tren] [v:vaya] con retraso.']]},
{t:'beim, zum, vom + Infinitiv',x:'Nominalización del verbo: beim = al/mientras; zum = para; vom = de/por.',e:[['[n d:*Beim* Autofahren] [v:soll] man nicht [v:telefonieren].','[n d:Al manejar] no se [v:debe] hablar por teléfono.'],['Ich [v:brauche] [n a:ein Messer] [n d:*zum* Schneiden].','[v:Necesito] [n a:un cuchillo] [n d:para cortar].'],['Ich [v:bin] müde [n d:*vom* Laufen].','[v:Estoy] cansada [n d:de correr].']]}
],
C1:[
{t:'es sei denn',x:'«A menos que». Introduce la única excepción; después va orden normal o subordinada con dass.',e:[['Wir [v:gehen] wandern, *es sei denn*, es [v:regnet].','[v:Vamos] de excursión, a menos que [v:llueva].']]},
{t:'zumal',x:'«Sobre todo porque», «más aún cuando». Añade una razón de peso.',e:[['Ich [v:nehme] [m a:den Job] nicht, *zumal* [n:das Gehalt] niedrig [v:ist].','No [v:acepto] [m a:el trabajo], sobre todo porque [n:el sueldo] [v:es] bajo.']]},
{t:'wohingegen',x:'Contraste entre dos hechos, más formal que während.',e:[['Er [v:liebt] [f a:die Stadt], *wohingegen* sie [n a:das Land] [v:bevorzugt].','Él [v:ama] [f a:la ciudad], mientras que ella [v:prefiere] [n a:el campo].']]},
{t:'wenngleich, obgleich, obschon',x:'Variantes formales de obwohl. Verbo al final.',e:[['*Wenngleich* [f:die Aufgabe] schwer [v:war], [v:gab] er nicht [v:auf].','Aunque [f:la tarea] [v:era] difícil, no se [v:rindió].']]},
{t:'insofern … als',x:'«En la medida en que», «en el sentido de que». Limita el alcance de una afirmación.',e:[['[f:Die Lösung] [v:ist] *insofern* gut, *als* sie wenig [v:kostet].','[f:La solución] [v:es] buena en la medida en que [v:cuesta] poco.']]},
{t:'dadurch, dass',x:'Expresa el medio o la causa, como indem, pero con más peso en el resultado.',e:[['*Dadurch, dass* er täglich [v:übte], [v:verbesserte] er sich schnell.','Al [v:practicar] a diario, [v:mejoró] rápido.']]},
{t:'kaum dass',x:'«Apenas», «nada más». Una acción sigue inmediatamente a la otra.',e:[['*Kaum dass* er zu Hause [v:war], [v:klingelte] [n:das Telefon].','Apenas [v:llegó] a casa, [v:sonó] [n:el teléfono].']]},
{t:'geschweige denn',x:'«Y mucho menos». Va después de una negación.',e:[['Er [v:kann] kaum [v:laufen], *geschweige denn* [v:rennen].','Apenas [v:puede] [v:caminar], y mucho menos [v:correr].']]},
{t:'angesichts, infolge, hinsichtlich, bezüglich',see:'gen',x:'Preposiciones con Genitivo del registro escrito: ante, a consecuencia de, en lo que respecta a.',e:[['*Angesichts* [f g:der Lage] [v:müssen] wir [v:handeln].','Ante [f g:la situación], [v:tenemos] que actuar.'],['*Infolge* [m g:des Unfalls] [v:war] [f:die Straße] gesperrt.','A raíz [m g:del accidente], [f:la calle] [v:estaba] cerrada.'],['*Hinsichtlich* [p g:der Kosten] [v:gibt] es noch Fragen.','En cuanto a [p g:los costos], todavía [v:hay] dudas.']]},

{t:'Erweitertes Partizipialattribut',see:'part',x:'Un participio con complementos se coloca entre el artículo y el sustantivo, en lugar de una oración relativa.',e:[['[f:die *seit Jahren* steigende Nachfrage]','[f:la demanda que lleva años subiendo]'],['[n:das *von der Firma* entwickelte Produkt]','[n:el producto desarrollado por la empresa]']]},
{t:'sein + zu, sich lassen, -bar',see:'passiv',x:'Alternativas a la voz pasiva que además expresan posibilidad u obligación.',e:[['[f:Die Aufgabe] [v:ist] leicht *zu* [v:lösen].','[f:La tarea] se [v:puede] resolver fácilmente.'],['[n:Das Problem] [v:lässt] *sich* [v:lösen].','[n:El problema] [v:tiene] solución.'],['[n:Das Problem] [v:ist] lös*bar*.','[n:El problema] [v:es] solucionable.']]}

{t:'Konditionalsatz ohne wenn',x:'El verbo pasa a la posición 1 y desaparece wenn; la principal puede empezar con so o dann.',e:[['[v:Regnet] es morgen, *so* [v:bleiben] wir zu Hause.','Si [v:llueve] mañana, nos [v:quedamos] en casa.'],['[v:Sollte] es Probleme [v:geben], [v:melden] Sie sich.','Si [v:hubiera] algún problema, [v:avísenos].']]},
{t:'gleichwohl, nichtsdestotrotz',x:'«No obstante», «sin embargo». Adverbios de posición 1, muy usados en textos argumentativos.',e:[['[f:Die Kritik] [v:war] hart; *gleichwohl* [v:blieb] er gelassen.','[f:La crítica] [v:fue] dura; no obstante, [v:mantuvo] la calma.'],['*Nichtsdestotrotz* [v:halten] wir an [m d:dem Plan] fest.','Aun así, [v:mantenemos] [m d:el plan].']]},

const $=s=>document.querySelector(s);
const view=$('#view'), rail=$('#rail');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null}}

/* voz */
let voice=null;
function pickVoice(){try{voice=speechSynthesis.getVoices().find(x=>/^de/i.test(x.lang))||null;}catch(e){}}
try{pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function say(t){try{speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='de-DE'; if(voice)u.voice=voice; u.rate=.88; speechSynthesis.speak(u);}catch(e){}}
const plain=s=>s.replace(/\[[vmfnp](?: [adg])?:([^\]]+)\]/g,'$1').replace(/\*/g,'');
const sayBtn=t=>`<button class="say" type="button" aria-label="Escuchar" data-say="${plain(t).replace(/"/g,'&quot;')}">🔊</button>`;
view.addEventListener('click',e=>{const b=e.target.closest('.say'); if(b) say(b.dataset.say);});

/* aprendidas */
let learned; try{learned=new Set(JSON.parse(store('dl-learned')||'[]'));}catch(e){learned=new Set();}
const saveLearned=()=>store('dl-learned',JSON.stringify([...learned]));

LESSONS.forEach(l=>{
  const b=document.createElement('button');
  b.className='pill'; b.textContent=l.name; b.dataset.id=l.id;
  b.onclick=()=>go(l.id);
  rail.appendChild(b);
});

function fmt(s){
  return s.replace(/\[([vmfnp](?: [adg])?):([^\]]+)\]/g,(_,c,t)=>`<mark class="${c}">${t}</mark>`)
          .replace(/\*([^*]+)\*/g,'<b class="k">$1</b>');
}

function go(id,anchor){
  const l=LESSONS.find(x=>x.id===id)||LESSONS[0];
  store('dl-view',l.id);
  [...rail.children].forEach(b=>b.setAttribute('aria-current',b.dataset.id===l.id));
  const cur=rail.querySelector('[aria-current="true"]'); if(cur) cur.scrollIntoView({block:'nearest',inline:'nearest'});
  try{speechSynthesis.cancel();}catch(e){}
  if(l.id==='grammatik') renderGrammar();
  else if(l.id==='tabelle') renderTable();
  else renderFrame(l,anchor);
  window.scrollTo({top:0});
}

function renderFrame(l,anchor){
  view.innerHTML=`<h1 class="lesson">${l.name}</h1><div class="sheet frame glass"></div>`;
  const f=document.createElement('iframe');
  f.title=l.name; f.srcdoc=SRC[l.id].replace('</head>',INJECT_CSS+'</head>');
  if(anchor) f.addEventListener('load',()=>{
    try{ const t=f.contentDocument.getElementById(anchor); if(t) t.scrollIntoView({behavior:reduce?'auto':'smooth'}); }catch(e){}
    const top=view.querySelector('.sheet').getBoundingClientRect().top+scrollY-80;
    window.scrollTo({top,behavior:reduce?'auto':'smooth'});
  },{once:true});
  view.querySelector('.sheet').appendChild(f);
}

function renderTable(){
  view.innerHTML=`<h1 class="lesson">Die Tabelle: Die Zeitformen</h1>
  <div class="tbl glass"><table><thead><tr><th>Zeitform</th><th>Bildung</th><th>Beispiel</th></tr></thead><tbody>${ZT.map(z=>`<tr><td><span class="zf" style="--c:${z.c}">${z.n}</span><small>${z.es}</small></td><td class="bild">${z.b}</td><td><span class="de">${fmt(z.d)}${sayBtn(z.d)}</span><span class="es">${fmt(z.s)}</span></td></tr>`).join('')}</tbody></table></div>`;
}

/* gramática por niveles */
const LV=['A1','A2','B1','B2','C1','C2'];
function keysOf(de){ // claves *…* que no son sufijos
  const out=[]; const re=/(.)?\*([^*]+)\*/g; let m;
  while((m=re.exec(de))){ if(m[1] && /[a-zäöüß]/i.test(m[1])) return null; out.push(m[2]); }
  return out.length?out:null;
}
function buildPool(lv){
  const pool=[];
  G[lv].forEach(it=>(it.e||[]).forEach(e=>{const k=keysOf(e[0]); if(k) pool.push({de:e[0],es:e[1],keys:k,ans:k.join(' … ')});}));
  return pool;
}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const lowFirst=s=>s.charAt(0).toLowerCase()+s.slice(1), upFirst=s=>s.charAt(0).toUpperCase()+s.slice(1);

function renderGrammar(){
  let lv=store('dl-level'); if(!LV.includes(lv)) lv='A1';
  view.innerHTML=`<h1 class="lesson">Grammatik A1–C2</h1>
  <div class="levels glass" role="tablist">${LV.map(x=>`<button class="lv" role="tab" data-lv="${x}">${x}</button>`).join('')}</div>
  <div class="keyrow">
    <i><b style="background:var(--verb)"></b>Verbo</i><i><b style="background:var(--mas)"></b>Masculino</i><i><b style="background:var(--fem)"></b>Femenino</i><i><b style="background:var(--neu)"></b>Neutro</i><i><b style="background:var(--pl)"></b>Plural</i>
    <i><b class="u" style="border-color:var(--akk-line)"></b>Akkusativ</i><i><b class="u" style="border-color:var(--dat-line)"></b>Dativ</i><i><b class="u" style="border-color:var(--gen-line)"></b>Genitiv</i>
  </div>
  <div id="lvbody"></div>`;
  const tabs=[...view.querySelectorAll('.lv')];
  tabs.forEach((t,i)=>{
    t.onclick=()=>show(t.dataset.lv);
    t.onkeydown=e=>{const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0; if(d){const j=(i+d+tabs.length)%tabs.length; show(LV[j]); tabs[j].focus();}};
  });
  function show(x){
    store('dl-level',x);
    tabs.forEach(t=>{const on=t.dataset.lv===x; t.setAttribute('aria-selected',on); t.tabIndex=on?0:-1;});
    const items=G[x];
    const count=()=>items.filter(it=>learned.has(x+':'+it.t)).length;
    const see=it=>it.see?`<button class="seelink" type="button" data-see="${it.see}">Grammatik B2 · ${SEE[it.see]}</button>`:'';
    $('#lvbody').innerHTML=`<div class="lvhead"><h2>${x}</h2><span id="lvcount"></span></div>
    <div class="list">${items.map((it,i)=>{const id=x+':'+it.t, on=learned.has(id);
      return `<details class="glass"><summary>${it.t}<span class="done">${on?'✓':''}</span></summary><div class="body">
      ${it.link?'':`<p class="x">${fmt(it.x)}</p>${it.e.map(e=>`<div class="ex"><span class="de"><span class="lg">DE</span>${fmt(e[0])}${sayBtn(e[0])}</span><span class="es"><span class="lg">ES</span>${fmt(e[1])}</span></div>`).join('')}`}
      <div class="acts"><button class="gbtn" type="button" data-learn="${i}" aria-pressed="${on}">${on?'Aprendida':'Marcar como aprendida'}</button>${see(it)}</div>
      </div></details>`;}).join('')}</div>
    <section class="pract glass" aria-live="polite"><h3>Übung ${x}</h3><p class="score" id="sc"></p><div id="pq"></div></section>`;
    const upd=()=>{$('#lvcount').textContent=`${count()} de ${items.length} aprendidas`;};
    upd();
    $('#lvbody').querySelectorAll('[data-learn]').forEach(b=>b.onclick=()=>{
      const it=items[+b.dataset.learn], id=x+':'+it.t;
      if(learned.has(id)) learned.delete(id); else learned.add(id);
      saveLearned(); const on=learned.has(id);
      b.setAttribute('aria-pressed',on); b.textContent=on?'Aprendida':'Marcar como aprendida';
      b.closest('details').querySelector('.done').textContent=on?'✓':''; upd();
    });
    $('#lvbody').querySelectorAll('[data-see]').forEach(b=>b.onclick=()=>go('b2',b.dataset.see));
    practice(x);
  }
  show(lv);
}

function practice(x){
  const pool=buildPool(x); let ok=0,tot=0,last=-1;
  const sc=()=>{$('#sc').textContent=`${ok} de ${tot} correctas`;};
  function next(){
    let i; do{i=Math.floor(Math.random()*pool.length);}while(pool.length>1&&i===last); last=i;
    const q=pool[i];
    const same=pool.filter(p=>p.ans.toLowerCase()!==q.ans.toLowerCase()&&p.keys.length===q.keys.length);
    const other=pool.filter(p=>p.ans.toLowerCase()!==q.ans.toLowerCase()&&p.keys.length!==q.keys.length);
    const seen=new Set([q.ans.toLowerCase()]), dis=[];
    for(const p of shuffle(same).concat(shuffle(other))){ const k=p.ans.toLowerCase(); if(!seen.has(k)){seen.add(k); dis.push(p.ans);} if(dis.length===3) break; }
    const cap=/^\*/.test(q.de.replace(/^\[[^:]+:/,''))&&/^[A-ZÄÖÜ]/.test(q.keys[0]);
    const norm=s=>cap?upFirst(s):lowFirst(s);
    const opts=shuffle([q.ans,...dis]).map(o=>({t:norm(o),r:o===q.ans}));
    const gapped=fmt(q.de).replace(/<b class="k">[^<]*<\/b>/g,'<span class="gap">___</span>');
    $('#pq').innerHTML=`<p class="q">${gapped}</p><p class="hint">${fmt(q.es)}</p>
      <div class="opts">${opts.map((o,j)=>`<button class="opt" type="button" data-j="${j}">${o.t}</button>`).join('')}</div>
      <p class="fb" id="fb"></p><div class="acts"><button class="gbtn" type="button" id="nx" hidden>Siguiente</button><button class="gbtn" type="button" id="rs">Reiniciar</button></div>`;
    $('#pq').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j; tot++; if(opts[j].r) ok++; sc();
      $('#pq').querySelectorAll('.opt').forEach((c,k)=>{c.disabled=true; if(opts[k].r) c.classList.add('ok'); else if(k===j) c.classList.add('no');});
      $('#pq .q').innerHTML=fmt(q.de)+sayBtn(q.de);
      $('#fb').textContent=opts[j].r?'Correcto.':'La respuesta correcta está marcada en verde.';
      $('#nx').hidden=false; $('#nx').focus();
    });
    $('#nx').onclick=next;
    $('#rs').onclick=()=>{ok=0;tot=0;sc();next();};
  }
  sc(); next();
}

go(store('dl-view')||'grammatik');

</script>
