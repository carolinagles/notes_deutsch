<style>
:root{
  color-scheme:light dark;
  --bg:#FBFAFD; --ink:#2C2A36; --muted:#6D6A7C; --hl-ink:#2A2733;
  --verb:#BFE3F8; --fem:#F9CADF; --mas:#CBEBC6; --neu:#DCCBF2; --pl:#FDD8B5;
  --dat-line:#6E86BC; --akk-line:#E07B78; --gen-line:#C4A240;
  --title:#5467A8; --title2:#8A63B8; --title3:#D0605C;
  --gl-b:rgba(70,60,120,.16); --gl-h:rgba(255,255,255,.95); --gl-s:rgba(60,50,110,.07); --gl-lo:rgba(70,60,120,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1D1C24; --ink:#ECEAF3; --muted:#A8A5B8;
    --title:#A8B9F0; --title2:#C9A9F0; --title3:#F2A19D;
    --gl-b:rgba(255,255,255,.13); --gl-h:rgba(255,255,255,.16); --gl-s:rgba(0,0,0,.28); --gl-lo:rgba(0,0,0,.2); }
}
:root[data-theme="dark"]{ --bg:#1D1C24; --ink:#ECEAF3; --muted:#A8A5B8; --title:#A8B9F0; --title2:#C9A9F0; --title3:#F2A19D;
  --gl-b:rgba(255,255,255,.13); --gl-h:rgba(255,255,255,.16); --gl-s:rgba(0,0,0,.28); --gl-lo:rgba(0,0,0,.2); }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 5rem); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif; font-weight:300; line-height:1.55; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; backdrop-filter:blur(20px) saturate(1.6); -webkit-backdrop-filter:blur(20px) saturate(1.6); }

/* liquid glass: sin relleno, solo bordes, brillo y desenfoque */
.glass{ background:transparent; border:1px solid var(--gl-b);
  box-shadow:inset 0 1px 0 var(--gl-h), inset 0 -1px 0 var(--gl-lo), 0 10px 34px var(--gl-s);
  backdrop-filter:blur(22px) saturate(1.7); -webkit-backdrop-filter:blur(22px) saturate(1.7); }

.wrap{ max-width:1040px; margin:0 auto; padding:0 1.25rem; }
header.hero{ padding:2.6rem 0 1.2rem; }
.word{ font-family:"Literata",Georgia,serif; font-weight:600; font-size:clamp(3rem,10vw,6.2rem); line-height:.95; letter-spacing:-.02em; margin:0;
  background:linear-gradient(100deg,var(--title) 0%,var(--title2) 52%,var(--title3) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }

nav.bar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; margin:0 -.4rem; padding:.55rem 0; }
nav.bar .rail{ display:flex; gap:.35rem; overflow-x:auto; padding:.4rem; border-radius:999px; scrollbar-width:none; }
nav.bar .rail::-webkit-scrollbar{ display:none; }
.pill{ flex:none; font:inherit; font-size:.92rem; font-weight:400; color:var(--muted); background:transparent; border:1px solid transparent; border-radius:999px; padding:.45rem 1rem; cursor:pointer; white-space:nowrap; transition:color .2s, border-color .2s, box-shadow .2s; }
.pill:hover{ color:var(--ink); }
.pill[aria-current="true"]{ color:var(--title); font-weight:600; border-color:var(--gl-b); box-shadow:inset 0 1px 0 var(--gl-h), 0 4px 14px var(--gl-s); }
.pill:focus-visible,.lv:focus-visible,summary:focus-visible{ outline:2px solid var(--title); outline-offset:2px; }

main{ padding:1.4rem 0 4rem; }
h1.lesson{ font-family:"Literata",Georgia,serif; font-weight:600; font-size:clamp(1.9rem,4.6vw,2.8rem); line-height:1.1; margin:.4rem 0 1.2rem; color:var(--title); letter-spacing:-.01em; }
.sheet{ border-radius:26px; padding:1.4rem 1.4rem .6rem; }
.sheet iframe{ display:block; width:100%; border:0; min-height:60vh; background:transparent; color-scheme:light dark; }

/* gramática por niveles */
.levels{ display:flex; gap:.4rem; padding:.4rem; border-radius:999px; width:max-content; max-width:100%; overflow-x:auto; margin-bottom:1.6rem; }
.lv{ font:inherit; font-family:"Literata",Georgia,serif; font-weight:600; font-size:1.05rem; color:var(--muted); background:transparent; border:1px solid transparent; border-radius:999px; padding:.4rem 1.1rem; cursor:pointer; }
.lv[aria-selected="true"]{ color:var(--title); border-color:var(--gl-b); box-shadow:inset 0 1px 0 var(--gl-h), 0 4px 14px var(--gl-s); }
.lvhead{ display:flex; align-items:baseline; gap:1rem; margin:0 0 1rem; }
.lvhead h2{ font-family:"Literata",Georgia,serif; font-weight:600; font-size:clamp(2.6rem,7vw,4rem); line-height:1; margin:0; color:var(--title); }
.lvhead span{ color:var(--muted); font-size:.95rem; }
.keyrow{ display:flex; flex-wrap:wrap; gap:.4rem .9rem; font-size:.85rem; color:var(--muted); margin:0 0 1.4rem; }
.keyrow i{ font-style:normal; display:inline-flex; align-items:center; gap:.35rem; }
.keyrow b{ display:inline-block; width:1.5rem; height:.95rem; border-radius:4px; }
.keyrow b.u{ height:.7rem; border-radius:0; border-bottom:3px solid; background:none; }

.list{ display:grid; gap:.7rem; }
details{ border-radius:20px; }
summary{ list-style:none; cursor:pointer; padding:1rem 1.25rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; font-family:"Literata",Georgia,serif; font-weight:600; font-size:1.12rem; color:var(--title); border-radius:20px; }
summary::-webkit-details-marker{ display:none; }
summary::after{ content:""; flex:none; width:.55rem; height:.55rem; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(45deg) translateY(-2px); transition:transform .25s; }
details[open] summary::after{ transform:rotate(225deg) translateY(-2px); }
.body{ padding:0 1.25rem 1.2rem; }
.body p.x{ margin:0 0 .9rem; max-width:68ch; }
.ex{ border-top:1px solid var(--gl-b); padding:.7rem 0 .2rem; }
.ex .de{ display:block; font-size:1.06rem; font-weight:400; }
.ex .es{ display:block; color:var(--muted); font-size:.93rem; }
.lg{ display:inline-block; width:1.9rem; font-size:.72rem; font-weight:600; color:var(--muted); }

mark{ background:none; color:inherit; padding:.05em .28em; border-radius:5px; }
mark.v,mark.f,mark.m,mark.n,mark.p{ color:var(--hl-ink); }
mark.v{ background:var(--verb); font-weight:600; }
mark.f{ background:var(--fem); } mark.m{ background:var(--mas); } mark.n{ background:var(--neu); } mark.p{ background:var(--pl); }
mark.d{ box-shadow:inset 0 -3px 0 var(--dat-line); }
mark.a{ box-shadow:inset 0 -3px 0 var(--akk-line); }
mark.g{ box-shadow:inset 0 -3px 0 var(--gen-line); }
b.k{ font-weight:700; text-decoration:underline; text-decoration-thickness:1.5px; text-underline-offset:3px; }


/* tabla de tiempos */
.tbl{ border-radius:22px; overflow-x:auto; }
.tbl table{ border-collapse:collapse; width:100%; min-width:680px; }
.tbl th,.tbl td{ padding:.85rem 1.1rem; text-align:left; vertical-align:top; border-bottom:1px solid var(--gl-b); }
.tbl tr:last-child td{ border-bottom:none; }
.tbl th{ font-weight:600; font-size:.85rem; color:var(--muted); }
.zf{ display:inline-block; color:var(--hl-ink); background:var(--c); padding:.2rem .8rem; border-radius:999px; font-weight:600; font-size:.93rem; white-space:nowrap; }
.zf + small{ display:block; color:var(--muted); font-size:.8rem; margin:.3rem 0 0 .2rem; }
.bild{ font-size:.93rem; }
.tbl .de{ display:block; font-weight:400; }
.tbl .es{ display:block; color:var(--muted); font-size:.9rem; }

/* marco de lecciones con scroll propio */
.sheet.frame{ padding:0; overflow:hidden; }
.sheet.frame iframe{ height:calc(100dvh - 9.5rem - env(safe-area-inset-top,0px)); min-height:420px; }

/* botones de vidrio pequeños */
.gbtn{ font:inherit; font-size:.88rem; font-weight:400; color:var(--ink); background:transparent; border:1px solid var(--gl-b); border-radius:999px; padding:.4rem .95rem; cursor:pointer;
  box-shadow:inset 0 1px 0 var(--gl-h), 0 4px 14px var(--gl-s); }
.gbtn:hover{ border-color:var(--title); }
.gbtn:focus-visible,.say:focus-visible,.opt:focus-visible{ outline:2px solid var(--title); outline-offset:2px; }
.gbtn[aria-pressed="true"]{ color:var(--title); font-weight:600; border-color:var(--title); }
.say{ background:transparent; border:none; cursor:pointer; font-size:1rem; padding:0 .3rem; opacity:.65; vertical-align:middle; }
.say:hover{ opacity:1; }
.acts{ display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin-top:1rem; }
.seelink{ color:var(--title); text-decoration:underline; text-underline-offset:3px; background:none; border:none; font:inherit; font-size:.9rem; cursor:pointer; padding:0; }
summary .done{ font-family:"Lexend",sans-serif; font-weight:400; font-size:.82rem; color:var(--title); margin-left:auto; }
summary .done:empty{ display:none; }

/* práctica */
.pract{ border-radius:24px; padding:1.3rem 1.4rem 1.4rem; margin-top:2.2rem; }
.pract h3{ font-family:"Literata",Georgia,serif; font-weight:600; font-size:1.5rem; color:var(--title); margin:0 0 .2rem; }
.pract .score{ color:var(--muted); font-size:.88rem; margin:0 0 1rem; }
.pract .q{ font-size:1.15rem; font-weight:400; margin:.2rem 0 .2rem; }
.pract .hint{ color:var(--muted); font-size:.93rem; margin:0 0 1rem; }
.gap{ display:inline-block; min-width:3.5em; border-bottom:2px solid var(--title); text-align:center; color:var(--title); font-weight:600; }
.opts{ display:flex; flex-wrap:wrap; gap:.5rem; }
.opt{ font:inherit; font-size:.98rem; color:var(--ink); background:transparent; border:1px solid var(--gl-b); border-radius:14px; padding:.55rem 1.05rem; cursor:pointer; box-shadow:inset 0 1px 0 var(--gl-h), 0 4px 14px var(--gl-s); }
.opt:disabled{ cursor:default; }
.opt.ok{ border-color:#5FA873; box-shadow:0 0 0 2px var(--mas); font-weight:600; }
.opt.no{ border-color:var(--akk-line); box-shadow:0 0 0 2px #F7B7B4; }
.fb{ margin:.9rem 0 0; min-height:1.4em; }

@media (max-width:600px){ .sheet{ padding:1rem .8rem .4rem; border-radius:20px; } header.hero{ padding-top:1.6rem; } }
@media (prefers-reduced-motion:reduce){ *{ transition:none!important; } }
</style>

lofone\u003c/mark>\u003c/p>\n  \u003cp class=\"es\">xilófono\u003c/p>\n\u003c/article>\n\u003carticle class=\"lt\">\n  \u003cdiv class=\"top\">\u003cspan class=\"glyph\">Y y\u003c/span>\u003cbutton class=\"say\" data-say=\"y\" aria-label=\"Escuchar y\">🔊\u003c/button>\u003c/div>\n  \u003cp class=\"pron\">«üpsilon \u003csmall>(al inicio suena «y»: Yacht = «yajt»)\u003c/small>»\u003c/p>\n  \u003cp class=\"word\">\u003cbutton class=\"say sm\" data-say=\"die Yacht\" aria-label=\"Escuchar\">🔊\u003c/button>\u003cmark class=\"f\">die \u003cb>Y\u003c/b>acht\u003c/mark>\u003c/p>\n  \u003cp class=\"pl\">\u003cmark class=\"p\">die Yachten\u003c/mark>\u003c/p>\n  \u003cp class=\"es\">yate\u003c/p>\n\u003c/article>\n\u003carticle class=\"lt\">\n  \u003cdiv class=\"top\">\u003cspan class=\"glyph\">Z z\u003c/span>\u003cbutton class=\"say\" data-say=\"z\" aria-label=\"Escuchar z\">🔊\u003c/button>\u003c/div>\n  \u003cp class=\"pron\">«tset \u003csmall>(suena «ts»)\u003c/small>»\u003c/p>\n  \u003cp class=\"word\">\u003cbutton class=\"say sm\" data-say=\"der Zug\" aria-label=\"Escuchar\">🔊\u003c/button>\u003cmark class=\"m\">der \u003cb>Z\u003c/b>ug\u003c/mark>\u003c/p>\n  \u003cp class=\"pl\">\u003cmark class=\"p\">die Züge\u003c/mark>\u003c/p>\n  \u003cp class=\"es\">tren\u003c/p>\n\u003c/article>\n\u003c/div>\n\n\u003ch2>Umlaute y Eszett\u003c/h2>\n\u003cp class=\"note\">No cuentan como letras aparte en el abecedario, pero son esenciales. Si tu teclado no las tiene: ä = ae, ö = oe, ü = ue, ß = ss.\u003c/p>\n\u003cdiv class=\"grid\">\n\u003carticle class=\"lt\">\n  \u003cdiv class=\"top\">\u003cspan class=\"glyph\">Ä ä\u003c/span>\u003cbutton class=\"say\" data-say=\"ä\" aria-label=\"Escuchar ä\">🔊\u003c/button>\u003c/div>\n  \u003cp class=\"pron\">«e abierta»\u003c/p>\n  \u003cp class=\"word\">\u003cbutton class=\"say sm\" data-say=\"der Bär\" aria-label=\"Escuchar\">🔊\u003c/button>\u003cmark class=\"m\">der \u003cb>B\u003c/b>är\u003c/mark>\u003c/p>\n  \u003cp class=\"pl\">\u003cmark class=\"p\">die Bären\u003c/mark>\u003c/p>\n  \u003cp class=\"es\">oso\u003c/p>\n\u003c/article>\n\u003carticle class=\"lt\">\n  \u003cdiv class=\"top\">\u003cspan class=\"glyph\">Ö ö\u003c/span>\u003cbutton class=\"say\" data-say=\"ö\" aria-label=\"Escuchar ö\">🔊\u003c/button>\u003c/div>\n  \u003cp class=\"pron\">«di «e» con labios de «o»»\u003c/p>\n  \u003cp class=\"word\">\u003cbutton class=\"say sm\" data-say=\"das Öl\" aria-label=\"Escuchar\">🔊\u003c/button>\u003cmark class=\"n\">das \u003cb>Ö\u003c/b>l\u003c/mark>\u003c/p>\n  \u003cp class=\"pl\">\u003cmark class=\"p\">die Öle\u003c/mark>\u003c/p>\n  \u003cp class=\"es\">aceite\u003c/p>\n\u003c/article>\n\u003carticle class=\"lt\">\n  \u003cdiv class=\"top\">\u003cspan class=\"glyph\">Ü ü\u003c/span>\u003cbutton class=\"say\" data-say=\"ü\" aria-label=\"Escuchar ü\">🔊\u003c/button>\u003c/div>\n  \u003cp class=\"pron\">«di «i» con labios de «u»»\u003c/p>\n  \u003cp class=\"word\">\u003cbutton class=\"say sm\" data-say=\"die Tür\" aria-label=\"Escuchar\">🔊\u003c/button>\u003cmark class=\"f\">die \u003cb>T\u003c/b>ür\u003c/mark>\u003c/p>\n  \u003cp class=\"pl\">\u003cmark class=\"p\">die Türen\u003c/mark>\u003c/p>\n  \u003cp class=\"es\">puerta\u003c/p>\n\u003c/article>\n\u003carticle class=\"lt\">\n  \u003cdiv class=\"top\">\u003cspan class=\"glyph\">ß\u003c/span>\u003cbutton class=\"say\" data-say=\"ß\" aria-label=\"Escuchar ß\">🔊\u003c/button>\u003c/div>\n  \u003cp class=\"pron\">«es-tset \u003csmall>(= ss)\u003c/small>»\u003c/p>\n  \u003cp class=\"word\">\u003cbutton class=\"say sm\" data-say=\"die Straße\" aria-label=\"Escuchar\">🔊\u003c/button>\u003cmark class=\"f\">die \u003cb>S\u003c/b>traße\u003c/mark>\u003c/p>\n  \u003cp class=\"pl\">\u003cmark class=\"p\">die Straßen\u003c/mark>\u003c/p>\n  \u003cp class=\"es\">calle\u003c/p>\n\u003c/article>\n\u003c/div>\n\n\u003ch2>Combinaciones que suenan distinto\u003c/h2>\n\u003cp class=\"note\">Aquí está la mayor diferencia con el español: estas letras juntas no se leen como se escriben.\u003c/p>\n\u003cdiv class=\"scroll\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Se escribe\u003c/th>\u003cth>Suena como\u003c/th>\u003cth>Ejemplos\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"big\">ei\u003c/td>\u003ctd>«ai»\u003c/td>\u003ctd class=\"de\">mein, Eis \u003cbutton class=\"say sm\" data-say=\"mein, Eis\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">ie\u003c/td>\u003ctd>«i larga»\u003c/td>\u003ctd class=\"de\">Liebe, vier \u003cbutton class=\"say sm\" data-say=\"Liebe, vier\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">eu / äu\u003c/td>\u003ctd>«oi»\u003c/td>\u003ctd class=\"de\">neu, Häuser \u003cbutton class=\"say sm\" data-say=\"neu, Häuser\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">sch\u003c/td>\u003ctd>«sh»\u003c/td>\u003ctd class=\"de\">Schule, Fisch \u003cbutton class=\"say sm\" data-say=\"Schule, Fisch\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">ch (tras a, o, u, au)\u003c/td>\u003ctd>«j mexicana»\u003c/td>\u003ctd class=\"de\">Bach, Buch \u003cbutton class=\"say sm\" data-say=\"Bach, Buch\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">ch (tras e, i, ä, ö, ü, ei, eu o consonante)\u003c/td>\u003ctd>«siseo suave, como «jy» susurrado»\u003c/td>\u003ctd class=\"de\">ich, Milch \u003cbutton class=\"say sm\" data-say=\"ich, Milch\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">sp / st (al inicio de palabra o raíz)\u003c/td>\u003ctd>«shp / sht»\u003c/td>\u003ctd class=\"de\">spielen, verstehen \u003cbutton class=\"say sm\" data-say=\"spielen, verstehen\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">s + vocal\u003c/td>\u003ctd>«z sonora, zumbido como de abeja (en el sur y Austria, s normal)»\u003c/td>\u003ctd class=\"de\">Sonne, Rose \u003cbutton class=\"say sm\" data-say=\"Sonne, Rose\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">z\u003c/td>\u003ctd>«ts»\u003c/td>\u003ctd class=\"de\">Zug, Pizza \u003cbutton class=\"say sm\" data-say=\"Zug, Pizza\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">v\u003c/td>\u003ctd>«f (en palabras extranjeras, v: Video, Vase)»\u003c/td>\u003ctd class=\"de\">Vater, Vogel \u003cbutton class=\"say sm\" data-say=\"Vater, Vogel\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">w\u003c/td>\u003ctd>«v (labios y dientes)»\u003c/td>\u003ctd class=\"de\">Wasser, Wald \u003cbutton class=\"say sm\" data-say=\"Wasser, Wald\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">j\u003c/td>\u003ctd>«y»\u003c/td>\u003ctd class=\"de\">ja, Jacke \u003cbutton class=\"say sm\" data-say=\"ja, Jacke\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">qu\u003c/td>\u003ctd>«kv»\u003c/td>\u003ctd class=\"de\">Qualle, bequem \u003cbutton class=\"say sm\" data-say=\"Qualle, bequem\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">ng\u003c/td>\u003ctd>«n nasal, sin pronunciar la g»\u003c/td>\u003ctd class=\"de\">lang, Finger \u003cbutton class=\"say sm\" data-say=\"lang, Finger\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">h tras vocal\u003c/td>\u003ctd>«muda, alarga la vocal»\u003c/td>\u003ctd class=\"de\">sehen, Uhr \u003cbutton class=\"say sm\" data-say=\"sehen, Uhr\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">-er al final\u003c/td>\u003ctd>«casi «a»»\u003c/td>\u003ctd class=\"de\">Vater, Lehrer \u003cbutton class=\"say sm\" data-say=\"Vater, Lehrer\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">r\u003c/td>\u003ctd>«gutural, en la garganta»\u003c/td>\u003ctd class=\"de\">rot, Brot \u003cbutton class=\"say sm\" data-say=\"rot, Brot\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003cfooter>En alemán todos los sustantivos se escriben con mayúscula inicial. Aprende cada palabra siempre con su artículo: el color te ayuda a recordar el género.\u003c/footer>\n\u003c/main>\n\u003cscript>\n(function(){\n  var voice=null;\n  function pick(){ try{ var v=speechSynthesis.getVoices(); voice=v.find(function(x){return /^de/i.test(x.lang);})||null; }catch(e){} }\n  try{ pick(); speechSynthesis.onvoiceschanged=pick; }catch(e){}\n  function say(t,cb){\n    try{ var u=new SpeechSynthesisUtterance(t); u.lang='de-DE'; if(voice) u.voice=voice; u.rate=.85; if(cb) u.onend=cb; speechSynthesis.speak(u); }catch(e){}\n  }\n  document.querySelectorAll('.say').forEach(function(b){ b.addEventListener('click',function(){ try{speechSynthesis.cancel();}catch(e){} say(b.dataset.say); }); });\n  document.getElementById('all').addEventListener('click',function(){\n    try{speechSynthesis.cancel();}catch(e){}\n    say('a, b, c, d, e, f, g, h, i, j, k, l, m, n, o, p, q, r, s, t, u, v, w, x, y, z. ä, ö, ü, ß');\n  });\n  var q=document.getElementById('quiz');\n  try{ if(localStorage.getItem('abc-quiz')==='1'){ document.body.classList.add('quiz'); q.setAttribute('aria-pressed','true'); } }catch(e){}\n  q.addEventListener('click',function(){\n    var on=document.body.classList.toggle('quiz'); q.setAttribute('aria-pressed',on);\n    try{ localStorage.setItem('abc-quiz',on?'1':'0'); }catch(e){}\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "zahlen": "\u003c!DOCTYPE html>\n\u003chtml lang=\"es\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n ground:var(--mas); } mark.n{ background:var(--neu); } mark.p{ background:var(--pl); }\n.legend{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:.6rem 1.2rem; background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:1.1rem 1.25rem; }\n.legend div{ display:flex; align-items:center; gap:.6rem; font-size:.95rem; }\n.sw{ width:2.2rem; height:1.35rem; border-radius:5px; flex:none; }\n.tools{ display:flex; flex-wrap:wrap; gap:.6rem; margin:1.2rem 0 0; }\n.tools button{ font:inherit; font-weight:400; font-size:.9rem; background:var(--surface); color:var(--ink); border:1px solid var(--rule); border-radius:999px; padding:.4rem 1rem; cursor:pointer; }\n.tools button[aria-pressed=\"true\"]{ background:var(--verb); color:var(--hl-ink); border-color:var(--verb); }\n\n.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:.8rem; margin-top:1rem; }\n.lt{ background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:.9rem 1rem 1rem; display:flex; flex-direction:column; gap:.3rem; }\n.lt p{ margin:0; }\n.top{ display:flex; justify-content:space-between; align-items:flex-start; }\n.glyph{ font-family:\"Literata\",Georgia,serif; font-weight:600; font-size:2.4rem; line-height:1; }\n.pron{ color:var(--muted); font-size:.95rem; min-height:1.5em; }\n.pron small{ display:block; font-size:.75rem; }\n.word{ font-family:\"Literata\",Georgia,serif; font-size:1.08rem; display:flex; align-items:center; gap:.3rem; margin-top:.3rem !important; }\n.word b{ font-weight:600; }\n.pl{ font-family:\"Literata\",Georgia,serif; font-size:.95rem; }\n.es{ color:var(--muted); font-size:.9rem; }\n.say{ background:none; border:none; cursor:pointer; font-size:1.1rem; padding:.1rem; line-height:1; opacity:.75; }\n.say:hover{ opacity:1; } .say.sm{ font-size:.85rem; }\nbody.quiz .pron, body.quiz .es{ filter:blur(5px); transition:filter .15s; }\nbody.quiz .lt:hover .pron, body.quiz .lt:hover .es, body.quiz .lt:focus-within .pron, body.quiz .lt:focus-within .es{ filter:none; }\n\n.scroll{ overflow-x:auto; margin:.6rem 0 1rem; border:1px solid var(--rule); border-radius:14px; background:var(--surface); }\ntable{ border-collapse:collapse; width:100%; min-width:480px; }\nth,td{ padding:.6rem .8rem; text-align:left; vertical-align:middle; border-bottom:1px solid var(--rule); }\ntr:last-child td{ border-bottom:none; }\nthead th{ font-weight:600; font-size:.9rem; }\n.big{ font-family:\"Literata\",Georgia,serif; font-size:1.15rem; font-weight:600; white-space:nowrap; }\ntd.de{ font-family:\"Literata\",Georgia,serif; }\nfooter{ margin-top:3rem; color:var(--muted); font-size:.85rem; }\n@media (max-width:600px){ main{ padding:1.6rem 1rem 3rem; } h2{ font-size:1.35rem; } .grid{ grid-template-columns:repeat(auto-fill,minmax(145px,1fr)); } }\n\nmark.v{ background:var(--verb); color:var(--hl-ink); font-weight:600; }\nmark.d{ box-shadow:inset 0 -3px 0 var(--dat-line); }\nmark.a{ box-shadow:inset 0 -3px 0 var(--akk-line); }\n.sw.line{ background:transparent; border-bottom:4px solid; border-radius:0; height:1rem; }\n.ex{ display:grid; gap:.25rem; }\n.ex p{ margin:0; display:flex; gap:.55rem; align-items:baseline; }\n.ex .lg{ flex:none; font-size:.7rem; font-weight:600; width:1.9rem; text-align:center; border:1px solid var(--rule); border-radius:4px; color:var(--muted); padding:.05rem 0; }\n.ex .de{ font-family:\"Literata\",Georgia,serif; font-size:1.08rem; }\n.ex .en,.ex .es2{ font-size:.93rem; color:var(--muted); }\n.ex .en mark,.ex .es2 mark{ color:var(--hl-ink); }\n.card{ background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:1rem 1.2rem; margin:.6rem 0; }\n.num{ font-family:\"Literata\",Georgia,serif; font-weight:600; font-size:2rem; line-height:1; }\n.grid.n{ grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); }\n.wde{ font-family:\"Literata\",Georgia,serif; font-size:1.05rem; }\ntd .say{ vertical-align:middle; }\nbody.quiz td.es{ filter:blur(5px); }\nbody.quiz tr:hover td.es, body.quiz tr:focus-within td.es{ filter:none; }\ntd.es{ color:var(--muted); }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003ch1>Zahlen, Tage und Monate\u003c/h1>\n\u003cp class=\"lead\">Números, días de la semana, meses y estaciones, con la pronunciación a la española y el mismo código de colores de tu tabla de gramática.\u003c/p>\n\u003cdiv class=\"legend\" aria-label=\"Leyenda de colores\">\n  \u003cdiv>\u003cspan class=\"sw\" style=\"background:var(--verb)\">\u003c/span>Verbo\u003c/div>\n  \u003cdiv>\u003cspan class=\"sw\" style=\"background:var(--mas)\">\u003c/span>Singular masculino (der)\u003c/div>\n  \u003cdiv>\u003cspan class=\"sw\" style=\"background:var(--fem)\">\u003c/span>Singular femenino (die)\u003c/div>\n  \u003cdiv>\u003cspan class=\"sw\" style=\"background:var(--neu)\">\u003c/span>Singular neutro (das)\u003c/div>\n  \u003cdiv>\u003cspan class=\"sw\" style=\"background:var(--pl)\">\u003c/span>Plural (die)\u003c/div>\n  \u003cdiv>\u003cspan class=\"sw line\" style=\"border-color:var(--akk-line)\">\u003c/span>Akkusativ (subrayado rojo)\u003c/div>\n  \u003cdiv>\u003cspan class=\"sw line\" style=\"border-color:var(--dat-line)\">\u003c/span>Dativ (subrayado azul marino)\u003c/div>\n\u003c/div>\n\u003cdiv class=\"tools\">\u003cbutton id=\"quiz\" aria-pressed=\"false\">Modo práctica: ocultar pronunciación y traducción\u003c/button>\u003c/div>\n\u003ch2>Números del 0 al 20\u003c/h2>\u003cp class=\"note\">Del 13 al 19 se forman con el número + \u003cem>zehn\u003c/em>. Ojo con dos que pierden letras: \u003cem>sech\u003cb>zehn\u003c/b>\u003c/em> (no sechszehn) y \u003cem>sieb\u003cb>zehn\u003c/b>\u003c/em> (no siebenzehn).\u003c/p>\n\u003cdiv class=\"grid n\">\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">0\u003c/span>\u003cbutton class=\"say\" data-say=\"null\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">null\u003c/p>\u003cp class=\"pron\">«nul»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">1\u003c/span>\u003cbutton class=\"say\" data-say=\"eins\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">eins\u003c/p>\u003cp class=\"pron\">«ains»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">2\u003c/span>\u003cbutton class=\"say\" data-say=\"zwei\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">zwei\u003c/p>\u003cp class=\"pron\">«tsvai»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">3\u003c/span>\u003cbutton class=\"say\" data-say=\"drei\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">drei\u003c/p>\u003cp class=\"pron\">«drai»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">4\u003c/span>\u003cbutton class=\"say\" data-say=\"vier\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">vier\u003c/p>\u003cp class=\"pron\">«fía»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">5\u003c/span>\u003cbutton class=\"say\" data-say=\"fünf\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">fünf\u003c/p>\u003cp class=\"pron\">«fünf»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">6\u003c/span>\u003cbutton class=\"say\" data-say=\"sechs\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">sechs\u003c/p>\u003cp class=\"pron\">«zeks»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">7\u003c/span>\u003cbutton class=\"say\" data-say=\"sieben\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">sieben\u003c/p>\u003cp class=\"pron\">«zíben»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">8\u003c/span>\u003cbutton class=\"say\" data-say=\"acht\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">acht\u003c/p>\u003cp class=\"pron\">«ajt»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">9\u003c/span>\u003cbutton class=\"say\" data-say=\"neun\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">neun\u003c/p>\u003cp class=\"pron\">«noin»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">10\u003c/span>\u003cbutton class=\"say\" data-say=\"zehn\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">zehn\u003c/p>\u003cp class=\"pron\">«tsen»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">11\u003c/span>\u003cbutton class=\"say\" data-say=\"elf\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">elf\u003c/p>\u003cp class=\"pron\">«elf»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">12\u003c/span>\u003cbutton class=\"say\" data-say=\"zwölf\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">zwölf\u003c/p>\u003cp class=\"pron\">«tsvölf»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">13\u003c/span>\u003cbutton class=\"say\" data-say=\"dreizehn\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">dreizehn\u003c/p>\u003cp class=\"pron\">«dráitsen»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">14\u003c/span>\u003cbutton class=\"say\" data-say=\"vierzehn\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">vierzehn\u003c/p>\u003cp class=\"pron\">«fírtsen»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">15\u003c/span>\u003cbutton class=\"say\" data-say=\"fünfzehn\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">fünfzehn\u003c/p>\u003cp class=\"pron\">«fünftsen»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">16\u003c/span>\u003cbutton class=\"say\" data-say=\"sechzehn\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">sechzehn\u003c/p>\u003cp class=\"pron\">«zéjtsen»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">17\u003c/span>\u003cbutton class=\"say\" data-say=\"siebzehn\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">siebzehn\u003c/p>\u003cp class=\"pron\">«zíptsen»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">18\u003c/span>\u003cbutton class=\"say\" data-say=\"achtzehn\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">achtzehn\u003c/p>\u003cp class=\"pron\">«ájtsen»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">19\u003c/span>\u003cbutton class=\"say\" data-say=\"neunzehn\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">neunzehn\u003c/p>\u003cp class=\"pron\">«nóintsen»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">20\u003c/span>\u003cbutton class=\"say\" data-say=\"zwanzig\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">zwanzig\u003c/p>\u003cp class=\"pron\">«tsvántsij»\u003c/p>\u003c/article>\u003c/div>\n\u003ch2>Decenas, cien y mil\u003c/h2>\u003cp class=\"note\">Las decenas terminan en \u003cem>-zig\u003c/em>, excepto \u003cem>dreißig\u003c/em>, que lleva ß. La terminación \u003cem>-ig\u003c/em> suena «ij» suave, como en \u003cem>ich\u003c/em> (en el sur de Alemania y Austria se dice «ik»).\u003c/p>\n\u003cdiv class=\"grid n\">\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">30\u003c/span>\u003cbutton class=\"say\" data-say=\"dreißig\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">dreißig\u003c/p>\u003cp class=\"pron\">«dráisij»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">40\u003c/span>\u003cbutton class=\"say\" data-say=\"vierzig\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">vierzig\u003c/p>\u003cp class=\"pron\">«fírtsij»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">50\u003c/span>\u003cbutton class=\"say\" data-say=\"fünfzig\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">fünfzig\u003c/p>\u003cp class=\"pron\">«fünftsij»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">60\u003c/span>\u003cbutton class=\"say\" data-say=\"sechzig\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">sechzig\u003c/p>\u003cp class=\"pron\">«zéjtsij»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">70\u003c/span>\u003cbutton class=\"say\" data-say=\"siebzig\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">siebzig\u003c/p>\u003cp class=\"pron\">«zíptsij»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">80\u003c/span>\u003cbutton class=\"say\" data-say=\"achtzig\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">achtzig\u003c/p>\u003cp class=\"pron\">«ájtsij»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">90\u003c/span>\u003cbutton class=\"say\" data-say=\"neunzig\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">neunzig\u003c/p>\u003cp class=\"pron\">«nóintsij»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">100\u003c/span>\u003cbutton class=\"say\" data-say=\"hundert\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">hundert\u003c/p>\u003cp class=\"pron\">«húndert»\u003c/p>\u003c/article>\n\u003carticle class=\"lt\">\u003cdiv class=\"top\">\u003cspan class=\"num\">1000\u003c/span>\u003cbutton class=\"say\" data-say=\"tausend\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/div>\u003cp class=\"wde\">tausend\u003c/p>\u003cp class=\"pron\">«táuzent»\u003c/p>\u003c/article>\u003c/div>\n\u003ch2>Cómo se forman los números grandes\u003c/h2>\n\u003cp class=\"note\">Del 21 al 99 el alemán dice primero la unidad y luego la decena, como «uno y veinte». Todo se escribe junto, en una sola palabra, y \u003cem>eins\u003c/em> pierde la s: \u003cem>ein\u003c/em>undzwanzig.\u003c/p>\n\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Número\u003c/th>\u003cth>Se dice\u003c/th>\u003cth>Literalmente\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd class=\"big\">21\u003c/td>\u003ctd class=\"wde\">einundzwanzig \u003cbutton class=\"say sm\" data-say=\"einundzwanzig\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">uno y veinte\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">35\u003c/td>\u003ctd class=\"wde\">fünfunddreißig \u003cbutton class=\"say sm\" data-say=\"fünfunddreißig\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">cinco y treinta\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">68\u003c/td>\u003ctd class=\"wde\">achtundsechzig \u003cbutton class=\"say sm\" data-say=\"achtundsechzig\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">ocho y sesenta\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">99\u003c/td>\u003ctd class=\"wde\">neunundneunzig \u003cbutton class=\"say sm\" data-say=\"neunundneunzig\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">nueve y noventa\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">101\u003c/td>\u003ctd class=\"wde\">hunderteins \u003cbutton class=\"say sm\" data-say=\"hunderteins\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">cien uno\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">345\u003c/td>\u003ctd class=\"wde\">dreihundertfünfundvierzig \u003cbutton class=\"say sm\" data-say=\"dreihundertfünfundvierzig\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">trescientos cinco y cuarenta\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">2026\u003c/td>\u003ctd class=\"wde\">zweitausendsechsundzwanzig \u003cbutton class=\"say sm\" data-say=\"zweitausendsechsundzwanzig\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">dos mil seis y veinte\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"card ex\">\n  \u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Ich \u003cmark class=\"v\">habe\u003c/mark> \u003cmark class=\"p a\">drei Kinder\u003c/mark>. \u003cbutton class=\"say sm\" data-say=\"Ich habe drei Kinder.\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">I \u003cmark class=\"v\">have\u003c/mark> \u003cmark class=\"p a\">three children\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es2\">\u003cmark class=\"v\">Tengo\u003c/mark> \u003cmark class=\"p a\">tres hijos\u003c/mark>.\u003c/span>\u003c/p>\n\u003c/div>\n\u003ch2>Ordinales para las fechas\u003c/h2>\n\u003cp class=\"note\">Del 1 al 19 se añade \u003cem>-te\u003c/em> y desde el 20 \u003cem>-ste\u003c/em>. Irregulares: \u003cem>erste\u003c/em>, \u003cem>dritte\u003c/em>, \u003cem>siebte\u003c/em>, \u003cem>achte\u003c/em>. Por escrito se pone un punto: 1. = erste.\u003c/p>\n\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Número\u003c/th>\u003cth>Ordinal\u003c/th>\u003cth>Español\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd class=\"big\">1.\u003c/td>\u003ctd class=\"wde\">erste \u003cbutton class=\"say sm\" data-say=\"erste\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">primero\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">2.\u003c/td>\u003ctd class=\"wde\">zweite \u003cbutton class=\"say sm\" data-say=\"zweite\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">segundo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">3.\u003c/td>\u003ctd class=\"wde\">dritte \u003cbutton class=\"say sm\" data-say=\"dritte\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">tercero\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">4.\u003c/td>\u003ctd class=\"wde\">vierte \u003cbutton class=\"say sm\" data-say=\"vierte\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">cuarto\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">7.\u003c/td>\u003ctd class=\"wde\">siebte \u003cbutton class=\"say sm\" data-say=\"siebte\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">séptimo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">8.\u003c/td>\u003ctd class=\"wde\">achte \u003cbutton class=\"say sm\" data-say=\"achte\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">octavo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">19.\u003c/td>\u003ctd class=\"wde\">neunzehnte \u003cbutton class=\"say sm\" data-say=\"neunzehnte\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">decimonoveno\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">20.\u003c/td>\u003ctd class=\"wde\">zwanzigste \u003cbutton class=\"say sm\" data-say=\"zwanzigste\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">vigésimo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"big\">31.\u003c/td>\u003ctd class=\"wde\">einunddreißigste \u003cbutton class=\"say sm\" data-say=\"einunddreißigste\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">trigésimo primero\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"card ex\">\n  \u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Heute \u003cmark class=\"v\">ist\u003c/mark> \u003cmark class=\"m\">der erste Oktober\u003c/mark>. \u003cbutton class=\"say sm\" data-say=\"Heute ist der erste Oktober.\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">Today \u003cmark class=\"v\">is\u003c/mark> \u003cmark class=\"m\">the first of October\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es2\">Hoy \u003cmark class=\"v\">es\u003c/mark> \u003cmark class=\"m\">primero de octubre\u003c/mark>.\u003c/span>\u003c/p>\n\u003c/div>\n\u003ch2>Los días de la semana\u003c/h2>\u003cp class=\"note\">Todos son masculinos (\u003cem>der\u003c/em>). La g final suena «k»: \u003cem>Montag\u003c/em> = «móntak». En el norte de Alemania al sábado también le dicen \u003cem>Sonnabend\u003c/em>.\u003c/p>\n\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Singular\u003c/th>\u003cth>Pronunciación\u003c/th>\u003cth class=\"hp\" style=\"background:var(--pl);color:var(--hl-ink)\">Plural\u003c/th>\u003cth>Español\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der Montag\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der Montag\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«móntak»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Montage\u003c/mark>\u003c/td>\u003ctd class=\"es\">lunes\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der Dienstag\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der Dienstag\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«díinstak»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Dienstage\u003c/mark>\u003c/td>\u003ctd class=\"es\">martes\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der Mittwoch\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der Mittwoch\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«mítvoj»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Mittwoche\u003c/mark>\u003c/td>\u003ctd class=\"es\">miércoles\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der Donnerstag\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der Donnerstag\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«dónerstak»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Donnerstage\u003c/mark>\u003c/td>\u003ctd class=\"es\">jueves\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der Freitag\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der Freitag\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«fráitak»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Freitage\u003c/mark>\u003c/td>\u003ctd class=\"es\">viernes\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der Samstag\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der Samstag\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«zámstak»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Samstage\u003c/mark>\u003c/td>\u003ctd class=\"es\">sábado\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der Sonntag\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der Sonntag\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«zóntak»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Sonntage\u003c/mark>\u003c/td>\u003ctd class=\"es\">domingo\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"card ex\">\n  \u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"m d\">Am Montag\u003c/mark> \u003cmark class=\"v\">arbeite\u003c/mark> ich. \u003cbutton class=\"say sm\" data-say=\"Am Montag arbeite ich.\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"m d\">On Monday\u003c/mark> I \u003cmark class=\"v\">work\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es2\">\u003cmark class=\"m d\">El lunes\u003c/mark> \u003cmark class=\"v\">trabajo\u003c/mark>.\u003c/span>\u003c/p>\n\u003c/div>\n\u003cp class=\"note\">\u003cem>am\u003c/em> = \u003cem>an dem\u003c/em>: con los días se usa \u003cem>am\u003c/em>, por eso va en Dativ.\u003c/p>\n\u003ch2>Los meses\u003c/h2>\u003cp class=\"note\">También todos masculinos. La j suena «y» (\u003cem>Januar\u003c/em> = «yánuar») y en \u003cem>November\u003c/em> la v suena v porque viene del latín. En Austria a enero le dicen \u003cem>Jänner\u003c/em>. Truco: por teléfono los alemanes dicen «Juno» y «Julei» para no confundir junio y julio.\u003c/p>\n\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Singular\u003c/th>\u003cth>Pronunciación\u003c/th>\u003cth class=\"hp\" style=\"background:var(--pl);color:var(--hl-ink)\">Plural\u003c/th>\u003cth>Español\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der Januar\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der Januar\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«yánuar»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Januare\u003c/mark>\u003c/td>\u003ctd class=\"es\">enero\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der Februar\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der Februar\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«fébruar»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Februare\u003c/mark>\u003c/td>\u003ctd class=\"es\">febrero\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der März\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der März\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«merts»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Märze\u003c/mark>\u003c/td>\u003ctd class=\"es\">marzo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der April\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der April\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«april»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Aprile\u003c/mark>\u003c/td>\u003ctd class=\"es\">abril\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der Mai\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der Mai\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«mai»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Maie\u003c/mark>\u003c/td>\u003ctd class=\"es\">mayo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der Juni\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der Juni\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«yúni»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Junis\u003c/mark>\u003c/td>\u003ctd class=\"es\">junio\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der Juli\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der Juli\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«yúli»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Julis\u003c/mark>\u003c/td>\u003ctd class=\"es\">julio\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der August\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der August\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«augúst»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Auguste\u003c/mark>\u003c/td>\u003ctd class=\"es\">agosto\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der September\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der September\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«zeptémber»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die September\u003c/mark>\u003c/td>\u003ctd class=\"es\">septiembre\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der Oktober\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der Oktober\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«október»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Oktober\u003c/mark>\u003c/td>\u003ctd class=\"es\">octubre\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der November\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der November\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«novémber»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die November\u003c/mark>\u003c/td>\u003ctd class=\"es\">noviembre\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der Dezember\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der Dezember\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«detsémber»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Dezember\u003c/mark>\u003c/td>\u003ctd class=\"es\">diciembre\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"card ex\">\n  \u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"m d\">Im Januar\u003c/mark> \u003cmark class=\"v\">ist\u003c/mark> es kalt. \u003cbutton class=\"say sm\" data-say=\"Im Januar ist es kalt.\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"m d\">In January\u003c/mark> it \u003cmark class=\"v\">is\u003c/mark> cold.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es2\">\u003cmark class=\"m d\">En enero\u003c/mark> \u003cmark class=\"v\">hace\u003c/mark> frío.\u003c/span>\u003c/p>\n\u003c/div>\n\u003cp class=\"note\">\u003cem>im\u003c/em> = \u003cem>in dem\u003c/em>: con meses y estaciones se usa \u003cem>im\u003c/em>, también en Dativ.\u003c/p>\n\u003ch2>Las estaciones\u003c/h2>\u003cp class=\"note\">Igual que días y meses: todas masculinas.\u003c/p>\n\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Singular\u003c/th>\u003cth>Pronunciación\u003c/th>\u003cth class=\"hp\" style=\"background:var(--pl);color:var(--hl-ink)\">Plural\u003c/th>\u003cth>Español\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der Frühling\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der Frühling\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«früling»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Frühlinge\u003c/mark>\u003c/td>\u003ctd class=\"es\">primavera\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der Sommer\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der Sommer\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«zómer»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Sommer\u003c/mark>\u003c/td>\u003ctd class=\"es\">verano\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der Herbst\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der Herbst\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«jerpst»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Herbste\u003c/mark>\u003c/td>\u003ctd class=\"es\">otoño\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der Winter\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der Winter\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">«vínter»\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Winter\u003c/mark>\u003c/td>\u003ctd class=\"es\">invierno\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>Palabras de tiempo\u003c/h2>\u003cp class=\"note\">Aquí sí cambian los géneros: fíjate en los colores.\u003c/p>\n\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Singular\u003c/th>\u003cth class=\"hp\" style=\"background:var(--pl);color:var(--hl-ink)\">Plural\u003c/th>\u003cth>Español\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der Tag\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der Tag\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Tage\u003c/mark>\u003c/td>\u003ctd class=\"es\">día\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"f\">die Woche\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"die Woche\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Wochen\u003c/mark>\u003c/td>\u003ctd class=\"es\">semana\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"n\">das Wochenende\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"das Wochenende\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Wochenenden\u003c/mark>\u003c/td>\u003ctd class=\"es\">fin de semana\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"m\">der Monat\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"der Monat\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Monate\u003c/mark>\u003c/td>\u003ctd class=\"es\">mes\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"n\">das Jahr\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"das Jahr\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Jahre\u003c/mark>\u003c/td>\u003ctd class=\"es\">año\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"wde\">\u003cmark class=\"f\">die Stunde\u003c/mark> \u003cbutton class=\"say sm\" data-say=\"die Stunde\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"wde\">\u003cmark class=\"p\">die Stunden\u003c/mark>\u003c/td>\u003ctd class=\"es\">hora\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Adverbio\u003c/th>\u003cth>Español\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"wde\">gestern \u003cbutton class=\"say sm\" data-say=\"gestern\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">ayer\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"wde\">heute \u003cbutton class=\"say sm\" data-say=\"heute\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">hoy\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"wde\">morgen \u003cbutton class=\"say sm\" data-say=\"morgen\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">mañana\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"wde\">übermorgen \u003cbutton class=\"say sm\" data-say=\"übermorgen\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">pasado mañana\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"wde\">jetzt \u003cbutton class=\"say sm\" data-say=\"jetzt\" aria-label=\"Escuchar\">🔊\u003c/button>\u003c/td>\u003ctd class=\"es\">ahora\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfooter>Los días, los meses y las estaciones son masculinos, así que con ellos no hay que adivinar el género.\u003c/footer>\n\u003c/main>\n\u003cscript>var KEY='g1-quiz';\n(function(){\n  var voice=null;\n  function pick(){ try{ var v=speechSynthesis.getVoices(); voice=v.find(function(x){return /^de/i.test(x.lang);})||null; }catch(e){} }\n  try{ pick(); speechSynthesis.onvoiceschanged=pick; }catch(e){}\n  function say(t,cb){\n    try{ var u=new SpeechSynthesisUtterance(t); u.lang='de-DE'; if(voice) u.voice=voice; u.rate=.85; if(cb) u.onend=cb; speechSynthesis.speak(u); }catch(e){}\n  }\n  document.querySelectorAll('.say').forEach(function(b){ b.addEventListener('click',function(){ try{speechSynthesis.cancel();}catch(e){} say(b.dataset.say); }); });\n  var q=document.getElementById('quiz');\n  try{ if(localStorage.getItem(KEY)==='1'){ document.body.classList.add('quiz'); q.setAttribute('aria-pressed','true'); } }catch(e){}\n  q.addEventListener('click',function(){\n    var on=document.body.classList.toggle('quiz'); q.setAttribute('aria-pressed',on);\n    try{ localStorage.setItem(KEY,on?'1':'0'); }catch(e){}\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>", "grundlagen": "\u003c!DOCTYPE html>\n\u003chtml lang=\"es\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Gramática alemana · tabla de estudio\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --bg:#FBFAFD; --surface:#FFFFFF; --ink:#2C2A36; --muted:#6D6A7C; --rule:#E4E1EC;\n  --verb:#BFE3F8; --fem:#F9CADF; --mas:#CBEBC6; --neu:#DCCBF2; --pl:#FDD8B5;\n  --dat:#AFC0E2; --dat-line:#6E86BC; --akk:#F7B7B4; --akk-line:#E07B78;\n  --t1:#FFF0A6; --t2:#BDEDE6; --t3:#FFCFC0; --t4:#E4F3B4; --t5:#D8E0EA; --t6:#ECDDBF; --t7:#F3DDF6; --t8:#E3E3E3;\n  --hl-ink:#2A2733;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){ --bg:#1D1C24; --surface:#26252F; --ink:#ECEAF3; --muted:#A8A5B8; --rule:#3A3846; }\n}\n:root[data-theme=\"dark\"]{ --bg:#1D1C24; --surface:#26252F; --ink:#ECEAF3; --muted:#A8A5B8; --rule:#3A3846; }\n:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }\nhtml{ scroll-padding-top:env(safe-area-inset-top,0px); }\n*,*::before,*::after{ box-sizing:inherit; }\nbody{ margin:0; background:var(--bg); color:var(--ink); font-family:\"Lexend\",system-ui,-apple-system,\"Segoe UI\",sans-serif; font-weight:300; line-height:1.55; }\nmain{ max-width:1040px; margin:0 auto; padding:2.5rem 1.25rem 4rem; }\nh1{ font-family:\"Literata\",Georgia,serif; font-weight:600; font-size:clamp(2rem,5vw,3.1rem); line-height:1.1; margin:0 0 .5rem; letter-spacing:-.01em; }\n.lead{ color:var(--muted); max-width:62ch; margin:0 0 2rem; }\nh2{ font-family:\"Literata\",Georgia,serif; font-weight:600; font-size:1.6rem; margin:3rem 0 .4rem; }\nh3{ font-weight:600; font-size:1.05rem; margin:1.6rem 0 .4rem; }\np.note{ color:var(--muted); margin:.2rem 0 1rem; max-width:70ch; }\n\n/* resaltados */\nmark{ background:none; color:inherit; padding:.05em .28em; border-radius:5px; }\nmark.v,mark.f,mark.m,mark.n,mark.p{ color:var(--hl-ink); }\nmark.v{ background:var(--verb); font-weight:600; }\nmark.f{ background:var(--fem); }\nmark.m{ background:var(--mas); }\nmark.n{ background:var(--neu); }\nmark.p{ background:var(--pl); }\nmark.d{ box-shadow:inset 0 -3px 0 var(--dat-line); }\nmark.a{ box-shadow:inset 0 -3px 0 var(--akk-line); }\n\n/* leyenda */\n.legend{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:.6rem 1.2rem; background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:1.1rem 1.25rem; }\n.legend div{ display:flex; align-items:center; gap:.6rem; font-size:.95rem; }\n.sw{ width:2.2rem; height:1.35rem; border-radius:5px; flex:none; }\n.sw.line{ background:transparent; border-bottom:4px solid; border-radius:0; height:1rem; }\n.tenses{ display:flex; flex-wrap:wrap; gap:.45rem; margin-top:.9rem; }\n.chip{ color:var(--hl-ink); padding:.2rem .7rem; border-radius:999px; font-size:.88rem; font-weight:400; }\n\n/* tablas */\n.scroll{ overflow-x:auto; margin:.6rem 0 1rem; border:1px solid var(--rule); border-radius:14px; background:var(--surface); }\ntable{ border-collapse:collapse; width:100%; min-width:560px; }\nth,td{ padding:.6rem .8rem; text-align:left; vertical-align:top; border-bottom:1px solid var(--rule); }\ntr:last-child td{ border-bottom:none; }\nthead th{ font-weight:600; font-size:.9rem; }\nth.hm{ background:var(--mas); color:var(--hl-ink);} th.hf{ background:var(--fem); color:var(--hl-ink);}\nth.hn{ background:var(--neu); color:var(--hl-ink);} th.hp{ background:var(--pl); color:var(--hl-ink);}\nth.hakk{ background:var(--akk); color:var(--hl-ink);} th.hdat{ background:var(--dat); color:var(--hl-ink);}\nth.hv{ background:var(--verb); color:var(--hl-ink);}\ntd.case{ font-weight:600; white-space:nowrap; }\ntd.cakk{ box-shadow:inset 4px 0 0 var(--akk-line); } td.cdat{ box-shadow:inset 4px 0 0 var(--dat-line); }\n.big{ font-family:\"Literata\",Georgia,serif; font-size:1.15rem; }\n\n/* ejemplos */\n.ex{ display:grid; gap:.25rem; }\n.ex p{ margin:0; display:flex; gap:.55rem; align-items:baseline; }\n.ex .lg{ flex:none; font-size:.7rem; font-weight:600; width:1.9rem; text-align:center; border:1px solid var(--rule); border-radius:4px; color:var(--muted); padding:.05rem 0; }\n.ex .de{ font-family:\"Literata\",Georgia,serif; font-size:1.08rem; }\n.ex .en,.ex .es{ font-size:.93rem; color:var(--muted); }\n.ex .en mark,.ex .es mark{ color:var(--hl-ink); }\n.card{ background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:1rem 1.2rem; margin:.6rem 0; }\n\n/* tiempos */\ntr.t td:first-child{ font-weight:600; white-space:nowrap; }\ntr.t1 td:first-child{ background:var(--t1); color:var(--hl-ink);} tr.t2 td:first-child{ background:var(--t2); color:var(--hl-ink);}\ntr.t3 td:first-child{ background:var(--t3); color:var(--hl-ink);} tr.t4 td:first-child{ background:var(--t4); color:var(--hl-ink);}\ntr.t5 td:first-child{ background:var(--t5); color:var(--hl-ink);} tr.t6 td:first-child{ background:var(--t6); color:var(--hl-ink);}\ntr.t7 td:first-child{ background:var(--t7); color:var(--hl-ink);} tr.t8 td:first-child{ background:var(--t8); color:var(--hl-ink);}\ntr.t td:first-child small{ display:block; font-weight:300; font-size:.8rem; }\n.form{ font-size:.9rem; }\ntd > .ex + .ex{ margin-top:.8rem; padding-top:.8rem; border-top:1px dashed var(--rule); }\n\nfooter{ margin-top:3rem; color:var(--muted); font-size:.85rem; }\n@media (max-width:600px){ main{ padding:1.6rem 1rem 3rem; } h2{ font-size:1.35rem; } }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\n\u003ch1>Gramática alemana\u003c/h1>\n\u003cp class=\"lead\">Tabla de estudio con código de colores. Cada ejemplo aparece en alemán, inglés y español; los colores siempre siguen el género y el caso de la palabra en alemán.\u003c/p>\n\n\u003cdiv class=\"legend\" aria-label=\"Leyenda de colores\">\n  \u003cdiv>\u003cspan class=\"sw\" style=\"background:var(--verb)\">\u003c/span>Verbo\u003c/div>\n  \u003cdiv>\u003cspan class=\"sw\" style=\"background:var(--mas)\">\u003c/span>Singular masculino\u003c/div>\n  \u003cdiv>\u003cspan class=\"sw\" style=\"background:var(--fem)\">\u003c/span>Singular femenino\u003c/div>\n  \u003cdiv>\u003cspan class=\"sw\" style=\"background:var(--neu)\">\u003c/span>Singular neutro\u003c/div>\n  \u003cdiv>\u003cspan class=\"sw\" style=\"background:var(--pl)\">\u003c/span>Plural\u003c/div>\n  \u003cdiv>\u003cspan class=\"sw line\" style=\"border-color:var(--akk-line)\">\u003c/span>Akkusativ (subrayado rojo)\u003c/div>\n  \u003cdiv>\u003cspan class=\"sw line\" style=\"border-color:var(--dat-line)\">\u003c/span>Dativ (subrayado azul marino)\u003c/div>\n\u003c/div>\n\u003cdiv class=\"tenses\" aria-label=\"Colores de los tiempos verbales\">\n  \u003cspan class=\"chip\" style=\"background:var(--t1)\">Präsens\u003c/span>\n  \u003cspan class=\"chip\" style=\"background:var(--t2)\">Präteritum\u003c/span>\n  \u003cspan class=\"chip\" style=\"background:var(--t3)\">Perfekt\u003c/span>\n  \u003cspan class=\"chip\" style=\"background:var(--t4)\">Plusquamperfekt\u003c/span>\n  \u003cspan class=\"chip\" style=\"background:var(--t5)\">Futur I\u003c/span>\n  \u003cspan class=\"chip\" style=\"background:var(--t6)\">Futur II\u003c/span>\n  \u003cspan class=\"chip\" style=\"background:var(--t7)\">Konjunktiv II\u003c/span>\n  \u003cspan class=\"chip\" style=\"background:var(--t8)\">Imperativ\u003c/span>\n\u003c/div>\n\n\u003c!-- ARTÍCULOS DEFINIDOS -->\n\u003ch2>Artículos definidos\u003c/h2>\n\u003cp class=\"note\">El fondo indica el género y el subrayado indica el caso. En plural dativo el sustantivo suele añadir \u003cstrong>-n\u003c/strong> (den Kinder\u003cstrong>n\u003c/strong>).\u003c/p>\n\u003cdiv class=\"scroll\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Caso\u003c/th>\u003cth class=\"hm\">Masculino\u003c/th>\u003cth class=\"hf\">Femenino\u003c/th>\u003cth class=\"hn\">Neutro\u003c/th>\u003cth class=\"hp\">Plural\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"case\">Nominativ\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"m\">der\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"f\">die\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"n\">das\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"p\">die\u003c/mark>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"case cakk\">Akkusativ\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"m a\">den\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"f a\">die\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"n a\">das\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"p a\">die\u003c/mark>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"case cdat\">Dativ\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"m d\">dem\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"f d\">der\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"n d\">dem\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"p d\">den\u003c/mark> …-n\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"case\">Genitiv\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"m\">des\u003c/mark> …-s\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"f\">der\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"n\">des\u003c/mark> …-s\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"p\">der\u003c/mark>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003cdiv class=\"card ex\">\n  \u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"m\">Der Hund\u003c/mark> \u003cmark class=\"v\">schläft\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"m\">The dog\u003c/mark> \u003cmark class=\"v\">sleeps\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"m\">El perro\u003c/mark> \u003cmark class=\"v\">duerme\u003c/mark>.\u003c/span>\u003c/p>\n\u003c/div>\n\u003cdiv class=\"card ex\">\n  \u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Ich \u003cmark class=\"v\">sehe\u003c/mark> \u003cmark class=\"m a\">den Mann\u003c/mark>, \u003cmark class=\"f a\">die Frau\u003c/mark> und \u003cmark class=\"n a\">das Kind\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">I \u003cmark class=\"v\">see\u003c/mark> \u003cmark class=\"m a\">the man\u003c/mark>, \u003cmark class=\"f a\">the woman\u003c/mark> and \u003cmark class=\"n a\">the child\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"v\">Veo\u003c/mark> \u003cmark class=\"m a\">al hombre\u003c/mark>, \u003cmark class=\"f a\">a la mujer\u003c/mark> y \u003cmark class=\"n a\">al niño\u003c/mark>.\u003c/span>\u003c/p>\n\u003c/div>\n\u003cdiv class=\"card ex\">\n  \u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Ich \u003cmark class=\"v\">gebe\u003c/mark> \u003cmark class=\"n d\">dem Kind\u003c/mark> \u003cmark class=\"n a\">ein Buch\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">I \u003cmark class=\"v\">give\u003c/mark> \u003cmark class=\"n d\">the child\u003c/mark> \u003cmark class=\"n a\">a book\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"v\">Le doy\u003c/mark> \u003cmark class=\"n a\">un libro\u003c/mark> \u003cmark class=\"n d\">al niño\u003c/mark>.\u003c/span>\u003c/p>\n\u003c/div>\n\u003cdiv class=\"card ex\">\n  \u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Ich \u003cmark class=\"v\">helfe\u003c/mark> \u003cmark class=\"p d\">den Kindern\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">I \u003cmark class=\"v\">help\u003c/mark> \u003cmark class=\"p d\">the children\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"v\">Ayudo\u003c/mark> \u003cmark class=\"p d\">a los niños\u003c/mark>.\u003c/span>\u003c/p>\n\u003c/div>\n\u003cdiv class=\"card ex\">\n  \u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">\u003cmark class=\"n\">Das Auto\u003c/mark> \u003cmark class=\"m\">des Vaters\u003c/mark> \u003cmark class=\"v\">ist\u003c/mark> neu.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">\u003cmark class=\"m\">The father's\u003c/mark> \u003cmark class=\"n\">car\u003c/mark> \u003cmark class=\"v\">is\u003c/mark> new.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"n\">El coche\u003c/mark> \u003cmark class=\"m\">del padre\u003c/mark> \u003cmark class=\"v\">es\u003c/mark> nuevo.\u003c/span>\u003c/p>\n\u003c/div>\n\n\u003c!-- ARTÍCULOS INDEFINIDOS -->\n\u003ch2>Artículos indefinidos y negación con kein\u003c/h2>\n\u003cp class=\"note\">\u003cem>ein\u003c/em> no tiene plural; para el plural negativo se usa \u003cem>keine\u003c/em>. \u003cem>kein\u003c/em> se declina igual que \u003cem>ein\u003c/em>.\u003c/p>\n\u003cdiv class=\"scroll\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Caso\u003c/th>\u003cth class=\"hm\">Masculino\u003c/th>\u003cth class=\"hf\">Femenino\u003c/th>\u003cth class=\"hn\">Neutro\u003c/th>\u003cth class=\"hp\">Plural (kein)\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"case\">Nominativ\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"m\">ein\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"f\">eine\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"n\">ein\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"p\">keine\u003c/mark>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"case cakk\">Akkusativ\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"m a\">einen\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"f a\">eine\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"n a\">ein\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"p a\">keine\u003c/mark>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"case cdat\">Dativ\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"m d\">einem\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"f d\">einer\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"n d\">einem\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"p d\">keinen\u003c/mark>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"case\">Genitiv\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"m\">eines\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"f\">einer\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"n\">eines\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"p\">keiner\u003c/mark>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003cdiv class=\"card ex\">\n  \u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Ich \u003cmark class=\"v\">habe\u003c/mark> \u003cmark class=\"m a\">einen Bruder\u003c/mark> und \u003cmark class=\"f a\">eine Schwester\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">I \u003cmark class=\"v\">have\u003c/mark> \u003cmark class=\"m a\">a brother\u003c/mark> and \u003cmark class=\"f a\">a sister\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"v\">Tengo\u003c/mark> \u003cmark class=\"m a\">un hermano\u003c/mark> y \u003cmark class=\"f a\">una hermana\u003c/mark>.\u003c/span>\u003c/p>\n\u003c/div>\n\u003cdiv class=\"card ex\">\n  \u003cp>\u003cspan class=\"lg\">DE\u003c/span>\u003cspan class=\"de\">Sie \u003cmark class=\"v\">wohnt\u003c/mark> bei \u003cmark class=\"f d\">einer Freundin\u003c/mark> und \u003cmark class=\"v\">hat\u003c/mark> \u003cmark class=\"p a\">keine Kinder\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">EN\u003c/span>\u003cspan class=\"en\">She \u003cmark class=\"v\">lives\u003c/mark> with \u003cmark class=\"f d\">a friend\u003c/mark> and \u003cmark class=\"v\">has\u003c/mark> \u003cmark class=\"p a\">no children\u003c/mark>.\u003c/span>\u003c/p>\n  \u003cp>\u003cspan class=\"lg\">ES\u003c/span>\u003cspan class=\"es\">\u003cmark class=\"v\">Vive\u003c/mark> con \u003cmark class=\"f d\">una amiga\u003c/mark> y no \u003cmark class=\"v\">tiene\u003c/mark> \u003cmark class=\"p a\">hijos\u003c/mark>.\u003c/span>\u003c/p>\n\u003c/div>\n\n\u003c!-- PRONOMBRES -->\n\u003ch2>Pronombres personales\u003c/h2>\n\u003cdiv class=\"scroll\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Español\u003c/th>\u003cth>Nominativ\u003c/th>\u003cth class=\"hakk\">Akkusativ\u003c/th>\u003cth class=\"hdat\">Dativ\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>yo\u003c/td>\u003ctd class=\"big\">ich\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"a\">mich\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"d\">mir\u003c/mark>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>tú\u003c/td>\u003ctd class=\"big\">du\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"a\">dich\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"d\">dir\u003c/mark>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>él\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"m\">er\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"m a\">ihn\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"m d\">ihm\u003c/mark>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ella\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"f\">sie\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"f a\">sie\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"f d\">ihr\u003c/mark>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ello (neutro)\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"n\">es\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"n a\">es\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"n d\">ihm\u003c/mark>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>nosotros\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"p\">wir\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"p a\">uns\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"p d\">uns\u003c/mark>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>vosotros / ustedes (inf.)\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"p\">ihr\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"p a\">euch\u003c/mark>\u003c/td>\u003ctd class=\"big\">\u003cmark class=\"p d\">euch\u003c/mark>\u003c/td>\u003c/
